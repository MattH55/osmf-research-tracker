slug: bremelanotide
names:
  inn: "bremelanotide"
  common: ["Bremelanotide", "PT-141"]
  codes: ["PT-141"]
  brands: ["Vyleesi"]
  cas: null
sequence: null
sequence_note: "Cyclic heptapeptide: Ac-Nle-cyclo-(Asp-His-D-Phe-Arg-Trp-Lys-OH), per the US prescribing information. Contains norleucine and a D-amino acid, so no plain one-letter sequence is given. It differs from melanotan II only at the C-terminus (free acid rather than amide)."
class_by_jurisdiction: {US: A, EU: C, UK: C, CA: C, AU: C, JP: null, CN: null}
what_it_is: >-
  A synthetic cyclic peptide that activates melanocortin receptors. PT-141 is the
  development code for the same molecule. In the US it is an approved
  prescription medicine (Vyleesi) for one indication: acquired, generalized
  hypoactive sexual desire disorder in premenopausal women. No approval was found
  in the EU, UK, Canada or Australia. Outside that single US indication, material
  sold as "PT-141" powder is an unapproved product of unverified identity and
  purity, regardless of the molecule's approved status in the US.
evidence:
  - indication: "Hypoactive sexual desire disorder (HSDD) in premenopausal women"
    tier: E1
    human_rcts: 2
    human_trials_any: null
    summary: >-
      Two phase 3 randomised placebo-controlled trials (RECONNECT; 1,267 women
      randomised in total) found small but statistically significant improvements
      in a sexual-desire score and reductions in desire-related distress compared
      with placebo. Nausea, flushing and headache were more frequent than with
      placebo. A 52-week open-label extension (684 entered, 272 completed) reported
      no new safety signals. An independent re-analysis of the trial data reported
      substantially higher adverse-event-related discontinuation on bremelanotide and
      criticised incomplete reporting of protocol-listed outcomes.
    citations:
      - doi: "10.1097/aog.0000000000003500"
        title: "Bremelanotide for the Treatment of Hypoactive Sexual Desire Disorder"
        year: 2019
        finding: "Two phase 3 RCTs: greater increase in sexual desire score and reduction in related distress than placebo in premenopausal women"
      - doi: "10.1097/aog.0000000000003514"
        title: "Long-Term Safety and Efficacy of Bremelanotide for Hypoactive Sexual Desire Disorder"
        year: 2019
        finding: "52-week open-label extension; nausea (40.4%), flushing and headache were the most common treatment-related adverse events"
      - doi: "10.1080/00224499.2021.1885601"
        title: "Re-Analyzing Phase III Bremelanotide Trials for “Hypoactive Sexual Desire Disorder” in Women"
        year: 2021
        finding: "Independent re-analysis based on FDA application data reporting higher adverse-event discontinuation on bremelanotide and incomplete outcome reporting in the phase 3 publication"
    trials_query: "bremelanotide"
  - indication: "Erectile dysfunction in men (gray-market claim; not an approved use)"
    tier: E3
    human_rcts: 3
    human_trials_any: null
    summary: >-
      Small randomised studies from the early 2000s tested an intranasal form in men:
      a phase 1 study in healthy men and men with mild-to-moderate erectile
      dysfunction reported erectile responses versus placebo, and a second study
      reported a larger erectile response when combined with sildenafil. A larger RCT in
      sildenafil non-responders is subject to a 2023 journal Expression of Concern.
      The approved US label states the product is not indicated in men or for
      improving sexual performance. No phase 3 evidence in men exists.
    citations:
      - doi: "10.1038/sj.ijir.3901139"
        title: "Double-blind, placebo-controlled evaluation of the safety, pharmacokinetic properties and pharmacodynamic effects of intranasal PT-141, a melanocortin receptor agonist, in healthy males and patients with mild-to-moderate erectile dysfunction"
        year: 2004
        finding: "Erectile response greater than placebo in a small phase 1 study; flushing and nausea most common adverse events"
      - doi: "10.1016/j.urology.2004.10.060"
        title: "Co-administration of low doses of intranasal PT-141, a melanocortin receptor agonist, and sildenafil to men with erectile dysfunction results in an enhanced erectile response"
        year: 2005
        finding: "Greater erectile response with combined PT-141 and sildenafil than sildenafil alone in men with erectile dysfunction"
      - doi: "10.1016/j.juro.2007.10.063"
        title: "Salvage of Sildenafil Failures With Bremelanotide: A Randomized, Double-Blind, Placebo Controlled Study"
        year: 2008
        finding: "Reported positive responses in sildenafil non-responders; the article is subject to a 2023 Expression of Concern"
      - doi: "10.1097/ju.0000000000003117"
        title: "Expression of Concern: Salvage of Sildenafil Failures With Bremelanotide: A Randomized, Double-Blind, Placebo Controlled Study"
        year: 2023
        finding: "Journal of Urology Expression of Concern attached to the 2008 RCT"
    trials_query: "bremelanotide"
safety:
  grade: S2
  no_data_statement: true
  known_signals:
    - signal: "Transient increase in blood pressure and decrease in heart rate after each dose"
      evidence: "US prescribing information Warnings and Precautions 5.1; contraindicated in uncontrolled hypertension or known cardiovascular disease. Ambulatory monitoring studied in a dedicated trial."
      citation: {doi: "10.1097/hjh.0000000000001221", title: "Usefulness of ambulatory blood pressure monitoring to assess the melanocortin receptor agonist bremelanotide"}
    - signal: "Focal hyperpigmentation (face, gingiva, breasts), not always resolving"
      evidence: "US prescribing information Warnings and Precautions; higher risk with darker skin and with daily use."
      citation: {url: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2020/210557s002lbl.pdf", title: "VYLEESI (bremelanotide injection), for subcutaneous use"}
    - signal: "Nausea, flushing, headache"
      evidence: "Most frequent adverse events in phase 3 trials and the open-label extension."
      citation: {doi: "10.1097/aog.0000000000003514", title: "Long-Term Safety and Efficacy of Bremelanotide for Hypoactive Sexual Desire Disorder"}
    - signal: "Unknown composition of gray-market PT-141"
      evidence: "No published analytical testing of gray-market material was identified; safety data from the approved product do not transfer to unverified powders. The approved US product is a single-dose autoinjector solution, not a powder."
      citation: {url: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2020/210557s002lbl.pdf", title: "VYLEESI (bremelanotide injection), for subcutaneous use"}
regulatory:
