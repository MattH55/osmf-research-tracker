    source_url: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2020/210557s002lbl.pdf"
    source_title: "VYLEESI prescribing information (FDA, label revision 10/2020)"
    quote: "VYLEESI is indicated for the treatment of premenopausal women with acquired, generalized hypoactive sexual desire disorder (HSDD)"
    retrieved: "2026-10-10"
