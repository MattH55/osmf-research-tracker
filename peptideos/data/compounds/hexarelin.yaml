slug: hexarelin
names:
  inn: null
  common: ["Hexarelin", "Examorelin"]
  codes: []
  brands: []
  cas: null
sequence: null
sequence_note: "Synthetic hexapeptide His-D-2-methyl-Trp-Ala-Trp-D-Phe-Lys-NH2, an analogue of GHRP-6 with a methylated D-tryptophan; contains D-amino acids and a C-terminal amide, so no standard one-letter sequence is given."
class_by_jurisdiction: {US: C, EU: C, UK: null, CA: C, AU: null, JP: null, CN: null}
what_it_is: >-
  A synthetic six-amino-acid growth hormone secretagogue, a close analogue of GHRP-6,
  that acts on the ghrelin receptor to release growth hormone. It was studied in
  human endocrine experiments and small clinical studies in the 1990s, including in
  children with short stature and in adults over 16 weeks, but was never approved as
  a medicine in any jurisdiction checked. WADA lists it under the name examorelin. It
  is sold online as a research chemical with claims of raising growth hormone and
  muscle mass.
evidence:
  - indication: "Growth hormone release"
    tier: E3
    human_rcts: null
    human_trials_any: null
    summary: >-
      Numerous small human pharmacology studies, many randomised and
      placebo-controlled with crossover designs, show that hexarelin acutely raises
      blood growth hormone after intravenous, subcutaneous, intranasal or oral
      administration, alongside rises in prolactin, ACTH and cortisol. In adults given
      hexarelin twice daily for 16 weeks the growth hormone response was partly and
      reversibly attenuated, and IGF-I did not change significantly. The number of
      such studies was not counted, so both counts are left blank.
    citations:
      - doi: "10.1210/jcem.78.3.8126144"
        title: "Growth hormone-releasing activity of hexarelin, a new synthetic hexapeptide, after intravenous, subcutaneous, intranasal, and oral administration in man."
        year: 1994
        finding: "Acute growth hormone release in humans after intravenous, subcutaneous, intranasal and oral administration"
      - doi: "10.1210/jcem.81.12.8954038"
        title: "Hexarelin-induced growth hormone, cortisol, and prolactin release: a dose-response study."
        year: 1996
        finding: "Dose-dependent growth hormone, prolactin and cortisol release after intravenous hexarelin in healthy adult men"
      - doi: "10.1210/jcem.83.5.4812"
        title: "Growth Hormone Status during Long-Term Hexarelin Therapy"
        year: 1998
        finding: "Partial, reversible attenuation of the growth hormone response over 16 weeks in adults, with no significant change in IGF-I"
    trials_query: "hexarelin"
  - indication: "Muscle mass and body composition"
    tier: E4
    human_rcts: null
    human_trials_any: null
    summary: >-
      The only adult study identified that measured body composition was an
      uncontrolled 16-week study: total body fat, lean body mass and bone mineral
      density did not change significantly from baseline. No randomised trial of
      muscle mass, strength or body composition was identified.
    citations:
      - doi: "10.1210/jcem.83.5.4812"
        title: "Growth Hormone Status during Long-Term Hexarelin Therapy"
        year: 1998
        finding: "No significant change in total body fat, lean body mass or bone mineral density after 16 weeks in adults"
    trials_query: "hexarelin"
  - indication: "Short stature in children"
    tier: E4
    human_rcts: null
    human_trials_any: null
    summary: >-
      An uncontrolled study gave intranasal hexarelin to 8 prepubertal children with
      short stature for up to 8 months and reported higher IGF-I and faster growth
      velocity than before treatment. There was no control group, and no adult-height
      outcome was reported. Hexarelin did not proceed to approval for this use.
    citations:
      - doi: "10.1111/j.1365-2265.1995.tb02929.x"
        title: "Intranasal administration of the GHRP hexarelin accelerates growth in short children"
        year: 1995
        finding: "IGF-I and growth velocity rose from baseline in 8 short prepubertal children in an uncontrolled study"
    trials_query: "hexarelin"
safety:
  grade: S3
  no_data_statement: false
  known_signals:
    - signal: "Acute rise in prolactin and cortisol"
      evidence: "Intravenous hexarelin raised serum prolactin and cortisol in a dose-dependent manner in healthy adult men."
      citation: {doi: "10.1210/jcem.81.12.8954038", title: "Hexarelin-induced growth hormone, cortisol, and prolactin release: a dose-response study."}
    - signal: "Change in pituitary-adrenal response with repeated use"
      evidence: "After 16 weeks of twice-daily subcutaneous hexarelin in adults the cortisol response to an injection was reduced, returning to baseline 4 weeks after stopping."
      citation: {doi: "10.1046/j.1365-2265.1999.00609.x", title: "The effect of chronic hexarelin administration on the pituitary–adrenal axis and prolactin"}
