  cas: null
sequence: "TKPRPGP"
sequence_note: "Heptapeptide: the immune peptide tuftsin (Thr-Lys-Pro-Arg) extended with Pro-Gly-Pro at the C-terminus for stability."
class_by_jurisdiction: {US: C, EU: C, UK: null, CA: C, AU: null, JP: null, CN: null}
what_it_is: >-
  A synthetic seven-amino-acid peptide made by adding a Pro-Gly-Pro tail to
  tuftsin, a short peptide derived from an antibody fragment. It was developed in
  Russia as an anti-anxiety agent, and its clinical literature is almost entirely
  Russian. It is sold online elsewhere as a research chemical with claims for
  anxiety, focus and memory. No approved medicine contains it in any jurisdiction
  checked for this record.
evidence:
  - indication: "Anxiety disorders"
    tier: E3
    human_rcts: null
    human_trials_any: 3
    summary: >-
      Three small Russian clinical studies were identified, none placebo-controlled.
      In 62 patients with generalised anxiety disorder or neurasthenia, selank and the
      benzodiazepine medazepam had similar anxiolytic effects. In 60 patients with
      anxiety and somatoform disorders, selank was compared with phenazepam. In 70
      patients, adding selank to phenazepam was reported to bring an earlier response
      and fewer benzodiazepine side effects. PubMed indexes two of these as
      randomised; the designs were not verified from full texts, so the RCT count is
      left blank. Without placebo arms these studies cannot separate drug effect from
      the high placebo response typical of anxiety trials.
    citations:
      - pmid: 18454096
        title: "[Efficacy and possible mechanisms of action of a new peptide anxiolytic selank in the therapy of generalized anxiety disorders and neurasthenia]."
        year: 2008
        finding: "Similar anxiolytic effect of selank and medazepam in 62 patients with generalised anxiety disorder or neurasthenia"
      - pmid: 25176261
        title: "[A comparison of the anxiolytic effect and tolerability of selank and phenazepam in the treatment of anxiety disorders]."
        year: 2014
        finding: "Anxiolytic effect reported with selank in a comparison with phenazepam in 60 patients with anxiety and somatoform disorders"
      - doi: "10.17116/jnevro20151156133-40"
        title: "Optimization of the treatment of anxiety disorders with selank"
        year: 2015
        finding: "Earlier response and fewer phenazepam side effects reported when selank was added to phenazepam in 70 patients with anxiety disorders"
    trials_query: "selank"
  - indication: "Cognitive enhancement (memory, attention)"
    tier: E6
    human_rcts: 0
    human_trials_any: 0
    summary: >-
      Memory findings are from rodents: in rats given ethanol long term, selank
      prevented memory and attention impairment in an object-recognition test and
      prevented an ethanol-induced rise in hippocampal BDNF. No human trial with
      cognitive performance as an outcome in healthy people was identified; one
      anxiety trial above used attention tests as secondary measures in patients also
      taking phenazepam.
    citations:
      - doi: "10.1007/s10517-019-04588-9"
        title: "Selank, Peptide Analogue of Tuftsin, Protects Against Ethanol-Induced Memory Impairment by Regulating of BDNF Content in the Hippocampus and Prefrontal Cortex in Rats"
        year: 2019
        finding: "Prevented ethanol-induced memory and attention impairment in an object-recognition test in rats"
    trials_query: "selank"
  - indication: "Stroke"
    tier: E6
    human_rcts: 0
    human_trials_any: 0
    summary: >-
      One small rat study of experimental intracerebral haemorrhage (five animals per
      group) reported better functional recovery with selank without an effect on
      haematoma volume or swelling. No human study of selank in stroke was
      identified.
    citations:
      - pmid: 20873405
        title: "[Experimental hemorrhagic stroke: the study of neuropeptides (MIF, selank) in the intraperitoneal injection]."
        year: 2009
        finding: "Improved functional recovery without change in haematoma volume in a rat model of intracerebral haemorrhage"
    trials_query: "selank"
