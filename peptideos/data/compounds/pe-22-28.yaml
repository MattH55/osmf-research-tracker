sequence: "GVSWGLR"
sequence_note: "Residues 22-28 of the mouse sortilin propeptide (PE). Derived from the published spadin sequence (PE 12-28, APLPRWSGPIGVSWGLR) and the statement that glycine occupies position 22; the free peptide's terminal groups were not verified."
class_by_jurisdiction: {US: C, EU: C, UK: null, CA: C, AU: null, JP: null, CN: null}
what_it_is: >-
  A seven-amino-acid peptide cut down from spadin, a fragment of the propeptide
  released when the sorting protein sortilin matures. It was designed in a French
  laboratory as a blocker of the TREK-1 potassium channel and tested for
  antidepressant-like activity in mice. It is sold online as a research chemical
  with claims for depression, mood and cognition. No study in humans was identified
  and no approved medicine contains it.
evidence:
  - indication: "Depression"
    tier: E6
    human_rcts: 0
    human_trials_any: 0
    summary: >-
      Efficacy data are from mice only. In the 2017 report that introduced it,
      PE 22-28 reduced immobility in the forced swim test, shortened escape latency in
      a learned-helplessness test and reduced feeding latency in a novelty-suppressed
      feeding test, including in a corticosterone-induced depression model, with a
      longer-lasting effect than its parent peptide spadin. These are behavioural
      screening tests in mice; no human study of mood, depression or any other outcome
      was identified.
    citations:
      - doi: "10.3389/fphar.2017.00643"
        title: "Shortened Spadin Analogs Display Better TREK-1 Inhibition, In Vivo Stability and Antidepressant Activity"
        year: 2017
        finding: "Inhibited TREK-1 channels in a human cell line and reduced depression-like behaviour in mouse forced-swim, learned-helplessness and novelty-suppressed feeding tests"
      - doi: "10.1371/journal.pbio.1000355"
        title: "Spadin, a Sortilin-Derived Peptide, Targeting Rodent TREK-1 Channels: A New Concept in the Antidepressant Drug Design"
        year: 2010
        finding: "The parent peptide spadin blocked TREK-1 and reduced depression-like behaviour in mice (spadin, not PE 22-28)"
    trials_query: "PE-22-28"
