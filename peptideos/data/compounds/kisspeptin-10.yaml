class_by_jurisdiction: {US: C, EU: null, UK: null, CA: null, AU: null, JP: null, CN: null}
what_it_is: >-
  A ten-amino-acid peptide corresponding to the shortest naturally occurring active
  fragment of kisspeptin, a hypothalamic signal that drives release of
  gonadotropin-releasing hormone. It is used as a research tool in human
  reproductive-physiology studies. It is not approved as a medicine in any
  jurisdiction checked, and it is sold on the gray market with claims of raising
  testosterone and libido. The US FDA lists it among bulk substances raising
  significant safety risks for pharmacy compounding.
evidence:
  - indication: "Low testosterone / secondary hypogonadism in men"
    tier: E4
    human_rcts: null
    human_trials_any: 3
    summary: >-
      Small, short physiology studies in healthy men and in men with type 2
      diabetes and low testosterone found that intravenous kisspeptin-10 acutely
      raised luteinising hormone and, during infusion, testosterone. These studies
      measured hormone levels over hours; none tested symptoms, sexual function,
      body composition or any clinical outcome, and none lasted weeks or months.
      Whether any of the designs were randomised was not verified, so the RCT count
      is left blank. No trial of repeated self-administered kisspeptin-10 in
      hypogonadism was identified.
    citations:
      - doi: "10.1210/jc.2011-0089"
        title: "Kisspeptin-10 Is a Potent Stimulator of LH and Increases Pulse Frequency in Men"
        year: 2011
        finding: "Intravenous kisspeptin-10 acutely raised LH and increased LH pulse frequency in healthy men"
      - doi: "10.1111/cen.12103"
        title: "Exploring the pathophysiology of hypogonadism in men with type 2 diabetes: Kisspeptin‐10 stimulates serum testosterone and LH secretion in men with type 2 diabetes and mild biochemical hypogonadism"
        year: 2013
        finding: "Kisspeptin-10 infusion raised LH and serum testosterone over hours in men with type 2 diabetes and mildly low testosterone"
      - doi: "10.1210/jc.2010-3046"
        title: "Kisspeptin Resets the Hypothalamic GnRH Clock in Men"
        year: 2011
        finding: "A single intravenous kisspeptin-10 bolus reset the timing of endogenous GnRH-driven LH pulses in healthy men"
    trials_query: "kisspeptin-10"
