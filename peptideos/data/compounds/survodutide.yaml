what_it_is: >-
  An investigational synthetic peptide from Boehringer Ingelheim that activates
  the glucagon and GLP-1 receptors. It is in phase 3 development for obesity and
  for metabolic dysfunction-associated steatotic liver disease, including
  steatohepatitis with fibrosis or cirrhosis. It is not approved in any
  jurisdiction checked.
evidence:
  - indication: "Weight reduction in obesity or overweight"
    tier: E1
    human_rcts: null
    human_trials_any: null
    summary: >-
      Two published phase 3 trials and one phase 2 trial. SYNCHRONIZE-1 (725
      adults without diabetes, 76 weeks): weight change -12.2% and -13.0% in the
      two dose groups versus -5.4% with placebo. SYNCHRONIZE-2 (752 adults with
      type 2 diabetes, 76 weeks): -8.2% and -9.8% versus -3.9%. The phase 2 trial
      (387 adults, 46 weeks) reported -6.2% to -14.9% versus -2.8%, with only 60%
      completing treatment.
    citations:
      - doi: "10.1056/nejmoa2600751"
        title: "Survodutide Once Weekly for the Treatment of Adults with Obesity"
        year: 2026
        finding: "SYNCHRONIZE-1: weight change -12.2% and -13.0% vs -5.4% with placebo at 76 weeks"
      - doi: "10.1056/nejmoa2607219"
        title: "Survodutide Once Weekly in Adults with Obesity and Type 2 Diabetes"
        year: 2026
        finding: "SYNCHRONIZE-2: weight change -8.2% and -9.8% vs -3.9% with placebo at 76 weeks in obesity with type 2 diabetes"
      - doi: "10.1016/S2213-8587(23)00356-X"
        title: "Glucagon and GLP-1 receptor dual agonist survodutide for obesity: a randomised, double-blind, placebo-controlled, dose-finding phase 2 trial"
        year: 2024
        finding: "Phase 2: weight change -6.2% to -14.9% vs -2.8% with placebo at 46 weeks"
    trials_query: "survodutide AND obesity"
  - indication: "Liver fat in obesity with metabolic dysfunction-associated steatotic liver disease (MASLD)"
    tier: E2
    human_rcts: null
    human_trials_any: null
    summary: >-
      One phase 3 trial (SYNCHRONIZE-MASLD, 216 adults, 48 weeks). A reduction of
      at least 30% in MRI-measured liver fat occurred in 68.5% with survodutide
      versus 28.6% with placebo (treatment-regimen estimand). Liver fat is an
      imaging surrogate; the authors note short duration and recruitment limited
      to the US and Spain.
    citations:
      - doi: "10.1038/s41591-026-04479-3"
        title: "Survodutide in adults with obesity and metabolic dysfunction-associated steatotic liver disease: SYNCHRONIZE-MASLD, a randomized, double-blind, placebo-controlled phase 3 trial"
        year: 2026
        finding: "At least 30% liver-fat reduction in 68.5% vs 28.6% with placebo at 48 weeks (treatment-regimen estimand)"
    trials_query: "survodutide AND liver"
  - indication: "Metabolic dysfunction-associated steatohepatitis (MASH) with fibrosis"
    tier: E3
    human_rcts: null
    human_trials_any: null
    summary: >-
      One phase 2 biopsy trial (293 treated participants, 48 weeks). MASH
      improvement without worsening fibrosis occurred in 43% to 62% across dose
      groups versus 14% with placebo; fibrosis improvement by at least one stage
      in 34% to 36% versus 22%. Phase 3 histology and outcome trials (LIVERAGE,
      LIVERAGE-Cirrhosis) are recruiting.
    citations:
      - doi: "10.1056/NEJMoa2401755"
        title: "A Phase 2 Randomized Trial of Survodutide in MASH and Fibrosis"
        year: 2024
        finding: "MASH improvement without fibrosis worsening 43-62% vs 14% with placebo (phase 2)"
    trials_query: "survodutide AND steatohepatitis"
safety:
  grade: S2
  no_data_statement: true
  known_signals:
    - signal: "Gastrointestinal adverse events"
      evidence: "In SYNCHRONIZE-1, gastrointestinal adverse events occurred in 80.9% and 89.7% of the two survodutide groups versus 47.9% with placebo."
      citation: {doi: "10.1056/nejmoa2600751", title: "Survodutide Once Weekly for the Treatment of Adults with Obesity"}
    - signal: "High treatment discontinuation in dose-finding"
      evidence: "In the phase 2 obesity trial, 61% of survodutide recipients completed the 46-week treatment period (60% on placebo); gastrointestinal adverse events occurred in 75% versus 42%."
      citation: {doi: "10.1016/S2213-8587(23)00356-X", title: "Glucagon and GLP-1 receptor dual agonist survodutide for obesity: a randomised, double-blind, placebo-controlled, dose-finding phase 2 trial"}
