slug: ghk-cu
names:
  inn: null
  common: ["GHK-Cu", "Copper peptide GHK-Cu", "Copper tripeptide", "Glycyl-L-histidyl-L-lysine copper(II)"]
  codes: []
  brands: []
  cas: null
sequence: "GHK"
sequence_note: "Copper(II) complex of the tripeptide glycyl-L-histidyl-L-lysine (GHK). The peptide occurs naturally in human plasma."
class_by_jurisdiction: {US: C, EU: null, UK: null, CA: null, AU: null, JP: null, CN: null}
what_it_is: >-
  A copper complex of a three-amino-acid peptide found naturally in human plasma.
  It is a common ingredient in topical cosmetic skin products and is also sold on
  the gray market as an injectable with anti-ageing and tissue-healing claims. A
  topical gel was tested for diabetic foot ulcers in the 1990s; no approval of it
  was identified. It is not an FDA-approved medicine, and in the US FDA treats
  injectable and non-injectable use separately for compounding.
evidence:
  - indication: "Diabetic foot ulcers (topical gel)"
    tier: E3
    human_rcts: 1
    human_trials_any: 1
    summary: >-
      A multicentre, randomised, evaluator-blinded, vehicle-controlled trial of a
      GHK-copper gel (Iamin Gel) in diabetic neuropathic plantar ulcers, published
      in 1994, reported greater median ulcer closure and fewer infections than
      vehicle when added to standard wound care. The number of participants was not
      stated in the abstract reviewed. No confirmatory trial was identified, and no
      approval of the gel was found.
    citations:
      - doi: "10.1046/j.1524-475x.1994.20406.x"
        title: "Enhanced healing of ulcers in patients with diabetes by topical treatment with glycyl-l-histidyl-l-lysine copper"
        year: 1994
        finding: "Greater median plantar ulcer closure and lower infection incidence than vehicle in a randomised, evaluator-blinded trial in patients with diabetes"
    trials_query: "GHK-Cu"
  - indication: "Skin ageing, wrinkles and post-procedure skin (topical cosmetic)"
    tier: E3
    human_rcts: 1
    human_trials_any: 1
    summary: >-
      Topical GHK-Cu is widely used in cosmetics, but controlled clinical data are
      sparse. In a small randomised study of 13 patients after carbon-dioxide laser
      resurfacing around the mouth, skin products with GHK-Cu did not reduce redness
      or improve blinded ratings of wrinkles or skin quality compared with products
      without it; only patient-reported satisfaction differed. Other published
      cosmetic studies mostly test multi-ingredient products, so the contribution of
      GHK-Cu cannot be isolated.
    citations:
      - doi: "10.1001/archfaci.8.4.252"
        title: "Effects of topical copper tripeptide complex on CO2 laser-resurfaced skin"
        year: 2006
        finding: "No difference in erythema, wrinkles or blinded skin-quality ratings versus control regimen in 13 patients; higher patient-reported satisfaction"
    trials_query: "GHK-Cu"
  - indication: "Injected GHK-Cu for tissue healing, inflammation or anti-ageing"
    tier: E6
    human_rcts: 0
    human_trials_any: 0
    summary: >-
      No human study of injected GHK-Cu has been published. In rats, injections into
      the knee joint after ligament reconstruction improved knee laxity and graft
      stiffness at 6 weeks but not at 12 weeks. In mice with chemically induced
      colitis, GHK-Cu reduced inflammatory markers and colon damage. FDA states that
      there are limited data in humans to inform safety for injectable use.
    citations:
      - doi: "10.1002/jor.22831"
        title: "Tripeptide-copper complex GHK-Cu (II) transiently improved healing outcome in a rat model of ACL reconstruction"
        year: 2015
        finding: "Smaller knee laxity difference at 6 weeks but no difference at 12 weeks after ACL reconstruction in rats"
      - doi: "10.3389/fphar.2025.1551843"
        title: "Exploring the beneficial effects of GHK-Cu on an experimental model of colitis and the underlying mechanisms"
        year: 2025
        finding: "Lower disease-activity scores and inflammatory cytokines in mice with DSS-induced colitis"
    trials_query: "GHK-Cu"
safety:
  grade: S3
  no_data_statement: false
  known_signals:
    - signal: "Regulator-identified risk for injectable use"
      evidence: "FDA lists GHK-Cu for injectable routes among substances previously in 503A Category 2 whose nominations were withdrawn, citing immunogenicity risk from aggregation and peptide-related impurities and limited human data. This is a stated risk, not a documented case of harm."
      citation: {url: "https://www.fda.gov/drugs/human-drug-compounding/certain-bulk-drug-substances-use-compounding-may-present-significant-safety-risks", title: "Certain Bulk Drug Substances for Use in Compounding that May Present Significant Safety Risks"}
regulatory:
  - jurisdiction: US
    status: 503a_category_1
    detail: "Not FDA-approved. For non-injectable routes only, GHK-Cu is in 503A Category 1 (under evaluation) on FDA's list updated 14 May 2026. It had been removed from Category 1 on 22 April 2026 after nominations were withdrawn, and was restored after one nominator clarified that it had withdrawn only the injectable route. FDA states it intends to consult the Pharmacy Compounding Advisory Committee before the end of February 2027."
    source_url: "https://www.fda.gov/media/94155/download"
    source_title: "Bulk Drug Substances Nominated for Use in Compounding Under Section 503A of the Federal Food, Drug, and Cosmetic Act (Updated May 14, 2026)"
    quote: "GHK-Cu (except for injectable routes of administration) will be added back to category 1."
    retrieved: "2026-10-10"
  - jurisdiction: US
    status: unapproved
    detail: "For injectable routes, GHK-Cu appears on FDA's list of substances nominated but withdrawn (previously in 503A Category 2), with FDA's stated risks. Page content current as of 22 April 2026."
    source_url: "https://www.fda.gov/drugs/human-drug-compounding/certain-bulk-drug-substances-use-compounding-may-present-significant-safety-risks"
    source_title: "Certain Bulk Drug Substances for Use in Compounding that May Present Significant Safety Risks"
    quote: "Compounded injectable drugs containing GHK-Cu may pose risk for immunogenicity due to the potential for aggregation and peptide-related impurities. There are limited data in humans to inform safety-related considerations."
    retrieved: "2026-10-10"
sport:
  wada_status: prohibited
  wada_class: "S0"
  detail: "GHK-Cu is not named on the 2026 Prohibited List. As a pharmacological substance with no current regulatory approval for human therapeutic use, it falls within the general definition of class S0; how WADA treats its presence in topical cosmetic products was not verified:"
  source_url: "https://www.wada-ama.org/sites/default/files/2025-09/2026list_en_final_clean_september_2025.pdf"
  quote: "Any pharmacological substance which is not addressed by any of the subsequent sections of the List and with no current approval by any governmental regulatory health authority for human therapeutic use"
trials:
  - nct: "NCT07437586"
    title: "Topical GHK-Cu Gel for Acute Skin Wound Healing"
    phase: "2"
    status: "Recruiting"
unknowns:
  - "No published human study of injected GHK-Cu, for efficacy, pharmacokinetics or safety"
  - "How much topically applied GHK-Cu penetrates intact human skin is not established"
  - "The 1994 diabetic ulcer trial has not been independently replicated, and its full participant numbers were not verified for this record"
  - "Whether injected GHK-Cu alters copper balance or copper-related toxicity in humans has not been studied"
  - "Purity, copper content and aggregation of gray-market injectable products are uncharacterised; FDA cites aggregation and impurities as an immunogenicity concern"
  - "Regulatory status outside the US, including cosmetic-ingredient rules, was not verified from regulator sources for this record"
mechanism: >-
  GHK forms a complex with copper(II) ions. In mice with chemically induced
  colitis GHK-Cu lowered inflammatory cytokines and increased SIRT1 protein
  expression; its molecular targets in human tissue are not established.
reviewer: "OSMF research team (AI-assisted, source-verified)"
last_reviewed: "2026-10-10"
