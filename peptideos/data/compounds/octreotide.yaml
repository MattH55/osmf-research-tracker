slug: octreotide
names:
  inn: "octreotide"
  common: ["Octreotide", "Octreotide acetate", "SMS 201-995"]
  codes: ["SMS 201-995"]
  brands: ["Sandostatin", "Sandostatin LAR", "Mycapssa"]
  cas: null
sequence: null
sequence_note: "Cyclic octapeptide analogue of somatostatin: D-Phe-Cys-Phe-D-Trp-Lys-Thr-Cys-Thr-ol, disulfide bridge Cys2-Cys7; contains D-amino acids and a C-terminal threoninol, so no standard one-letter sequence is given."
class_by_jurisdiction: {US: A, EU: null, UK: null, CA: A, AU: null, JP: null, CN: null}
what_it_is: >-
  A synthetic eight-residue cyclic analogue of the hormone somatostatin, with a
  longer half-life than the native hormone. It is an approved prescription drug in
  the United States and Canada in short-acting and long-acting injectable forms,
  and in the United States as an oral delayed-release capsule. Labelled uses centre
  on acromegaly and on symptoms of carcinoid and other hormone-secreting
  neuroendocrine tumours.
evidence:
  - indication: "Acromegaly (biochemical control)"
    tier: E2
    human_rcts: 1
    human_trials_any: 2
    summary: >-
      Injectable octreotide has been used in acromegaly since the late 1980s, largely
      on the basis of uncontrolled and open-label studies. The oral capsule was
      tested in a randomised, double-blind, placebo-controlled withdrawal trial
      (OPTIMAL, 56 participants) in people already controlled on injectable
      somatostatin analogues, and in an open-label randomised non-inferiority trial
      against injectables (MPOWERED). One adequately designed placebo-controlled RCT
      is cited here; the outcome is a biochemical marker (IGF-I), not tumour or
      survival outcomes.
    citations:
      - doi: "10.1210/clinem/dgaa526"
        title: "Maintenance of Acromegaly Control in Patients Switching From Injectable Somatostatin Receptor Ligands to Oral Octreotide"
        year: 2020
        finding: "A higher proportion of participants on oral octreotide than on placebo kept IGF-I within the target range in a randomised withdrawal trial in adults with acromegaly"
    trials_query: "octreotide"
  - indication: "Metastatic midgut neuroendocrine tumours (tumour growth control)"
    tier: E2
    human_rcts: 1
    human_trials_any: 1
    summary: >-
      The PROMID trial randomised 85 treatment-naive patients with metastatic
      well-differentiated midgut neuroendocrine tumours to long-acting octreotide or
      placebo and reported a longer time to tumour progression with octreotide. No
      overall survival benefit was established in the primary report. This
      indication is not part of the US label wording for octreotide.
    citations:
      - doi: "10.1200/JCO.2009.22.8510"
        title: "Placebo-Controlled, Double-Blind, Prospective, Randomized Study on the Effect of Octreotide LAR in the Control of Tumor Growth in Patients With Metastatic Neuroendocrine Midgut Tumors: A Report From the PROMID Study Group"
        year: 2009
        finding: "Longer time to tumour progression with long-acting octreotide than with placebo in patients with metastatic midgut neuroendocrine tumours"
    trials_query: "octreotide"
  - indication: "Carcinoid syndrome (diarrhoea and flushing)"
    tier: E3
    human_rcts: 1
    human_trials_any: 1
    summary: >-
      The cited randomised trial compared long-acting and short-acting octreotide
      formulations in malignant carcinoid syndrome rather than octreotide against
      placebo; it was small and partly open-label. Symptom control with the two
      formulations was reported as similar. Placebo-controlled evidence for symptom
      relief with octreotide itself was not identified in this review.
    citations:
      - doi: "10.1200/JCO.1999.17.2.600"
        title: "Octreotide Acetate Long-Acting Formulation Versus Open-Label Subcutaneous Octreotide Acetate in Malignant Carcinoid Syndrome"
        year: 1999
        finding: "Long-acting and short-acting octreotide formulations gave comparable control of diarrhoea and flushing in patients with malignant carcinoid syndrome"
    trials_query: "octreotide carcinoid"
  - indication: "Acute oesophageal variceal bleeding (off-label)"
    tier: E3
    human_rcts: null
    human_trials_any: null
    summary: >-
      Octreotide is used off-label in acute variceal bleeding. A Cochrane systematic
      review of randomised trials of somatostatin analogues (somatostatin and
      octreotide) found no reduction in mortality and only a small effect on the
      need for transfusion, with trial quality and results varying. The number of
      octreotide-specific RCTs is not stated here because the review pooled both
      agents.
    citations:
      - doi: "10.1002/14651858.CD000193.pub3"
        title: "Somatostatin analogues for acute bleeding oesophageal varices"
        year: 2008
        finding: "Systematic review of randomised trials found no mortality reduction with somatostatin analogues in acute variceal bleeding"
    trials_query: "octreotide variceal"
safety:
  grade: S1
  no_data_statement: false
  known_signals:
    - signal: "Gallbladder and biliary stone formation"
      evidence: "Gallstones and gallbladder sludge are a labelled warning for somatostatin analogues; a case of intrahepatic stones during octreotide therapy for acromegaly has been reported."
      citation: {doi: "10.1023/a:1012880113759", title: "Hepatolithiasis (Intrahepatic Stone) During Octreotide Therapy for Acromegaly: A Case Report"}
