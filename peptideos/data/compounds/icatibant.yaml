  brands: ["Firazyr"]
  cas: null
sequence: null
sequence_note: "Synthetic decapeptide: D-Arg-Arg-Pro-Hyp-Gly-Thi-Ser-D-Tic-Oic-Arg, containing five non-proteinogenic or D-amino acids (hydroxyproline, beta-(2-thienyl)alanine, D-tetrahydroisoquinoline-3-carboxylic acid, octahydroindole-2-carboxylic acid); no standard one-letter sequence is given."
class_by_jurisdiction: {US: A, EU: A, UK: null, CA: A, AU: null, JP: null, CN: null}
what_it_is: >-
  A synthetic ten-residue peptide that blocks the bradykinin B2 receptor. It is an
  approved prescription drug, given as a single-use prefilled syringe, for treating
  acute attacks of hereditary angioedema caused by C1-esterase-inhibitor
  deficiency. Generic versions are approved in the United States. It has also been
  studied, without approval, for angioedema caused by ACE-inhibitor drugs.
evidence:
  - indication: "Acute attacks of hereditary angioedema (C1-inhibitor deficiency)"
    tier: E1
    human_rcts: 3
    human_trials_any: 3
    summary: >-
      Three randomised, double-blind phase 3 trials were run. FAST-1 (placebo
      comparator) did not meet its primary endpoint; FAST-2 (tranexamic acid
      comparator) did; both were reported together. FAST-3, a larger
      placebo-controlled trial, reported shorter time to symptom relief with
      icatibant. Results are consistent in direction but FAST-1 was negative on its
      primary endpoint, which is stated here rather than omitted.
    citations:
      - doi: "10.1056/NEJMoa0906393"
        title: "Icatibant, a New Bradykinin-Receptor Antagonist, in Hereditary Angioedema"
        year: 2010
        finding: "Report of FAST-1 (versus placebo, primary endpoint not met) and FAST-2 (versus tranexamic acid, shorter time to symptom relief with icatibant) in acute hereditary angioedema attacks"
      - doi: "10.1016/j.anai.2011.08.015"
        title: "Randomized placebo-controlled trial of the bradykinin B2 receptor antagonist icatibant for the treatment of acute attacks of hereditary angioedema: the FAST-3 trial"
        year: 2011
        finding: "Shorter time to 50% symptom reduction with icatibant than placebo in acute cutaneous and abdominal hereditary angioedema attacks"
    trials_query: "icatibant hereditary angioedema"
  - indication: "ACE-inhibitor-induced angioedema (off-label)"
    tier: E3
    human_rcts: 2
    human_trials_any: 2
    summary: >-
      Results conflict. A small randomised phase 2 trial (27 participants) compared
      icatibant with glucocorticoid plus antihistamine and reported faster
      resolution of swelling. A larger randomised, placebo-controlled phase 3 trial
      in emergency departments found no difference from placebo in time to meeting
      discharge criteria. The indication is not approved.
    citations:
      - doi: "10.1056/nejmoa1312524"
        title: "A Randomized Trial of Icatibant in ACE-Inhibitor–Induced Angioedema"
        year: 2015
        finding: "Shorter time to complete resolution of oedema with icatibant than with glucocorticoid plus antihistamine in a small randomised trial"
      - doi: "10.1016/j.jaip.2017.03.003"
        title: "Randomized Trial of Icatibant for Angiotensin-Converting Enzyme Inhibitor–Induced Upper Airway Angioedema"
        year: 2017
        finding: "No difference between icatibant and placebo in time to meeting discharge criteria in ACE-inhibitor-induced upper airway angioedema"
    trials_query: "icatibant ACE inhibitor angioedema"
safety:
  grade: S1
  no_data_statement: false
  known_signals:
    - signal: "Injection-site reactions"
      evidence: "Local injection-site reactions (erythema, swelling, pain) were the most commonly reported adverse events in the placebo-controlled FAST-3 trial."
      citation: {doi: "10.1016/j.anai.2011.08.015", title: "Randomized placebo-controlled trial of the bradykinin B2 receptor antagonist icatibant for the treatment of acute attacks of hereditary angioedema: the FAST-3 trial"}
