slug: ghrp-6
names:
  inn: null
  common: ["GHRP-6", "Growth hormone-releasing peptide-6", "Growth hormone releasing hexapeptide"]
  codes: ["GHRP-6"]
  brands: []
  cas: null
sequence: null
sequence_note: "Synthetic hexapeptide His-D-Trp-Ala-Trp-D-Phe-Lys-NH2; contains D-amino acids and a C-terminal amide, so no standard one-letter sequence is given."
class_by_jurisdiction: {US: C, EU: C, UK: null, CA: C, AU: null, JP: null, CN: null}
what_it_is: >-
  A synthetic six-amino-acid peptide, one of the first growth hormone secretagogues,
  which acts on the ghrelin receptor to release growth hormone from the pituitary.
  It was studied widely in human endocrine physiology experiments in the 1990s but
  was never approved as a medicine in any jurisdiction checked. It is sold online as
  a research chemical with claims of raising growth hormone, appetite and muscle
  mass. A Cuban research centre has tested it with epidermal growth factor in acute
  stroke.
evidence:
  - indication: "Growth hormone release"
    tier: E3
    human_rcts: null
    human_trials_any: null
    summary: >-
      Many small, short human pharmacology studies, several of them randomised
      placebo-controlled crossover designs in healthy volunteers or patients, show
      that intravenous GHRP-6 acutely raises blood growth hormone, an effect that is
      greater when combined with GHRH and partly depends on endogenous GHRH. It also
      raised ACTH and cortisol. These studies measured hormone levels over hours; none
      tested sustained IGF-I, body composition, strength or any clinical outcome. The
      number of such studies was not counted, so both counts are left blank.
    citations:
      - doi: "10.1210/jcem-70-4-975"
        title: "Growth Hormone (GH)-Releasing Peptide Stimulates GH Release in Normal Men and Acts Synergistically with GH-Releasing Hormone"
        year: 1990
        finding: "Acute growth hormone release in healthy men, synergistic with GHRH"
      - doi: "10.1210/jcem.83.4.4711"
        title: "Growth Hormone (GH)-Releasing Peptide-6 Requires Endogenous Hypothalamic GH-Releasing Hormone for Maximal GH Stimulation"
        year: 1998
        finding: "Maximal growth hormone response to GHRP-6 in humans required endogenous hypothalamic GHRH"
      - doi: "10.1159/000126883"
        title: "Growth Hormone-Releasing Peptide-6 Stimulates Sleep, Growth Hormone, ACTH and Cortisol Release in Normal Man"
        year: 1995
        finding: "Overnight growth hormone, ACTH and cortisol rose and stage 2 sleep increased in healthy men compared with placebo"
    trials_query: "GHRP-6"
  - indication: "Acute ischaemic stroke (with epidermal growth factor)"
    tier: E3
    human_rcts: null
    human_trials_any: null
    summary: >-
      The COURAGE-2 phase III trial in Cuba randomised 188 patients with acute
      ischaemic stroke to intravenous epidermal growth factor plus GHRP-6 or standard
      care, open-label. It missed its primary endpoint: no difference in disability
      (modified Rankin Scale), Barthel index or survival in the whole population.
      Subgroup analyses suggested benefit in severe stroke, which is
      hypothesis-generating only. The trial tested a combination given in hospital,
      so it does not isolate GHRP-6 and does not bear on self-administered use.
    citations:
      - doi: "10.1016/j.jocn.2026.112195"
        title: "Phase III Open-Label, Randomized Clinical Trial of Epidermal Growth Factor and Growth Hormone Releasing Hexapeptide in Acute Ischemic Stroke"
        year: 2026
        finding: "No difference in disability, Barthel index or survival with EGF plus GHRP-6 versus standard care in patients with acute ischaemic stroke; primary endpoint missed"
    trials_query: "growth hormone releasing peptide 6"
safety:
  grade: S3
  no_data_statement: false
  known_signals:
    - signal: "Acute rise in ACTH and cortisol"
      evidence: "In healthy men, repeated intravenous GHRP-6 raised overnight ACTH and cortisol compared with placebo."
      citation: {doi: "10.1159/000126883", title: "Growth Hormone-Releasing Peptide-6 Stimulates Sleep, Growth Hormone, ACTH and Cortisol Release in Normal Man"}
    - signal: "Cortisol effects and reduced insulin sensitivity"
      evidence: "FDA's compounding safety summary states that the limited available data reveal concerns including effects on cortisol and increased blood glucose from decreased insulin sensitivity."
      citation: {url: "https://www.fda.gov/drugs/human-drug-compounding/certain-bulk-drug-substances-use-compounding-may-present-significant-safety-risks", title: "Certain Bulk Drug Substances for Use in Compounding that May Present Significant Safety Risks"}
    - signal: "Serious adverse events in a stroke trial, not attributed to treatment"
      evidence: "In COURAGE-2, serious adverse events occurred in 30 of 95 patients given EGF plus GHRP-6 and 18 of 93 on standard care; investigators judged none treatment-related."
      citation: {doi: "10.1016/j.jocn.2026.112195", title: "Phase III Open-Label, Randomized Clinical Trial of Epidermal Growth Factor and Growth Hormone Releasing Hexapeptide in Acute Ischemic Stroke"}
