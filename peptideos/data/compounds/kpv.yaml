slug: kpv
names:
  inn: null
  common: ["KPV", "Lys-Pro-Val", "Lysine-proline-valine", "alpha-MSH(11-13)"]
  codes: []
  brands: []
  cas: "67727-97-3"
sequence: "KPV"
sequence_note: "Tripeptide H-Lys-Pro-Val-OH, corresponding to the C-terminal residues 11-13 of alpha-melanocyte-stimulating hormone (alpha-MSH). CAS number as given for KPV (free base) in FDA's July 2026 briefing document; KPV acetate is a distinct salt form. FDA notes that different salts and derivatives are sold under the same name."
class_by_jurisdiction: {US: C, EU: null, UK: null, CA: null, AU: null, JP: null, CN: null}
what_it_is: >-
  A three-amino-acid peptide (lysine-proline-valine) matching the tail end of the
  hormone alpha-MSH. It is sold on the gray market for gut inflammation, skin
  conditions and wound healing. It is not an approved medicine. FDA's 2026
  briefing document states that FDA identified no clinical studies and no human
  exposure data for KPV by any route of administration.
evidence:
  - indication: "Inflammatory bowel disease and gut inflammation"
    tier: E6
    human_rcts: 0
    human_trials_any: 0
    summary: >-
      In mice with chemically induced or immune-transfer colitis, KPV reduced inflammatory markers and tissue damage.
      Several later studies tested KPV in nanoparticle or hydrogel carriers in
      rodents. No study in people with Crohn's disease, ulcerative colitis or any
      other gut condition has been published, and FDA found no human data of any
      kind.
    citations:
      - doi: "10.1053/j.gastro.2007.10.026"
        title: "PepT1-mediated tripeptide KPV uptake reduces intestinal inflammation"
        year: 2008
        finding: "Reduced inflammatory cytokine expression in human intestinal cell lines and in mice with DSS- and TNBS-induced colitis"
      - doi: "10.1002/ibd.20334"
        title: "Melanocortin-derived tripeptide KPV has anti-inflammatory potential in murine models of inflammatory bowel disease"
        year: 2008
        finding: "Less weight loss and fewer inflammatory infiltrates in two mouse models of colitis"
    trials_query: "KPV"
  - indication: "Wound healing"
    tier: E6
    human_rcts: 0
    human_trials_any: 0
    summary: >-
      Published wound data are limited to animal models; the study cited here used
      eye drops after corneal scraping in rabbits. No study of skin wounds, surgical
      wounds or chronic ulcers in humans has been published. FDA reviewed KPV for
      wound healing in 2026 and noted that none of the references submitted by the
      nominator studied KPV in humans.
    citations:
      - doi: "10.1016/j.exer.2006.07.014"
        title: "Effects of the COOH-terminal tripeptide alpha-MSH(11-13) on corneal epithelial wound healing: role of nitric oxide"
        year: 2006
        finding: "Faster corneal epithelial closure after mechanical abrasion in rabbits given topical KPV, blocked by a nitric oxide synthase inhibitor"
    trials_query: "KPV"
  - indication: "Inflammatory skin conditions (psoriasis, eczema)"
    tier: E7
    human_rcts: 0
    human_trials_any: 0
    summary: >-
      Evidence is limited to cultured human skin cells and a laboratory
      three-dimensional skin model, where KPV reduced inflammatory signalling
      triggered by fine dust particles. No animal model of psoriasis or eczema
      treated with KPV and no human study were identified.
    citations:
      - doi: "10.1016/j.tice.2025.102837"
        title: "Lysine-Proline-Valine peptide mitigates fine dust-induced keratinocyte apoptosis and inflammation by regulating oxidative stress and modulating the MAPK/NF-κB pathway"
        year: 2025
        finding: "Reduced IL-1beta secretion and cell death in cultured human keratinocytes exposed to fine particulate matter"
    trials_query: "KPV"
safety:
  grade: S5
  no_data_statement: true
  known_signals: []
regulatory:
  - jurisdiction: US
    status: unapproved
    detail: "No FDA-approved product. KPV was formerly in 503A Category 2 and now appears on FDA's list of substances nominated but withdrawn. FDA evaluated KPV (free base) and KPV acetate for wound healing and inflammatory conditions for the Pharmacy Compounding Advisory Committee meeting of 23 July 2026, and its briefing document recommended against adding either form to the 503A bulks list. The committee's vote and any final FDA decision were not verified from an FDA source for this record."
    source_url: "https://www.fda.gov/media/193346/download"
    source_title: "July 23-24, 2026, Meeting of the Pharmacy Compounding Advisory Committee – FDA Briefing Document for KPV-Related Bulk Drug Substances (KPV (free base) and KPV acetate)"
    quote: "After considering the information currently available, a balancing of the criteria weighs against KPV (free base) or KPV acetate being placed on that list"
    retrieved: "2026-10-10"
  - jurisdiction: US
    status: unapproved
    detail: "FDA's page on bulk drug substances that may present significant safety risks lists KPV under 'Bulk drug substances nominated but withdrawn' (substances previously in Category 2). Page content current as of 22 April 2026."
    source_url: "https://www.fda.gov/drugs/human-drug-compounding/certain-bulk-drug-substances-use-compounding-may-present-significant-safety-risks"
    source_title: "Certain Bulk Drug Substances for Use in Compounding that May Present Significant Safety Risks"
    quote: "FDA has not identified any human exposure data on drug products containing KPV administered via any route of administration."
    retrieved: "2026-10-10"
sport:
  wada_status: prohibited
  wada_class: "S0"
  detail: "KPV is not named on the 2026 Prohibited List. As a pharmacological substance with no current regulatory approval for human therapeutic use, it falls within the general definition of class S0:"
  source_url: "https://www.wada-ama.org/sites/default/files/2025-09/2026list_en_final_clean_september_2025.pdf"
  quote: "Any pharmacological substance which is not addressed by any of the subsequent sections of the List and with no current approval by any governmental regulatory health authority for human therapeutic use"
unknowns:
  - "No human pharmacokinetic or pharmacodynamic data by any route; FDA identified none"
  - "No human safety data of any kind: FDA found no clinical studies, no FAERS reports and no published case reports"
  - "Whether KPV taken by mouth survives digestion and reaches inflamed colon tissue in humans is untested; mouse studies relied on drinking water or specialised carriers"
  - "Which salt or derivative is present in gray-market products is unverified; FDA notes that multiple salts and derivatives, including different active moieties, are sold under the name KPV"
  - "Immunogenicity in humans has not been assessed"
  - "Regulatory status outside the US was not verified from regulator sources for this record"
mechanism: >-
  In cell studies KPV is taken up by the PepT1 peptide transporter and reduces
  NF-kappaB and MAP kinase inflammatory signalling; in mice its effects on colitis
  appeared to be at least partly independent of the melanocortin-1 receptor.
reviewer: "OSMF research team (AI-assisted, source-verified)"
last_reviewed: "2026-10-10"
