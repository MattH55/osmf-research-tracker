slug: follistatin-344
names:
  inn: null
  common: ["Follistatin-344", "Follistatin 344", "FS344", "FST344"]
  codes: []
  brands: []
  cas: null
sequence: null
sequence_note: "An alternatively spliced isoform of human follistatin, a cysteine-rich secreted glycoprotein rather than a short peptide. Black-market products analysed in 2019 contained a His-tagged recombinant protein with a high proportion of oligomers."
class_by_jurisdiction: {US: C, EU: null, UK: null, CA: null, AU: null, JP: null, CN: null}
what_it_is: >-
  A form of follistatin, a natural protein that binds and blocks myostatin and
  related growth factors that limit muscle growth. Gray-market vials labelled
  "follistatin 344" are sold for muscle building. That is different from the
  clinical research, which used a gene-therapy virus carrying the follistatin-344
  gene, injected into the thigh muscles of a few patients with muscular dystrophy
  or inclusion body myositis. No follistatin product is approved as a medicine in
  any jurisdiction checked.
evidence:
  - indication: "Muscle growth and strength (injected follistatin-344 protein)"
    tier: E8
    human_rcts: 0
    human_trials_any: 0
    summary: >-
      No published study of injected follistatin-344 protein in any model, animal or
      human, was identified. Animal studies of follistatin protein used other forms:
      an engineered follistatin-315 fusion protein increased lean mass in mice,
      while follistatin-288 protein in rats had mixed effects, including smaller
      muscles and less force in some groups. These results cannot be transferred to
      gray-market follistatin-344, whose stability, activity and content are
      unknown.
    citations:
      - doi: "10.1124/jpet.113.211169"
        title: "Follistatin: a novel therapeutic for the improvement of muscle regeneration"
        year: 2014
        finding: "An engineered follistatin-315 Fc fusion protein (not follistatin-344) increased lean muscle mass in mice"
      - doi: "10.1055/s-0042-1748535"
        title: "Follistatin Protein Enhances Satellite Cell Counts in Reinnervated Muscle"
        year: 2022
        finding: "Follistatin-288 protein (not follistatin-344) had mixed effects on muscle weight and force in rats after nerve injury"
    trials_query: "follistatin"
  - indication: "Muscle disease via follistatin-344 gene therapy (a different intervention)"
    tier: E4
    human_rcts: 0
    human_trials_any: 2
    summary: >-
      Gene therapy is not the gray-market product. An adeno-associated virus carrying
      the follistatin-344 gene was injected into the thigh muscles of six men with
      Becker muscular dystrophy and, separately, six people with sporadic inclusion
      body myositis. Walking distance improved in four of six in each study, with no
      adverse effects reported; the myositis study compared against eight untreated
      patients, not a randomised control. In macaques, the same vector increased
      muscle size and strength.
    citations:
      - doi: "10.1038/mt.2014.200"
        title: "A phase 1/2a follistatin gene therapy trial for becker muscular dystrophy"
        year: 2015
        finding: "Uncontrolled trial in six patients with Becker muscular dystrophy; four improved on the six-minute walk test"
      - doi: "10.1016/j.ymthe.2017.02.015"
        title: "Follistatin Gene Therapy for Sporadic Inclusion Body Myositis Improves Functional Outcomes"
        year: 2017
        finding: "Six treated patients with inclusion body myositis compared with eight untreated matched patients on six-minute walk distance"
      - doi: "10.1126/scitranslmed.3000112"
        title: "Follistatin gene delivery enhances muscle growth and strength in nonhuman primates"
        year: 2009
        finding: "Increased quadriceps size and strength in cynomolgus macaques after intramuscular AAV1-FS344 gene transfer"
    trials_query: "follistatin"
safety:
  grade: S5
  no_data_statement: true
  known_signals:
    - signal: "Mislabelled and uncharacterised black-market products"
      evidence: "In an anti-doping laboratory analysis of 17 black-market products sold as follistatin, only nine contained follistatin; some others contained different growth-promoting peptides. All nine follistatin-containing products held a His-tagged recombinant protein with a high degree of oligomers."
      citation: {doi: "10.1002/dta.2741", title: "Detection of black market follistatin 344"}
regulatory:
  - jurisdiction: US
    status: unapproved
    detail: "No FDA-approved follistatin product was identified; the black-market analysis cited above also states that no approved pharmaceutical formulations of follistatin are available. Follistatin does not appear in any category (1, 2 or 3) of FDA's list of bulk drug substances nominated for 503A compounding, updated 14 May 2026, so it has not been nominated for pharmacy compounding."
    source_url: "https://www.fda.gov/media/94155/download"
    source_title: "Bulk Drug Substances Nominated for Use in Compounding Under Section 503A of the Federal Food, Drug, and Cosmetic Act (Updated May 14, 2026)"
    quote: "Includes three categories of bulk drug substances: Category 1: Bulk Drug Substances Under Evaluation Category 2: Bulk Drug Substances that Raise Significant Safety Concerns Category 3: Bulk Drug Substances Nominated Without Adequate Support"
    retrieved: "2026-10-10"
sport:
  wada_status: prohibited
  wada_class: "S4.3"
  detail: "Named as a myostatin-binding protein under class S4.3 (agents preventing activin receptor IIB activation), prohibited at all times, on the 2026 Prohibited List."
  source_url: "https://www.wada-ama.org/sites/default/files/2025-09/2026list_en_final_clean_september_2025.pdf"
  quote: "Myostatin inhibitors such as: Agents reducing or ablating myostatin expression Myostatin-binding proteins (e.g. follistatin, myostatin propeptide)"
