regulatory:
  - jurisdiction: US
    status: unapproved
    detail: "Not approved: FDA has approved no product containing MOTS-c. FDA's list of bulk substances that may present significant safety risks places MOTs-C among substances previously in 503A Category 2 whose nominations were withdrawn by the nominators; it is not on the current 503A Category 1 or 2 lists (updated 14 May 2026). FDA cites possible immunogenicity and peptide impurity and characterisation concerns."
    source_url: "https://www.fda.gov/drugs/human-drug-compounding/certain-bulk-drug-substances-use-compounding-may-present-significant-safety-risks"
    source_title: "Certain Bulk Drug Substances for Use in Compounding that May Present Significant Safety Risks (FDA, content current as of 04/22/2026)"
    quote: "FDA has not identified any human exposure data on drug products containing MOTs-C administered via any route of administration."
    retrieved: "2026-10-10"
