what_it_is: >-
  A 16-amino-acid peptide encoded in mitochondrial DNA and found naturally in
  human blood and muscle. A synthetic version is sold on the gray market with
  claims of weight loss, better insulin sensitivity, exercise performance and
  longevity. It is not approved as a medicine in any jurisdiction checked. FDA
  states it has identified no human exposure data for products containing it by
  any route. The World Anti-Doping Agency names it as a prohibited metabolic
  modulator.
evidence:
  - indication: "Obesity, weight loss and insulin resistance"
    tier: E6
    human_rcts: 0
    human_trials_any: 0
    summary: >-
      The founding study reported that MOTS-c treatment in mice prevented
      diet-induced obesity and age-related and diet-induced insulin resistance.
      No published human trial of MOTS-c for weight, glucose control or insulin
      sensitivity was identified. A placebo-controlled phase 2 trial in adults
      with prediabetes was registered in China in 2026 and is recruiting, with no
      results. A company-developed analogue (CB4211) completed a phase 1 trial,
      but that is a different molecule and its results were not identified in a
      peer-reviewed journal.
    citations:
      - doi: "10.1016/j.cmet.2015.02.009"
        title: "The Mitochondrial-Derived Peptide MOTS-c Promotes Metabolic Homeostasis and Reduces Obesity and Insulin Resistance"
        year: 2015
        finding: "MOTS-c treatment prevented diet-induced obesity and insulin resistance in mice"
    trials_query: "MOTS-c"
  - indication: "Exercise performance, physical capacity and ageing"
    tier: E6
    human_rcts: 0
    human_trials_any: 0
    summary: >-
      In mice, MOTS-c treatment increased running performance in young,
      middle-aged and old animals, and treatment started late in life increased
      physical capacity. In humans, the same study measured only endogenous
      MOTS-c, which rose in muscle and blood with exercise; no human was given
      MOTS-c. No human trial of administered MOTS-c for exercise capacity,
      muscle function or ageing outcomes was identified.
    citations:
      - doi: "10.1038/s41467-020-20790-0"
        title: "MOTS-c is an exercise-induced mitochondrial-encoded regulator of age-dependent physical decline and muscle homeostasis"
        year: 2021
        finding: "MOTS-c treatment increased running capacity in young, middle-aged and old mice; endogenous MOTS-c rose with exercise in humans"
    trials_query: "MOTS-c"
safety:
