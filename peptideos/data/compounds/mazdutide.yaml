class_by_jurisdiction: {US: B, EU: B, UK: B, CA: B, AU: B, JP: B, CN: A}
what_it_is: >-
  A synthetic peptide that activates the glucagon and GLP-1 receptors,
  co-developed by Innovent Biologics and Eli Lilly. A peer-reviewed
  drug-development review (Drugs, 2025) reports approval in China in June 2025 for
  long-term weight management and in September 2025 for type 2 diabetes. It
  is not approved in the US, EU, Canada, Australia or Japan, where it remains
  investigational.
evidence:
  - indication: "Weight reduction in obesity or overweight"
    tier: E1
    human_rcts: null
    human_trials_any: null
    summary: >-
      GLORY-1 (phase 3, 610 Chinese adults): weight change at week 48 was
      -11.00% and -14.01% in the two dose groups versus +0.30% with placebo. A
      US phase 2 trial (179 adults, Lilly-funded) reported -7.3% to -18.1% across
      dose groups versus -0.9% with placebo at 32 weeks; discontinuation for
      adverse events reached 20% in the highest dose group.
    citations:
      - doi: "10.1056/NEJMoa2411528"
        title: "Once-Weekly Mazdutide in Chinese Adults with Obesity or Overweight"
        year: 2025
        finding: "GLORY-1: weight change -11.00% and -14.01% vs +0.30% with placebo at week 48"
      - doi: "10.1016/s2213-8587(26)00160-9"
        title: "Efficacy and safety of mazdutide in adults with obesity or overweight: a US-based, multicentre, phase 2, randomised, placebo-controlled clinical trial"
        year: 2026
        finding: "US phase 2: weight change -7.3% to -18.1% vs -0.9% with placebo at 32 weeks"
    trials_query: "mazdutide OR IBI362 OR LY3305677"
  - indication: "Type 2 diabetes: glycaemic control"
    tier: E1
    human_rcts: null
    human_trials_any: null
    summary: >-
      Two phase 3 trials in Chinese adults. Versus placebo (320 participants, 24
      weeks), HbA1c fell 1.57 and 2.15 percentage points versus 0.14. Versus the
      approved GLP-1 receptor agonist dulaglutide (731 participants, 28 weeks),
      both mazdutide doses were non-inferior and superior for HbA1c (differences
      -0.24 and -0.30 points) with greater weight loss. Gastrointestinal adverse
      events were more frequent than with dulaglutide.
    citations:
      - doi: "10.1038/s41586-025-10026-w"
        title: "Mazdutide versus placebo in Chinese adults with type 2 diabetes"
        year: 2025
        finding: "HbA1c change -1.57 and -2.15 vs -0.14 points with placebo at 24 weeks"
      - doi: "10.1038/s41586-025-10031-z"
        title: "Mazdutide versus dulaglutide in Chinese adults with type 2 diabetes"
        year: 2025
        finding: "HbA1c superior to dulaglutide (differences -0.24 and -0.30 points) at 28 weeks"
    trials_query: "mazdutide OR IBI362"
safety:
  grade: S2
  no_data_statement: true
  known_signals:
    - signal: "Gastrointestinal adverse events"
      evidence: "Diarrhoea, nausea and vomiting were the most common adverse events in phase 3 trials; incidence was higher than with dulaglutide in DREAMS-2. In the US phase 2 trial, discontinuation for adverse events reached 20% in the highest dose group, mainly gastrointestinal."
      citation: {doi: "10.1038/s41586-025-10031-z", title: "Mazdutide versus dulaglutide in Chinese adults with type 2 diabetes"}
