  inn: "tesamorelin"
  common: ["Tesamorelin", "Tesamorelin acetate", "TH9507"]
  codes: ["TH9507"]
  brands: ["Egrifta", "Egrifta SV", "Egrifta WR"]
  cas: null
sequence: null
sequence_note: "The full 44-residue sequence of human growth hormone-releasing factor (GHRH 1-44) with a trans-3-hexenoyl group attached to the N-terminal tyrosine (US label, section 11). Left null because of the N-terminal acylation."
class_by_jurisdiction: {US: A, EU: C, UK: null, CA: C, AU: null, JP: null, CN: null}
what_it_is: >-
  A synthetic, chemically stabilised version of human growth hormone-releasing
  hormone (GHRH). It is approved in the US only for reducing excess abdominal fat
  in adults with HIV and lipodystrophy; the US label states it is not indicated
  for weight loss. An EU marketing application was withdrawn in 2012, and its
  Canadian product listing was cancelled in 2022. It is also offered outside its
  label for fat loss, body composition, cognition and "anti-ageing".
evidence:
  - indication: "Excess abdominal (visceral) fat in adults with HIV-associated lipodystrophy"
    tier: E1
    human_rcts: 2
    human_trials_any: null
    summary: >-
      Two randomised placebo-controlled trials (412 and 404 participants) found
      that tesamorelin reduced CT-measured visceral fat over 26 weeks (about 15%
      and 11% versus small changes on placebo), with improvements in some lipid
      measures and raised IGF-1. In the extension phase, visceral fat returned
      toward baseline after switching to placebo. Neither trial measured
      cardiovascular events; the US label states long-term cardiovascular safety
      is not established, and the EMA's committee questioned whether the fat
      reduction was clinically meaningful.
    citations:
      - doi: "10.1056/NEJMoa072375"
        title: "Metabolic Effects of a Growth Hormone–Releasing Factor in Patients with HIV"
        year: 2007
        finding: "Visceral adipose tissue fell 15.2% with tesamorelin versus a 5.0% rise with placebo over 26 weeks in 412 adults with HIV"
      - doi: "10.1097/QAI.0b013e3181cbdaff"
        title: "Effects of Tesamorelin, a Growth Hormone–Releasing Factor, in HIV-Infected Patients With Abdominal Fat Accumulation: A Randomized Placebo-Controlled Trial With a Safety Extension"
        year: 2010
        finding: "Visceral fat fell 10.9% versus 0.6% on placebo at 6 months; gains were lost after switching to placebo"
      - doi: "10.1097/QAD.0b013e32830a5058"
        title: "Long-term safety and effects of tesamorelin, a growth hormone-releasing factor analogue, in HIV patients with abdominal fat accumulation"
        year: 2008
        finding: "26-week re-randomised extension of the first Phase 3 trial reporting longer-term safety and visceral fat effects in adults with HIV"
    trials_query: "tesamorelin"
  - indication: "Fatty liver (NAFLD) in people with HIV"
    tier: E3
    human_rcts: 0
    human_trials_any: 2
    summary: >-
      Two small randomised placebo-controlled trials in people with HIV (50 and
      61 participants) found reductions in liver fat; the larger trial's primary
      endpoint was a 4.1 percentage-point absolute reduction in hepatic fat
      fraction over 12 months. Neither was powered for liver-related clinical
      outcomes, and the authors called for further studies of long-term
      histological effects. Not an approved indication.
    citations:
      - doi: "10.1016/S2352-3018(19)30338-8"
        title: "Effects of tesamorelin on non-alcoholic fatty liver disease in HIV: a randomised, double-blind, multicentre trial"
        year: 2019
        finding: "Greater reduction in hepatic fat fraction than placebo over 12 months in 61 adults with HIV and NAFLD"
      - doi: "10.1001/jama.2014.8334"
        title: "Effect of Tesamorelin on Visceral Fat and Liver Fat in HIV-Infected Patients With Abdominal Fat Accumulation"
        year: 2014
        finding: "Reduced visceral fat and modestly reduced liver fat over 6 months versus placebo in 50 adults with HIV"
    trials_query: "tesamorelin AND fatty liver"
  - indication: "Visceral fat and cardiometabolic markers in people without HIV (abdominal obesity)"
    tier: E3
    human_rcts: 0
    human_trials_any: 1
    summary: >-
      One randomised placebo-controlled trial of 60 abdominally obese adults
      selected for reduced growth hormone secretion found lower visceral fat,
      triglycerides, C-reactive protein and carotid intima-media thickness after
      12 months, with no change in subcutaneous fat. No trial has tested it in
      obesity without that selection, and none measured clinical outcomes. The
      US label states it is not indicated for weight loss and has a
      weight-neutral effect.
    citations:
      - doi: "10.1210/jc.2012-2794"
        title: "Metabolic Effects of a Growth Hormone-Releasing Factor in Obese Subjects with Reduced Growth Hormone Secretion: A Randomized Controlled Trial"
        year: 2012
        finding: "Reduced visceral adipose tissue versus placebo over 12 months in 60 abdominally obese adults with reduced GH secretion"
    trials_query: "tesamorelin AND obesity"
  - indication: "Cognition in older adults and mild cognitive impairment"
    tier: E3
    human_rcts: 0
    human_trials_any: 1
    summary: >-
      One randomised placebo-controlled trial of 152 adults aged 55 to 87 (66
      with mild cognitive impairment) reported a favourable effect on a cognitive
      composite after 20 weeks, driven mainly by executive function. Adverse
      events were reported by 68% on tesamorelin versus 36% on placebo. The
      result has not been replicated in a larger or longer trial, and no
      dementia or functional outcomes were assessed.
    citations:
      - doi: "10.1001/archneurol.2012.1970"
        title: "Effects of Growth Hormone–Releasing Hormone on Cognitive Function in Adults With Mild Cognitive Impairment and Healthy Older Adults"
        year: 2012
        finding: "Favourable effect on a cognitive composite versus placebo over 20 weeks in older adults with and without mild cognitive impairment"
    trials_query: "tesamorelin AND cognition"
safety:
  grade: S2
  no_data_statement: false
  known_signals:
    - signal: "Glucose intolerance or diabetes, fluid retention (oedema, arthralgia, carpal tunnel syndrome), hypersensitivity reactions, raised IGF-1"
      evidence: "Listed in Warnings and Precautions of the current US label, which also contraindicates use with active malignancy and states the effects of prolonged IGF-1 elevation are unknown."
      citation: {url: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/022505s020lbl.pdf", title: "EGRIFTA WR (tesamorelin) for injection Prescribing Information"}
    - signal: "Anti-drug antibodies"
      evidence: "The US label reports anti-tesamorelin IgG antibodies in about half of trial patients at 26 and 52 weeks, with cross-reactivity to endogenous GHRH in about 60% of antibody-positive patients."
      citation: {url: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/022505s020lbl.pdf", title: "EGRIFTA WR (tesamorelin) for injection Prescribing Information"}
regulatory:
  - jurisdiction: US
    status: approved
    detail: "Approved 10 Nov 2010 (Theratechnologies; originally NDA 022505, deemed a BLA on 23 March 2020). Current formulations are Egrifta SV and Egrifta WR, which the label states are not substitutable. Indication limited to reduction of excess abdominal fat in HIV-infected adults with lipodystrophy. Not on any 503A bulk-substance category list (FDA list updated 14 May 2026)."
    source_url: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/022505s020lbl.pdf"
    source_title: "EGRIFTA WR (tesamorelin) for injection Prescribing Information, revised 3/2025"
    quote: "EGRIFTA WR is a growth hormone-releasing factor (GHRF) analog indicated for the reduction of excess abdominal fat in HIV"
    retrieved: "2026-10-10"
  - jurisdiction: EU
    status: unapproved
    detail: "Not authorised. The marketing application (Ferrer Internacional) was withdrawn on 21 June 2012; at that point the CHMP's provisional opinion was that it could not have been approved, citing doubts about clinical meaningfulness of the fat reduction, applicability to European patients and IGF-1 elevation."
    source_url: "https://www.ema.europa.eu/en/medicines/human/EPAR/egrifta"
    source_title: "Egrifta: withdrawn application | European Medicines Agency (EMA)"
    quote: "the CHMP had some concerns and was of the provisional opinion that Egrifta could not have been approved for the treatment of excess abdominal fat in HIV patients with lipodystrophy."
    retrieved: "2026-10-10"
  - jurisdiction: CA
    status: withdrawn
    detail: "Health Canada's Drug Product Database lists EGRIFTA (DIN 02438712, first marketed 23 June 2015) as Cancelled Post Market since 30 Sept 2022; a second EGRIFTA listing (DIN 02423677) is Cancelled Pre Market. No other tesamorelin product was found in the database."
    source_url: "https://health-products.canada.ca/dpd-bdpp/info?lang=eng&code=92311"
    source_title: "Drug Product Database: EGRIFTA (DIN 02438712)"
    quote: "Current status: Cancelled Post Market Current status date: 2022-09-30"
    retrieved: "2026-10-10"
