  inn: "teriparatide"
  common: ["Teriparatide", "PTH(1-34)", "rhPTH(1-34)", "Parathyroid hormone (1-34)"]
  codes: []
  brands: ["Forteo", "Forsteo", "Bonsity", "Movymia", "Terrosa", "Livogiva", "Sondelbay", "Kauliv", "Teriparatide SUN", "Zandoriah", "Osnuvo"]
  cas: null
sequence: "SVSEIQLMHNLGKHLNSMERVEWLRKKLQDVHNF"
sequence_note: "Identical to the 34 N-terminal residues of the 84-residue human parathyroid hormone; Forteo is produced in a recombinant Escherichia coli strain (US label, section 11)."
class_by_jurisdiction: {US: A, EU: A, UK: null, CA: A, AU: null, JP: A, CN: null}
what_it_is: >-
  A 34-amino-acid fragment of human parathyroid hormone, the region responsible
  for its biological activity. It is an approved prescription medicine for
  osteoporosis in the US, EU, Canada and Japan, sold originally as Forteo
  (Forsteo in the EU) and now also as several follow-on and biosimilar products.
  Unlike most osteoporosis drugs, which slow bone breakdown, it is classed as a
  bone-forming (anabolic) agent. Regulatory status in the UK, Australia and China
  was not verified for this record.
evidence:
  - indication: "Postmenopausal osteoporosis (fracture prevention)"
    tier: E1
    human_rcts: 2
    human_trials_any: null
    summary: >-
      Two large randomised controlled trials with fracture endpoints support this
      approved indication. In the pivotal placebo-controlled trial of 1,637
      postmenopausal women with prior vertebral fracture, teriparatide reduced
      new vertebral and nonvertebral fragility fractures and increased bone mineral
      density. In VERO, a double-blind trial of 1,360 women with severe
      osteoporosis, new vertebral fractures were less frequent with teriparatide
      than with the active comparator risedronate. Reduction of hip fracture has
      not been demonstrated (EMA product overview).
    citations:
      - doi: "10.1056/NEJM200105103441904"
        title: "Effect of Parathyroid Hormone (1-34) on Fractures and Bone Mineral Density in Postmenopausal Women with Osteoporosis"
        year: 2001
        finding: "Reduced new vertebral and nonvertebral fragility fractures versus placebo in postmenopausal women with prior vertebral fracture"
      - doi: "10.1016/S0140-6736(17)32137-2"
        title: "Effects of teriparatide and risedronate on new fractures in post-menopausal women with severe osteoporosis (VERO): a multicentre, double-blind, double-dummy, randomised controlled trial"
        year: 2018
        finding: "New vertebral fractures in 5.4% with teriparatide versus 12.0% with risedronate over 24 months in women with severe osteoporosis"
    trials_query: "teriparatide"
  - indication: "Osteoporosis in men"
    tier: E2
    human_rcts: 1
    human_trials_any: null
    summary: >-
      One randomised placebo-controlled trial in 437 men with low bone density
      showed increased spine and hip bone mineral density. Its endpoint was bone
      density, not fracture; the trial was stopped early, after a median of about
      11 months, because of the rat osteosarcoma finding. The US label accordingly
      describes the male indication as increasing bone mass, not reducing
      fractures.
    citations:
      - doi: "10.1359/jbmr.2003.18.1.9"
        title: "The Effect of Teriparatide [Human Parathyroid Hormone (1–34)] Therapy on Bone Density in Men With Osteoporosis"
        year: 2003
        finding: "Increased lumbar spine and femoral neck bone mineral density versus placebo in men with osteoporosis"
    trials_query: "teriparatide AND male osteoporosis"
  - indication: "Glucocorticoid-induced osteoporosis"
    tier: E2
    human_rcts: 1
    human_trials_any: null
    summary: >-
      One randomised double-blind trial of 428 adults on long-term glucocorticoids
      compared teriparatide with alendronate. Lumbar spine bone mineral density
      rose more with teriparatide (primary endpoint), and fewer new vertebral
      fractures were recorded in the teriparatide group (a secondary outcome);
      serum calcium elevations were more common with teriparatide. No placebo-controlled
      fracture trial exists in this population.
    citations:
      - doi: "10.1056/NEJMoa071408"
        title: "Teriparatide or Alendronate in Glucocorticoid-Induced Osteoporosis"
        year: 2007
        finding: "Greater increase in lumbar spine bone mineral density with teriparatide than with alendronate in glucocorticoid-treated adults"
    trials_query: "teriparatide AND glucocorticoid"
  - indication: "Acceleration of fracture healing (off-label claim)"
    tier: E3
    human_rcts: 0
    human_trials_any: null
    summary: >-
      Not an approved use. In a randomised double-blind trial of 102
      postmenopausal women with distal radius fractures, the prespecified primary
      comparison (higher-dose teriparatide versus placebo) showed no difference
      in time to radiographic healing; a shorter healing time in the lower-dose
      arm came from a post hoc analysis that the authors said should be
      interpreted with caution. No adequately powered trial has shown faster
      fracture healing.
    citations:
      - doi: "10.1359/jbmr.090731"
        title: "Teriparatide for acceleration of fracture repair in humans: A prospective, randomized, double-blind study of 102 postmenopausal women with distal radial fractures"
        year: 2010
        finding: "Primary hypothesis (shorter time to cortical bridging with the higher-dose arm versus placebo) not supported in women with distal radial fractures"
    trials_query: "teriparatide AND fracture healing"
safety:
  grade: S1
  no_data_statement: false
  known_signals:
    - signal: "Osteosarcoma in rats"
      evidence: "Long-term treatment of F344 rats produced bone neoplasms, including osteosarcoma, with incidence dependent on dose and treatment duration. The US label retains an osteosarcoma warning and states there are limited data on risk beyond 2 years of use."
      citation: {doi: "10.1080/01926230490462138", title: "Bone Neoplasms in F344 Rats Given Teriparatide [rhPTH(1-34)] Are Dependent on Duration of Treatment and Dose"}
    - signal: "Osteosarcoma in humans: no increase detected in surveillance"
      evidence: "A 15-year US postmarketing surveillance study found adult osteosarcoma incidence among teriparatide users no different from the expected background rate. The current US label states that osteosarcoma has been reported post-marketing but an increased risk has not been observed in human observational studies; it carries no boxed warning."
      citation: {doi: "10.1002/jbmr.4188", title: "Teriparatide Did Not Increase Adult Osteosarcoma Incidence in a 15-Year US Postmarketing Surveillance Study"}
    - signal: "Hypercalcaemia, hypersensitivity reactions, cutaneous calcification and urolithiasis risk"
      evidence: "Listed in Warnings and Precautions of the current US label (revised 08/2026), which added hypersensitivity reactions as a recent major change."
      citation: {url: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2026/021318Orig1s059lbl.pdf", title: "FORTEO (teriparatide injection) Prescribing Information"}
