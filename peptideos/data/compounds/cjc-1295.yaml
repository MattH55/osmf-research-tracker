sequence_note: "A modified GHRH(1-29) amide analogue with a C-terminal reactive group designed to bind covalently to circulating albumin (the developer's 'drug affinity complex'), which extended its half-life to several days in humans. A 29-residue amidated GHRH analogue without the albumin-binding group has been identified in material sold under the CJC-1295 name."
class_by_jurisdiction: {US: C, EU: C, UK: null, CA: C, AU: null, JP: null, CN: null}
what_it_is: >-
  A synthetic, long-acting analogue of growth hormone-releasing hormone (GHRH)
  developed by ConjuChem in the 2000s. Its only registered efficacy trial, in
  people with HIV and abdominal fat, was terminated in 2006 and never reported.
  It has no approval anywhere checked and no active sponsor. It is sold as a
  "research chemical" with claims of
  muscle gain, fat loss, better sleep and "anti-ageing". FDA has identified
  serious adverse events associated with it.
evidence:
  - indication: "Raising GH and IGF-1 levels (pharmacodynamic marker, healthy adults)"
    tier: E3
    human_rcts: 0
    human_trials_any: 2
    summary: >-
      Two randomised, placebo-controlled, ascending-dose studies in healthy
      adults (lasting 28 and 49 days) found dose-dependent rises in plasma GH
      and IGF-1 lasting days after a single dose, with an estimated half-life of
      about 6 to 8 days; no serious adverse reactions were reported. A separate
      uncontrolled before-and-after study in healthy young men found raised
      trough and mean GH with preserved pulsatility, and higher IGF-1, one week
      after a single dose. These are small, short studies of a hormone marker,
      not of any clinical outcome.
    citations:
      - doi: "10.1210/jc.2005-1536"
        title: "Prolonged Stimulation of Growth Hormone (GH) and Insulin-Like Growth Factor I Secretion by CJC-1295, a Long-Acting Analog of GH-Releasing Hormone, in Healthy Adults"
        year: 2006
        finding: "Dose-dependent increases in plasma GH and IGF-1 lasting days in healthy adults in two randomised, placebo-controlled dose-escalation studies; estimated half-life 5.8 to 8.1 days"
      - doi: "10.1210/jc.2006-1702"
        title: "Pulsatile Secretion of Growth Hormone (GH) Persists during Continuous Stimulation by CJC-1295, a Long-Acting GH-Releasing Hormone Analog"
        year: 2006
        finding: "Raised trough and mean GH and IGF-1 with preserved GH pulsatility one week after a single dose in healthy young men (uncontrolled)"
    trials_query: "CJC-1295"
  - indication: "Muscle gain, fat loss, recovery, sleep and anti-ageing (gray-market claims)"
    tier: E8
    human_rcts: 0
    human_trials_any: 0
    summary: >-
      No published study in humans or animals has tested any of these outcomes.
      Published human studies measured only hormone levels (GH and IGF-1) in
      healthy adults over weeks (see the pharmacodynamic entry above). Raised
      hormone levels are a laboratory measure, not evidence of muscle gain, fat
      loss, better sleep or any health benefit.
    citations:
      - doi: "10.1002/dta.233"
        title: "Identification of CJC‐1295, a growth‐hormone‐releasing peptide, in an unknown pharmaceutical preparation"
        year: 2010
        finding: "Product-identity finding, not efficacy: a seized preparation contained a 29-residue amidated peptide consistent with the sequence marketed as CJC-1295"
    trials_query: "CJC-1295"
  - indication: "Visceral fat in people with HIV"
    tier: E8
    human_rcts: 0
    human_trials_any: 0
    summary: >-
      A randomised placebo-controlled Phase 2 trial in 120 people with
      HIV-associated visceral obesity (NCT00267527, ConjuChem) began in December
      2005 and is registered as terminated in 2006. No reason is given on the
      registry and no results were posted or published, so it is not counted
      as a published trial. No published study in humans or animals has tested
      CJC-1295 on visceral fat.
    citations: []
    trials_query: "CJC-1295"
  - indication: "Growth in GHRH deficiency"
    tier: E6
    human_rcts: 0
    human_trials_any: 0
    summary: >-
      In mice genetically lacking GHRH, five weeks of treatment from one week of
      age normalised body weight, length and body composition when given every
      24 hours, with lesser effects at longer intervals. This is a deficiency
      model; it does not show effects in animals or people with normal GHRH.
      No human growth study exists.
    citations:
      - doi: "10.1152/ajpendo.00201.2006"
        title: "Once-daily administration of CJC-1295, a long-acting growth hormone-releasing hormone (GHRH) analog, normalizes growth in the GHRH knockout mouse"
        year: 2006
        finding: "Normalised body weight, length and body composition in GHRH-knockout mice"
    trials_query: "CJC-1295"
safety:
  grade: S3
  no_data_statement: true
  known_signals:
    - signal: "Increased heart rate and systemic vasodilatory reaction"
      evidence: "FDA's compounding safety-risk summary states it has identified serious adverse events associated with CJC-1295, including increased heart rate and a systemic vasodilatory reaction, and that available clinical data are limited. The underlying case details are not published there."
      citation: {url: "https://www.fda.gov/drugs/human-drug-compounding/certain-bulk-drug-substances-use-compounding-may-present-significant-safety-risks", title: "Certain Bulk Drug Substances for Use in Compounding that May Present Significant Safety Risks"}
    - signal: "Immunogenicity and impurity concerns"
      evidence: "FDA states compounded CJC-1295 may pose a risk of immunogenicity for certain routes and raises peptide-impurity and characterisation concerns."
      citation: {url: "https://www.fda.gov/drugs/human-drug-compounding/certain-bulk-drug-substances-use-compounding-may-present-significant-safety-risks", title: "Certain Bulk Drug Substances for Use in Compounding that May Present Significant Safety Risks"}
