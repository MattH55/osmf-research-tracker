sequence_note: "Lipidated (fatty-acid acylated), long-acting analogue of human amylin with amino-acid substitutions; design described in Kruse et al., J Med Chem 2021. Full modified sequence not reproduced here because it was not verified against a regulator document."
class_by_jurisdiction: {US: B, EU: B, UK: B, CA: B, AU: B, JP: null, CN: null}
what_it_is: >-
  A synthetic, long-acting analogue of amylin, a pancreatic hormone involved in
  satiety, developed by Novo Nordisk for weight management, alone and in a fixed
  combination with semaglutide (CagriSema). It is investigational: no product
  containing it was found in the US, EU, UK, Canadian or Australian regulator
  databases checked on the retrieval date. Material sold online under this name is
  not the sponsor's product and is of unverified identity and purity.
evidence:
  - indication: "Weight management in adults with overweight or obesity (cagrilintide alone)"
    tier: E2
    human_rcts: 2
    human_trials_any: null
    summary: >-
      One adequately sized phase 2 dose-finding RCT (706 participants, 26 weeks)
      found greater mean weight reduction with every cagrilintide dose than with
      placebo, with gastrointestinal adverse events (mainly nausea) more frequent
      than with placebo. The phase 3a REDEFINE 1 trial included a cagrilintide-alone
      arm (302 participants) as a comparator, but its published primary comparison
      was the combination against placebo. Dedicated phase 3 monotherapy trials are
      registered and have not reported. Published results for cagrilintide alone
      beyond 68 weeks are absent.
    citations:
      - doi: "10.1016/s0140-6736(21)01751-7"
        title: "Once-weekly cagrilintide for weight management in people with overweight and obesity: a multicentre, randomised, double-blind, placebo-controlled and active-controlled, dose-finding phase 2 trial"
        year: 2021
        finding: "All cagrilintide doses produced greater 26-week weight reduction than placebo in adults with overweight or obesity; nausea was the most frequent adverse event"
      - doi: "10.1056/nejmoa2502081"
        title: "Coadministered Cagrilintide and Semaglutide in Adults with Overweight or Obesity"
        year: 2025
        finding: "Phase 3a RCT with a cagrilintide-alone comparator arm; primary analysis compared the combination with placebo over 68 weeks"
    trials_query: "cagrilintide"
  - indication: "Weight management in adults with overweight or obesity, with or without type 2 diabetes (cagrilintide plus semaglutide, CagriSema)"
    tier: E1
    human_rcts: 2
    human_trials_any: null
    summary: >-
      Two phase 3a placebo-controlled RCTs report consistent results over 68 weeks.
      In adults without diabetes (REDEFINE 1, 3417 randomised) mean body-weight
      change was -20.4% with the combination versus -3.0% with placebo. In adults
      with type 2 diabetes (REDEFINE 2, 1206 randomised) it was -13.7% versus -3.4%,
      with more participants reaching glycated haemoglobin of 6.5% or less.
      Gastrointestinal adverse events were common (79.6% versus 39.9% in REDEFINE 1).
      Neither trial's registry record had posted results on the retrieval date.
      Cardiovascular outcome data (REDEFINE 3) are not yet reported.
    citations:
      - doi: "10.1056/nejmoa2502081"
        title: "Coadministered Cagrilintide and Semaglutide in Adults with Overweight or Obesity"
        year: 2025
        finding: "Greater 68-week weight reduction with cagrilintide-semaglutide than placebo in adults without diabetes"
      - doi: "10.1056/nejmoa2502082"
        title: "Cagrilintide–Semaglutide in Adults with Overweight or Obesity and Type 2 Diabetes"
        year: 2025
        finding: "Greater 68-week weight reduction and glycaemic improvement than placebo in adults with type 2 diabetes"
    trials_query: "cagrilintide"
safety:
  grade: S2
  no_data_statement: true
  known_signals:
    - signal: "Gastrointestinal adverse events (nausea, vomiting, diarrhoea, constipation)"
      evidence: "Reported more often than placebo in the phase 2 monotherapy RCT and in the phase 3a combination RCTs; mostly transient and mild to moderate. No post-marketing data exist because no product is approved."
      citation: {doi: "10.1056/nejmoa2502081", title: "Coadministered Cagrilintide and Semaglutide in Adults with Overweight or Obesity"}
