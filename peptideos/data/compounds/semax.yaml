sequence: "MEHFPGP"
sequence_note: "Heptapeptide: the ACTH(4-7) fragment Met-Glu-His-Phe extended with Pro-Gly-Pro at the C-terminus. It has no corticotropic (adrenal-stimulating) activity attributed to it in the literature cited."
class_by_jurisdiction: {US: C, EU: C, UK: null, CA: C, AU: null, JP: null, CN: null}
what_it_is: >-
  A synthetic seven-amino-acid peptide built from a fragment of the hormone ACTH
  with a Pro-Gly-Pro tail added for stability. It was developed in Russia, where
  most of its clinical literature was published. It is sold online elsewhere as a
  research chemical with claims of improving cognition and focus and of protecting
  the brain after stroke. No approved medicine contains it in any jurisdiction
  checked for this record.
evidence:
  - indication: "Recovery after ischaemic stroke"
    tier: E4
    human_rcts: null
    human_trials_any: null
    summary: >-
      Two Russian clinical reports in people with ischaemic stroke compared semax
      added to standard care with standard care alone: a 1997 study of 30 treated
      patients against 80 controls, and a 2018 study of 110 patients divided by
      rehabilitation timing and semax use. Both reported faster recovery of
      neurological or motor function and, in 2018, higher blood BDNF levels. Neither
      abstract describes randomisation or blinding, and the 1997 control group was
      not concurrent-randomised, so these are counted as non-randomised human data.
      No placebo-controlled trial with a functional outcome was identified.
    citations:
      - pmid: 11517472
        title: "[Effectiveness of semax in acute period of hemispheric ischemic stroke (a clinical and electrophysiological study)]."
        year: 1997
        finding: "Faster regression of neurological deficits reported in 30 patients with acute ischaemic stroke given semax with standard therapy than in 80 patients on standard therapy"
      - doi: "10.17116/jnevro20181183261-68"
        title: "The efficacy of semax in the tretament of patients at different stages of ischemic stroke"
        year: 2018
        finding: "Higher plasma BDNF and better Barthel index scores reported in post-stroke patients given semax than in those not given it during rehabilitation"
    trials_query: "semax"
  - indication: "Cognitive enhancement (memory, attention, focus)"
    tier: E6
    human_rcts: 0
    human_trials_any: 0
    summary: >-
      Effects on learning and memory have been reported in rats, including
      counteracting heavy-metal-induced impairment of avoidance learning and
      altering spatial memory after prefrontal ischaemic lesions. No human trial
      measuring memory, attention or other cognitive performance was identified. One
      small placebo-controlled brain-imaging study in 24 healthy volunteers found a
      change in a resting-state brain network minutes after intranasal semax; it did
      not test cognitive performance and is not counted as an efficacy trial.
    citations:
      - doi: "10.1134/S0012496616030066"
        title: "Semax prevents learning and memory inhibition by heavy metals"
        year: 2016
        finding: "Counteracted heavy-metal-induced inhibition of avoidance conditioning in rats"
      - doi: "10.1007/s11055-009-9197-4"
        title: "Formation of Spatial Memory in Rats with Ischemic Lesions to the Prefrontal Cortex; Effects of a Synthetic Analog of ACTH(4-7)"
        year: 2009
        finding: "Effects on spatial memory formation in rats with prefrontal ischaemic lesions"
      - doi: "10.1007/s10517-018-4234-3"
        title: "Effects of Semax on the Default Mode Network of the Brain"
        year: 2018
        finding: "Larger rostral default-mode-network component on resting-state fMRI in healthy volunteers after semax than after placebo; no cognitive outcome measured"
    trials_query: "semax"
  - indication: "Anxiety"
    tier: E6
    human_rcts: 0
    human_trials_any: 0
    summary: >-
      Anxiety-related findings are from rodents: in adolescent rats exposed to
      neonatal maternal deprivation, semax given in early life normalised measures of
      anxiety-like behaviour. No human study of semax for anxiety was identified.
    citations:
      - doi: "10.1007/s10517-012-1574-2"
        title: "Semax Attenuates the Influence of Neonatal Maternal Deprivation on the Behavior of Adolescent White Rats"
        year: 2012
        finding: "Normalised anxiety-like behaviour in adolescent rats exposed to neonatal maternal deprivation"
    trials_query: "semax"
