regulatory:
  - jurisdiction: US
    status: unapproved
    detail: "Not approved: FDA states it has approved no drug product containing thymosin alpha-1, and that it is not approved in the US, Japan or Europe except Italy. A nomination for the 503A bulks list was withdrawn; FDA reviewed it at its own discretion for the 4 December 2024 Pharmacy Compounding Advisory Committee and concluded the evaluation criteria weigh against adding it. FDA's safety-risks page lists Ta1 among substances previously in Category 2 whose nominations were withdrawn; it is not on the current Category 1 or 2 lists (updated 14 May 2026)."
    source_url: "https://www.fda.gov/media/183892/download"
    source_title: "Thymosin Alpha-1 (Ta1) Related Bulk Drug Substances (FDA presentation, Pharmacy Compounding Advisory Committee, December 4, 2024)"
    quote: "Ta1 is not approved in the United States, Japan, or Europe (except Italy)"
    retrieved: "2026-10-10"
