what_it_is: >-
  A 28-amino-acid peptide originally isolated from thymus tissue, made
  synthetically as thymalfasin (brand Zadaxin). It is an approved prescription
  medicine in some countries, mainly for chronic hepatitis B and as an immune
  adjunct, but is not approved in the United States. FDA states it is not
  approved in the US, Japan or Europe except Italy. In the US it is sold through
  compounding and gray-market channels with claims for viral infections,
  chronic fatigue, Lyme disease, cancer and general immune support.
evidence:
  - indication: "Chronic hepatitis B"
    tier: E3
    human_rcts: null
    human_trials_any: null
    summary: >-
      Several small randomised trials, mostly from the 1990s, gave mixed results.
      A Taiwanese trial of 98 patients reported higher combined viral clearance
      at 18 months with a 26-week course than with no treatment. A US phase 3
      double-blind placebo-controlled trial of 97 patients did not show a
      statistically significant difference. A meta-analysis of four small trials
      against interferon alpha found responses accumulated after treatment ended.
      FDA's 2024 review judged the evidence insufficient, noting outdated
      comparators and assays; none of the trials tested current standard
      antivirals as comparators.
    citations:
      - doi: "10.1002/hep.510270527"
        title: "Efficacy of thymosin α1 in patients with chronic hepatitis B: A randomized, controlled trial"
        year: 1998
        finding: "Higher complete virological response at 18 months than untreated controls in 98 patients with chronic hepatitis B"
      - doi: "10.1046/j.1365-2893.1999.00181.x"
        title: "Thymosin α1 treatment of chronic hepatitis B: results of a phase III multicentre, randomized, double-blind and placebo-controlled study"
        year: 1999
        finding: "Complete response 14% versus 4% with placebo in 97 patients, not statistically significant; authors state results do not confirm earlier reports"
      - doi: "10.1016/j.antiviral.2007.10.014"
        title: "Comparison of the efficacy of thymosin alpha-1 and interferon alpha in the treatment of chronic hepatitis B: A meta-analysis"
        year: 2008
        finding: "Across four small randomised trials (199 patients), responses were not better than interferon alpha at end of treatment but higher six months after treatment"
    trials_query: "thymosin alpha 1 hepatitis B"
  - indication: "Chronic hepatitis C"
    tier: E3
    human_rcts: 2
    human_trials_any: null
    summary: >-
      A randomised, double-blind, placebo-controlled trial in 552 patients who had
      not responded to earlier interferon-based therapy found no difference in
      sustained viral response when thymosin alpha-1 was added to peginterferon
      and ribavirin (12.7% versus 10.5%); a higher rate appeared only in a subgroup
      completing all 48 weeks. A small earlier placebo-controlled pilot reported
      no viral clearance. These trials used older interferon regimens, not current
      direct-acting antivirals.
    citations:
      - doi: "10.1111/j.1365-2893.2011.01524.x"
        title: "Thymosin alpha-1 with peginterferon alfa-2a/ribavirin for chronic hepatitis C not responsive to IFN/ribavirin: an adjuvant role?"
        year: 2012
        finding: "No difference in sustained viral response versus placebo in the intention-to-treat population of 552 patients"
    trials_query: "thymosin alpha 1 hepatitis C"
  - indication: "Sepsis"
    tier: E3
    human_rcts: 2
    human_trials_any: null
    summary: >-
      The largest trial, TESTS (1,106 adults with sepsis in 22 Chinese centres,
      double-blind, placebo-controlled), found no difference in 28-day mortality
      (23.4% versus 24.1%). An earlier single-blind randomised trial (ETASS, 361
      patients) reported lower 28-day mortality with a marginal p-value. The
      randomised evidence is therefore conflicting, and the larger, better-blinded
      trial was negative. All trials were conducted in China.
    citations:
      - doi: "10.1136/bmj-2024-082583"
        title: "The efficacy and safety of thymosin α1 for sepsis (TESTS): multicentre, double blinded, randomised, placebo controlled, phase 3 trial"
        year: 2025
        finding: "No difference in 28-day all-cause mortality versus placebo in 1,089 analysed adults with sepsis"
      - doi: "10.1186/cc11932"
        title: "The efficacy of thymosin alpha 1 for severe sepsis (ETASS): a multicenter, single-blind, randomized and controlled trial"
        year: 2013
        finding: "28-day mortality 26.0% versus 35.0% in 361 patients with severe sepsis, marginal statistical significance"
    trials_query: "thymosin alpha 1 sepsis"
  - indication: "COVID-19"
    tier: E4
    human_rcts: null
    human_trials_any: null
    summary: >-
      Evidence comes mainly from retrospective cohort studies early in the
      pandemic. A meta-analysis pooling eight studies reported lower mortality
      with marked heterogeneity and no difference in need for mechanical
      ventilation or length of stay; its authors called for randomised trials.
      FDA's 2024 review noted that three of four meta-analyses found no mortality
      reduction and judged the information insufficient.
    citations:
      - doi: "10.1007/s10787-023-01354-2"
        title: "The efficacy of thymosin alpha-1 therapy in moderate to critical COVID-19 patients: a systematic review, meta-analysis, and meta-regression"
        year: 2023
        finding: "Pooled data from eight mostly non-randomised studies associated treatment with lower mortality (high heterogeneity), with no difference in ventilation need or hospital stay"
    trials_query: "thymosin alpha 1 COVID-19"
  - indication: "Cancer (adjunct to chemotherapy; metastatic melanoma as the main tested setting)"
    tier: E3
    human_rcts: 1
    human_trials_any: null
    summary: >-
      A randomised trial in 488 patients with metastatic melanoma compared
      dacarbazine plus interferon alpha with arms adding thymosin alpha-1. More
      tumour responses were seen in two thymosin arms, but the differences in
      overall and progression-free survival did not reach statistical
      significance. FDA's 2024 review of liver and lung cancer studies found small
      randomised trials, single-arm and retrospective studies, and concluded the
      evidence was insufficient. These regimens are not current standard care.
    citations:
      - doi: "10.1200/JCO.2009.25.5208"
        title: "Large Randomized Study of Thymosin α 1, Interferon Alfa, or Both in Combination With Dacarbazine in Patients With Metastatic Melanoma"
        year: 2010
        finding: "More tumour responses with thymosin alpha-1 arms in 488 patients with metastatic melanoma; survival differences not statistically significant"
    trials_query: "thymosin alpha 1 cancer"
  - indication: "Chronic fatigue syndrome (ME/CFS)"
    tier: E8
    human_rcts: 0
    human_trials_any: 0
    summary: >-
      FDA's 2024 review for the Pharmacy Compounding Advisory Committee found no
      clinical studies of thymosin alpha-1 in ME/CFS and no data supporting
      effectiveness. No animal model study for this claim was identified in this
      review.
    citations: []
    trials_query: "thymosin alpha 1 chronic fatigue"
