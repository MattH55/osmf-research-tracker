sequence: "LKKTETQ"
sequence_note: "Seven residues corresponding to positions 17-23 of mature thymosin beta-4 (the actin-binding region). An anti-doping analysis identified the N-terminally acetylated form (Ac-LKKTETQ) in a product sold as TB-500; FDA names the substance 'thymosin beta-4, fragment (LKKTETQ), also known as TB-500'. The content of other products sold under this name was not assessed."
class_by_jurisdiction: {US: C, EU: null, UK: null, CA: null, AU: null, JP: null, CN: null}
what_it_is: >-
  A synthetic seven-amino-acid fragment of thymosin beta-4, a 43-residue
  protein found in most human cells. It is often marketed as if it were
  thymosin beta-4 itself, with claims of faster recovery from tendon, ligament
  and muscle injuries and wound healing. Research on the full-length protein
  does not transfer automatically to the fragment. TB-500 is not approved as a
  medicine in any jurisdiction checked. FDA states it has identified no human
  exposure data for it, and the World Anti-Doping Agency names it as
  prohibited.
evidence:
  - indication: "Injury recovery: tendon, ligament, muscle and skin wounds (TB-500 fragment itself)"
    tier: E6
    human_rcts: 0
    human_trials_any: 0
    summary: >-
      The only efficacy study of the fragment identified was in mice: the
      synthetic seven-residue peptide LKKTETQ gave dermal wound-repair results in
      aged mice comparable to full-length thymosin beta-4. No study of the
      fragment in tendon, ligament or muscle injury models was identified. No
      published human trial of TB-500 exists. A phase 1/2 trial of the fragment
      for cardiovascular biomarkers was registered in China in 2026 and is
      recruiting, with no results; it does not address injury recovery.
    citations:
      - doi: "10.1046/j.1524-475x.2003.11105.x"
        title: "Thymosin β4 and a synthetic peptide containing its actin-binding domain promote dermal wound repair in db/db diabetic mice and in aged mice"
        year: 2003
        finding: "The synthetic fragment LKKTETQ increased dermal wound closure in aged mice to a degree comparable with full-length thymosin beta-4"
    trials_query: "TB-500"
  - indication: "Chronic skin wounds and ulcers (full-length thymosin beta-4, not TB-500)"
    tier: E3
    human_rcts: 1
    human_trials_any: null
    summary: >-
      This row concerns full-length thymosin beta-4, a different molecule from
      TB-500, and is shown because marketing cites this research. A double-blind,
      placebo-controlled, dose-escalation phase 2 trial of topical thymosin beta-4
      in 73 patients with venous leg ulcers across eight European sites reported
      safety comparable to placebo; the efficacy findings were described only as
      suggestive, and no confirmatory trial was identified. No trial has tested
      injected full-length thymosin beta-4 for tendon, ligament or muscle injury.
    citations:
      - doi: "10.1111/j.1749-6632.2010.05490.x"
        title: "The effect of thymosin treatment of venous ulcers"
        year: 2010
        finding: "Topical full-length thymosin beta-4 was tolerated similarly to placebo in 73 patients with venous ulcers; efficacy reported as suggestive, not confirmed"
      - doi: "10.1046/j.1523-1747.1999.00708.x"
        title: "Thymosin β4 Accelerates Wound Healing"
        year: 1999
        finding: "Full-length thymosin beta-4 increased wound re-epithelialisation and contraction in a rat full-thickness wound model"
    trials_query: "thymosin beta 4"
