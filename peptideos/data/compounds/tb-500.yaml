regulatory:
  - jurisdiction: US
    status: unapproved
    detail: "Not approved: FDA has approved no product containing TB-500. FDA's list of bulk substances that may present significant safety risks names 'Thymosin beta-4, fragment (LKKTETQ), also known as TB-500' among substances previously in 503A Category 2 whose nominations were withdrawn; it is not on the current 503A Category 1 or 2 lists (updated 14 May 2026). FDA cites possible immunogenicity due to aggregation and peptide-related impurities."
    source_url: "https://www.fda.gov/drugs/human-drug-compounding/certain-bulk-drug-substances-use-compounding-may-present-significant-safety-risks"
    source_title: "Certain Bulk Drug Substances for Use in Compounding that May Present Significant Safety Risks (FDA, content current as of 04/22/2026)"
    quote: "FDA has not identified any human exposure data drug products containing Thymosin Beta-4, Fragment. FDA lacks important information regarding any safety issues raised by this drug, including whether it would cause harm if administered to humans."
