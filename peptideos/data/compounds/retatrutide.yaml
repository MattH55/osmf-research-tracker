what_it_is: >-
  An investigational synthetic peptide from Eli Lilly that activates three
  hormone receptors: GIP, GLP-1 and glucagon. It is in phase 3 development for
  obesity, type 2 diabetes and related conditions. It is not approved in any
  jurisdiction checked. The UK MHRA states it is not authorised and that
  products sold under the name are sold illegally; case reports describe harm
  after use of online-purchased material.
evidence:
  - indication: "Weight reduction in obesity or overweight (the main use it is sold for)"
    tier: E1
    human_rcts: null
    human_trials_any: null
    summary: >-
      Two published phase 3 trials and one phase 2 trial. TRIUMPH-1 (2,339
      adults without diabetes, 80 weeks): mean weight change -17.6% to -25.0%
      across dose groups versus -3.9% with placebo. TRIUMPH-2 (1,152 adults with
      obesity and type 2 diabetes, 80 weeks): -11.9% to -18.8% versus -5.1%. The
      phase 2 trial (338 adults, 48 weeks) reported -8.7% to -24.2% versus -2.1%.
      Phase 3 results of TRIUMPH-3 and TRIUMPH-4 (both completed on
      ClinicalTrials.gov) were not located in a publication.
    citations:
      - doi: "10.1056/nejmoa2604169"
        title: "Retatrutide, a Triple Hormone Receptor Agonist, for Treatment of Obesity"
        year: 2026
        finding: "TRIUMPH-1: weight change -17.6% to -25.0% vs -3.9% with placebo at 80 weeks in adults with obesity without diabetes"
      - doi: "10.1016/s0140-6736(26)01861-1"
        title: "Retatrutide in adults with obesity and type 2 diabetes (TRIUMPH-2): a double-blind, parallel-group, randomised, placebo-controlled, phase 3 trial"
        year: 2026
        finding: "TRIUMPH-2: weight change -11.9% to -18.8% vs -5.1% with placebo at 80 weeks in obesity with type 2 diabetes"
      - doi: "10.1056/NEJMoa2301972"
        title: "Triple–Hormone-Receptor Agonist Retatrutide for Obesity — A Phase 2 Trial"
        year: 2023
        finding: "Phase 2: weight change up to -24.2% vs -2.1% with placebo at 48 weeks"
    trials_query: "retatrutide AND obesity"
  - indication: "Type 2 diabetes: glycaemic control"
    tier: E2
    human_rcts: null
    human_trials_any: null
    summary: >-
      One published phase 3 trial (TRANSCEND-T2D-1, 537 adults managed with diet
      and exercise alone, 40 weeks): HbA1c fell 1.69 to 1.94 percentage points
      versus 0.81 with placebo. A phase 2 trial (281 participants) also reported
      HbA1c reductions. Phase 3 trials versus semaglutide (TRANSCEND-T2D-2) and in
      renal impairment (TRANSCEND-T2D-3) have not reported.
    citations:
      - doi: "10.1016/s0140-6736(26)00967-0"
        title: "Efficacy and safety of retatrutide, a GIP, GLP-1, and glucagon receptor agonist, in people with type 2 diabetes and inadequate glycaemic control with diet and exercise (TRANSCEND-T2D-1): a double-blind, randomised, phase 3 trial"
        year: 2026
        finding: "HbA1c change -1.69% to -1.94% vs -0.81% with placebo at 40 weeks"
      - doi: "10.1016/S0140-6736(23)01053-X"
        title: "Retatrutide, a GIP, GLP-1 and glucagon receptor agonist, for people with type 2 diabetes: a randomised, double-blind, placebo and active-controlled, parallel-group, phase 2 trial conducted in the USA"
        year: 2023
        finding: "Phase 2: dose-dependent HbA1c reductions at 24 weeks in type 2 diabetes"
    trials_query: "retatrutide AND type 2 diabetes"
  - indication: "Knee osteoarthritis pain with obesity"
    tier: E2
    human_rcts: null
    human_trials_any: null
    summary: >-
      In a 574-participant knee osteoarthritis subgroup of TRIUMPH-1, WOMAC pain
      scores improved more with retatrutide than placebo (differences -1.6 and
      -1.8 points on a 10-point scale, hybrid estimand). The dedicated knee
      osteoarthritis trial (TRIUMPH-4, NCT05931367) is completed on
      ClinicalTrials.gov but no publication was located.
    citations:
      - doi: "10.1056/nejmoa2604169"
        title: "Retatrutide, a Triple Hormone Receptor Agonist, for Treatment of Obesity"
        year: 2026
        finding: "WOMAC pain differences -1.6 and -1.8 points vs placebo in the knee osteoarthritis subgroup"
    trials_query: "retatrutide AND osteoarthritis"
  - indication: "Obstructive sleep apnoea with obesity"
    tier: E2
    human_rcts: null
    human_trials_any: null
    summary: >-
      In a 243-participant obstructive sleep apnoea subgroup of TRIUMPH-1, the
      apnoea-hypopnoea index fell by about 22 to 24 more events per hour than
      with placebo (both comparisons P<0.001). No standalone sleep apnoea trial
      result has been published.
    citations:
      - doi: "10.1056/nejmoa2604169"
        title: "Retatrutide, a Triple Hormone Receptor Agonist, for Treatment of Obesity"
        year: 2026
        finding: "AHI differences -24.4 and -21.9 events per hour vs placebo in the sleep apnoea subgroup"
    trials_query: "retatrutide AND sleep apnea"
  - indication: "Liver fat (metabolic dysfunction-associated steatotic liver disease)"
    tier: E3
    human_rcts: null
    human_trials_any: null
    summary: >-
      Evidence is a substudy of the phase 2 obesity trial (98 participants with
      at least 10% liver fat). Relative liver-fat change at 24 weeks ranged from
      -42.9% to -82.4% across dose groups versus +0.3% with placebo. Liver fat is
      a surrogate endpoint; no histology or liver-outcome trial has reported.
    citations:
      - doi: "10.1038/s41591-024-03018-2"
        title: "Triple hormone receptor agonist retatrutide for metabolic dysfunction-associated steatotic liver disease: a randomized phase 2a trial"
        year: 2024
        finding: "Relative liver-fat change -42.9% to -82.4% vs +0.3% with placebo at 24 weeks (n=98)"
    trials_query: "retatrutide AND liver"
safety:
  grade: S2
  no_data_statement: true
  known_signals:
    - signal: "Gastrointestinal adverse events"
      evidence: "In TRIUMPH-2, diarrhoea occurred in 27-34% and nausea in 14-28% of retatrutide groups versus 13% and 8% with placebo. Treatment discontinuation for adverse events or death reached 12% in one dose group versus 5% with placebo."
      citation: {doi: "10.1016/s0140-6736(26)01861-1", title: "Retatrutide in adults with obesity and type 2 diabetes (TRIUMPH-2): a double-blind, parallel-group, randomised, placebo-controlled, phase 3 trial"}
    - signal: "Dysaesthesia (abnormal skin sensation) and hypotension"
      evidence: "In TRIUMPH-2, dysaesthesia occurred in 4-7% versus 1% and hypotension in 1-6% versus <1% with placebo, increasing with dose."
      citation: {doi: "10.1016/s0140-6736(26)01861-1", title: "Retatrutide in adults with obesity and type 2 diabetes (TRIUMPH-2): a double-blind, parallel-group, randomised, placebo-controlled, phase 3 trial"}
    - signal: "Heart rate increase"
      evidence: "In the phase 2 obesity trial, dose-dependent increases in heart rate peaked at 24 weeks and declined thereafter."
      citation: {doi: "10.1056/NEJMoa2301972", title: "Triple–Hormone-Receptor Agonist Retatrutide for Obesity — A Phase 2 Trial"}
    - signal: "Harm after use of unlicensed online product"
      evidence: "Case report: a man with type 1 diabetes developed vomiting, diarrhoea, ketonaemia and acute kidney injury after self-administering an online-purchased product marketed as retatrutide (concurrent Shigella infection). Product identity was not confirmed."
      citation: {doi: "10.7759/cureus.115260", title: "Online-Sourced Retatrutide Complicating Impending Diabetic Ketoacidosis in a Patient With Type 1 Diabetes and Concurrent Shigella Gastroenteritis"}
