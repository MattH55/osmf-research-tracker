sequence_note: "Pentapeptide Aib-His-D-2-Nal-D-Phe-Lys-NH2 (Aib, alpha-aminoisobutyric acid; D-2-Nal, D-2-naphthylalanine); contains non-standard and D-amino acids."
class_by_jurisdiction: {US: C, EU: C, UK: null, CA: C, AU: null, JP: null, CN: null}
what_it_is: >-
  A synthetic five-residue peptide that stimulates growth hormone release by
  acting on the ghrelin (growth hormone secretagogue) receptor. It was developed
  by Novo Nordisk in the 1990s and later tested by Helsinn as an intravenous
  treatment for postoperative ileus, where its published Phase 2 trial did not
  meet its efficacy endpoints. It is not approved anywhere checked and has no
  active sponsor. It is sold as a "research chemical" with claims of muscle
  gain, fat loss, recovery, sleep and "anti-ageing".
evidence:
  - indication: "Muscle gain, fat loss, recovery, sleep and anti-ageing (gray-market claims)"
    tier: E8
    human_rcts: 0
    human_trials_any: 0
    summary: >-
      No human study has tested any of these outcomes. Human data are limited
      to a pharmacokinetic study in healthy men showing a single, short-lived
      rise in growth hormone after intravenous infusion. In mice, ipamorelin
      increased body fat rather than reducing it, an effect the authors
      attributed to GH-independent mechanisms such as increased feeding. Raised
      hormone levels are a laboratory measure, not evidence of muscle gain, fat
      loss or any health benefit.
    citations:
      - doi: "10.1023/a:1018955126402"
        title: "Pharmacokinetic-Pharmacodynamic Modeling of Ipamorelin, a Growth Hormone Releasing Peptide, in Human Volunteers"
        year: 1999
        finding: "Single episode of GH release with a terminal half-life of about 2 hours after intravenous infusion in healthy men"
      - doi: "10.1006/bbrc.2000.4065"
        title: "Growth Hormone (GH)-Independent Stimulation of Adiposity by GH Secretagogues"
        year: 2001
        finding: "Increased relative body fat and fat pad weight in GH-deficient and GH-intact mice"
      - doi: "10.1016/j.ghir.2018.05.001"
        title: "Analysis of new growth promoting black market products"
        year: 2018
        finding: "Product-identity finding, not efficacy: glycine-extended ipamorelin (Gly-ipamorelin) identified in black-market growth-promoting products"
    trials_query: "ipamorelin"
  - indication: "Postoperative ileus"
    tier: E3
    human_rcts: 0
    human_trials_any: 2
    summary: >-
      In a randomised, double-blind, placebo-controlled Phase 2 trial in 114
      adults after bowel resection, intravenous ipamorelin did not significantly
      shorten time to tolerating a solid meal and showed no differences on
      secondary endpoints. A second, larger Phase 2 trial (NCT01280344, 320
      enrolled, completed 2014) has no results posted on the registry and no
      publication was identified. In a rat model of postoperative ileus,
      intravenous ipamorelin shortened time to first bowel movement.
    citations:
      - doi: "10.1007/s00384-014-2030-8"
        title: "Prospective, randomized, controlled, proof-of-concept study of the Ghrelin mimetic ipamorelin for the management of postoperative ileus in bowel resection patients"
        year: 2014
        finding: "No significant difference from placebo in time to first tolerated meal in 114 bowel-resection patients"
      - doi: "10.1124/jpet.108.149211"
        title: "Efficacy of Ipamorelin, a Novel Ghrelin Mimetic, in a Rodent Model of Postoperative Ileus"
        year: 2009
        finding: "Shortened time to first bowel movement after laparotomy and intestinal manipulation in rats"
    trials_query: "ipamorelin"
  - indication: "Bone growth and bone mineral content"
    tier: E6
    human_rcts: 0
    human_trials_any: 0
    summary: >-
      Rat studies only. Ipamorelin increased longitudinal bone growth in young
      rats and bone mineral content in adult female rats; in the adult rats the
      gain reflected larger bones, with volumetric bone density unchanged. No
      human bone study exists.
    citations:
      - doi: "10.1054/ghir.1999.9998"
        title: "Ipamorelin, a new growth-hormone-releasing peptide, induces longitudinal bone growth in rats"
        year: 1999
        finding: "Increased longitudinal bone growth in rats"
      - doi: "10.1677/joe.0.1650569"
        title: "The GH secretagogues ipamorelin and GH-releasing peptide-6 increase bone mineral content in adult female rats"
        year: 2000
        finding: "Increased bone mineral content via larger bone dimensions, without change in volumetric density, in adult female rats"
    trials_query: "ipamorelin"
safety:
  grade: S3
  no_data_statement: true
  known_signals:
    - signal: "Serious adverse events including death in an intravenous gastric-motility trial"
      evidence: "FDA's compounding safety-risk summary states that a published study identified serious adverse events including death when ipamorelin was given intravenously for gastric motility. The published postoperative ileus trial reported treatment-emergent adverse events in 87.5% on ipamorelin versus 94.8% on placebo, in a post-surgical population; causality for individual events is not established in either source."
      citation: {url: "https://www.fda.gov/drugs/human-drug-compounding/certain-bulk-drug-substances-use-compounding-may-present-significant-safety-risks", title: "Certain Bulk Drug Substances for Use in Compounding that May Present Significant Safety Risks"}
    - signal: "Immunogenicity and impurity concerns"
      evidence: "FDA states compounded ipamorelin acetate may pose a risk of immunogenicity for certain routes because of aggregation or peptide-related impurities, and that its unnatural amino acids complicate characterisation."
      citation: {url: "https://www.fda.gov/drugs/human-drug-compounding/certain-bulk-drug-substances-use-compounding-may-present-significant-safety-risks", title: "Certain Bulk Drug Substances for Use in Compounding that May Present Significant Safety Risks"}
regulatory:
  - jurisdiction: US
    status: unapproved
    detail: "Not approved: no application found in Drugs@FDA (openFDA query, retrieval date). Ipamorelin acetate was placed in Category 2 (significant safety risks) of FDA's 503B interim policy on 29 September 2023 and remains listed there. For 503A it appears on FDA's list of substances previously in Category 2 whose nominations were withdrawn by the nominators; FDA's safety statement remains on the page. FDA states it has no safety information for other injectable routes and lacks sufficient information to know whether it would cause harm."
    source_url: "https://www.fda.gov/drugs/human-drug-compounding/certain-bulk-drug-substances-use-compounding-may-present-significant-safety-risks"
    source_title: "Certain Bulk Drug Substances for Use in Compounding that May Present Significant Safety Risks (content current as of 04/22/2026)"
    quote: "Compounded drugs containing Ipamorelin acetate may pose risk for immunogenicity for certain routes of administration due to the potential for aggregation or peptide-related impurities."
    retrieved: "2026-10-10"
  - jurisdiction: US
    status: unapproved
    detail: "Ipamorelin does not appear in Category 1, 2 or 3 of FDA's list of bulk drug substances nominated for 503A compounding (updated 14 May 2026). It is not on the 503A bulks list and is not a component of any FDA-approved drug product."
    source_url: "https://www.fda.gov/media/94155/download"
    source_title: "Bulk Drug Substances Nominated for Use in Compounding Under Section 503A of the Federal Food, Drug, and Cosmetic Act (Updated May 14, 2026)"
    quote: "Category 1: Bulk Drug Substances Under Evaluation"
    retrieved: "2026-10-10"
  - jurisdiction: EU
    status: unapproved
    detail: "No product containing ipamorelin appears in EMA's downloadable medicines dataset (2,748 records, generated 10 Oct 2026), which covers centrally authorised medicines, refusals and withdrawn applications. National authorisations were not checked individually."
    source_url: "https://www.ema.europa.eu/en/medicines/download-medicine-data"
    source_title: "Download medicine data | European Medicines Agency (EMA)"
    quote: "This includes information on marketing authorisations of centrally authorised medicines and post-authorisation procedures."
    retrieved: "2026-10-10"
