slug: semaglutide
names:
  inn: "semaglutide"
  common: ["Semaglutide"]
  codes: ["NN9535"]
  brands: ["Ozempic", "Wegovy", "Rybelsus", "Kayshild"]
  cas: "910463-68-2"          # PubChem synonym record
sequence: null
sequence_note: "Acylated analogue of human GLP-1 containing a non-coded amino acid (Aib) and a fatty diacid side chain attached via a linker; not representable as a plain one-letter sequence."
class_by_jurisdiction: {US: A, EU: A, UK: A, CA: A, AU: A, JP: A, CN: null}   # CN: NMPA site refused automated retrieval (HTTP 412); not verified
what_it_is: >-
  A modified version of the gut hormone GLP-1, engineered to persist far longer
  in the body than the native hormone. It is an approved prescription medicine
  for type 2 diabetes (Ozempic, and Rybelsus as a tablet) and for chronic weight
  management (Wegovy), with later approvals in some jurisdictions for
  cardiovascular risk reduction (UK) and MASH (EU, as Kayshild). Falsified and
  unlicensed products have been reported by the UK MHRA. Status in China was not
  verified for this record.
evidence:
  - indication: "Type 2 diabetes: glycaemic control and cardiovascular outcomes"
    tier: E1
    human_rcts: null
    human_trials_any: null
    summary: >-
      Supported by a large phase 3 programme. In SUSTAIN-6 (3,297 people with type
      2 diabetes at high cardiovascular risk), major adverse cardiovascular events
      occurred in 6.6% on semaglutide versus 8.9% on placebo (hazard ratio 0.74).
      In FLOW (3,533 people with type 2 diabetes and chronic kidney disease), the
      composite kidney and cardiovascular outcome was 24% lower with semaglutide
      (hazard ratio 0.76); the trial stopped early for efficacy.
    citations:
      - doi: "10.1056/NEJMoa1607141"
        title: "Semaglutide and Cardiovascular Outcomes in Patients with Type 2 Diabetes"
        year: 2016
        finding: "Primary cardiovascular outcome in 6.6% vs 8.9% with placebo (HR 0.74) in people with type 2 diabetes"
      - doi: "10.1056/NEJMoa2403347"
        title: "Effects of Semaglutide on Chronic Kidney Disease in Patients with Type 2 Diabetes"
        year: 2024
        finding: "Composite kidney/cardiovascular outcome reduced (HR 0.76) in type 2 diabetes with chronic kidney disease"
    trials_query: "semaglutide AND type 2 diabetes"
  - indication: "Chronic weight management (obesity or overweight)"
    tier: E1
    human_rcts: null
    human_trials_any: null
    summary: >-
      Multiple large placebo-controlled trials (the STEP programme). In STEP 1
      (1,961 adults without diabetes), mean body-weight change at week 68 was
      -14.9% with semaglutide versus -2.4% with placebo. In SELECT (17,604 adults
      with overweight or obesity and established cardiovascular disease, no
      diabetes), major cardiovascular events occurred in 6.5% versus 8.0% (hazard
      ratio 0.80). Discontinuation for adverse events was about twice as common
      with semaglutide (16.6% vs 8.2%).
    citations:
      - doi: "10.1056/NEJMoa2032183"
        title: "Once-Weekly Semaglutide in Adults with Overweight or Obesity"
        year: 2021
        finding: "Mean weight change -14.9% vs -2.4% with placebo at week 68 in adults with overweight or obesity"
      - doi: "10.1056/NEJMoa2307563"
        title: "Semaglutide and Cardiovascular Outcomes in Obesity without Diabetes"
        year: 2023
        finding: "Major adverse cardiovascular events 6.5% vs 8.0% (HR 0.80) in adults with cardiovascular disease and overweight/obesity"
    trials_query: "semaglutide AND obesity"
  - indication: "Heart failure with preserved ejection fraction and obesity"
    tier: E2
    human_rcts: null
    human_trials_any: null
    summary: >-
      In STEP-HFpEF (529 adults with HFpEF and obesity), the heart-failure symptom
      score (KCCQ-CSS) improved by 16.6 points with semaglutide versus 8.7 with
      placebo, and body weight fell 13.3% versus 2.6%. The trial measured symptoms
      and function; it was not powered for heart-failure hospitalisation or death.
    citations:
      - doi: "10.1056/NEJMoa2306963"
        title: "Semaglutide in Patients with Heart Failure with Preserved Ejection Fraction and Obesity"
        year: 2023
        finding: "KCCQ-CSS change 16.6 vs 8.7 points with placebo in HFpEF with obesity"
    trials_query: "semaglutide AND heart failure"
  - indication: "Metabolic dysfunction-associated steatohepatitis (MASH) with fibrosis"
    tier: E2
    human_rcts: null
    human_trials_any: null
    summary: >-
      In the first part of the phase 3 ESSENCE trial (800 patients with biopsy
      data), resolution of steatohepatitis without worsening fibrosis occurred in
      62.9% with semaglutide versus 34.3% with placebo, and fibrosis improvement
      in 36.8% versus 22.4%. These are histological surrogate endpoints; the
      clinical-outcomes part of ESSENCE is still under way (ClinicalTrials.gov
      status: active, not recruiting).
    citations:
      - doi: "10.1056/NEJMoa2413258"
        title: "Phase 3 Trial of Semaglutide in Metabolic Dysfunction–Associated Steatohepatitis"
        year: 2025
        finding: "MASH resolution 62.9% vs 34.3%; fibrosis improvement 36.8% vs 22.4% with placebo"
    trials_query: "semaglutide AND steatohepatitis"
  - indication: "Knee osteoarthritis pain with obesity"
    tier: E2
    human_rcts: null
    human_trials_any: null
    summary: >-
      One phase 3 trial (STEP 9, 407 participants with obesity and knee
      osteoarthritis): WOMAC pain score fell 41.7 points with semaglutide versus
      27.5 with placebo at week 68, alongside 13.7% versus 3.2% weight loss. The
      trial cannot separate a direct joint effect from the effect of weight loss.
    citations:
      - doi: "10.1056/NEJMoa2403664"
        title: "Once-Weekly Semaglutide in Persons with Obesity and Knee Osteoarthritis"
        year: 2024
        finding: "WOMAC pain change -41.7 vs -27.5 points with placebo at week 68"
    trials_query: "semaglutide AND osteoarthritis"
  - indication: "Alcohol use disorder (off-label, claimed)"
    tier: E3
    human_rcts: null
    human_trials_any: null
    summary: >-
      One small randomised trial (48 participants, 9 weeks) found less alcohol
      consumed in a laboratory self-administration task and fewer drinks per
      drinking day, but no change in drinks per calendar day or number of drinking
      days. No adequately powered trial has reported.
    citations:
      - doi: "10.1001/jamapsychiatry.2024.4789"
        title: "Once-Weekly Semaglutide in Adults With Alcohol Use Disorder"
        year: 2025
        finding: "Reduced laboratory alcohol self-administration and drinks per drinking day; no change in drinking days (n=48)"
    trials_query: "semaglutide AND alcohol"
  - indication: "Early Alzheimer's disease (oral semaglutide)"
    tier: E1
    human_rcts: null
    human_trials_any: null
    summary: >-
      Two adequately powered phase 3 trials (evoke and evoke+, 3,808 participants
      in total) found no slowing of clinical progression: change in CDR-SB at week
      104 did not differ from placebo in either trial. The tier reflects the
      strength of the evidence, which consistently shows no benefit.
    citations:
      - doi: "10.1016/s0140-6736(26)00514-3"
        title: "Semaglutide for Alzheimer's disease after evoke and evoke+"
        year: 2026
        finding: "Commentary on evoke/evoke+, in which semaglutide did not slow CDR-SB progression versus placebo in early Alzheimer's disease"
    trials_query: "semaglutide AND Alzheimer"
safety:
  grade: S1
  no_data_statement: false
  known_signals:
    - signal: "Gastrointestinal adverse events, including pancreatitis, bowel obstruction and gastroparesis"
      evidence: >-
        Nausea, vomiting and diarrhoea are the most common adverse events in all
        trials. A US claims-database cohort found higher risk of pancreatitis,
        bowel obstruction and gastroparesis (not biliary disease) with GLP-1
        receptor agonists used for weight loss than with bupropion-naltrexone;
        confidence intervals were wide. The UK MHRA strengthened
        pancreatitis warnings for the class in January 2026.
      citation: {doi: "10.1001/jama.2023.19574", title: "Risk of Gastrointestinal Adverse Events Associated With Glucagon-Like Peptide-1 Receptor Agonists for Weight Loss"}
    - signal: "Gallbladder and biliary disease"
      evidence: "Meta-analysis of 76 randomised trials (103,371 patients): GLP-1 receptor agonist use associated with increased risk of gallbladder or biliary disease (RR 1.37), higher in weight-loss trials (RR 2.29) and at higher doses."
      citation: {doi: "10.1001/jamainternmed.2022.0338", title: "Association of Glucagon-Like Peptide-1 Receptor Agonist Use With Risk of Gallbladder and Biliary Diseases"}
    - signal: "Non-arteritic anterior ischaemic optic neuropathy (NAION)"
      evidence: "Retrospective matched cohort of neuro-ophthalmology patients at one academic institution reported higher NAION risk with semaglutide (HR 4.28 in type 2 diabetes). The MHRA issued a Drug Safety Update on NAION risk for Wegovy, Ozempic and Rybelsus (February 2026)."
      citation: {doi: "10.1001/jamaophthalmol.2024.2296", title: "Risk of Nonarteritic Anterior Ischemic Optic Neuropathy in Patients Prescribed Semaglutide"}
    - signal: "Diabetic retinopathy complications in type 2 diabetes"
      evidence: "In SUSTAIN-6, retinopathy complications (vitreous haemorrhage, blindness, or conditions requiring treatment) were more frequent with semaglutide than placebo."
      citation: {doi: "10.1056/NEJMoa1607141", title: "Semaglutide and Cardiovascular Outcomes in Patients with Type 2 Diabetes"}
    - signal: "Thyroid C-cell tumours in rodents"
      evidence: "GLP-1 receptor agonists activate thyroid C-cells and cause C-cell proliferation in rodents; relevance to humans is not established."
      citation: {doi: "10.1210/en.2009-1272", title: "Glucagon-Like Peptide-1 Receptor Agonists Activate Rodent Thyroid C-Cells Causing Calcitonin Release and C-Cell Proliferation"}
