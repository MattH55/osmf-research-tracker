slug: bpc-157
names:
  inn: null
  common: ["BPC-157", "BPC 157", "Body Protection Compound-157", "Bepecin", "Stable gastric pentadecapeptide BPC 157"]
  codes: ["PL 14736", "PL-10", "PLD-116"]
  brands: []
  cas: "137525-51-0"
sequence: "GEPPPGKPADDAGLV"
sequence_note: "Free base; CAS number as given for BPC-157 (free base) in FDA's July 2026 briefing document. BPC-157 acetate is a distinct salt form. Described by its originators as a fragment of a protein from gastric juice."
class_by_jurisdiction: {US: C, EU: null, UK: null, CA: null, AU: null, JP: null, CN: null}
what_it_is: >-
  A synthetic 15-amino-acid peptide first described by a research group in Zagreb
  in 1993. It is sold widely on the gray market and through some clinics with
  claims of tendon, ligament, muscle and gut "healing". FDA's July 2026 briefing
  document states that no product containing it is approved in any country. Almost
  all published efficacy data are from rodent studies, most from a single research
  group; human data are limited to small uncontrolled reports and one trial
  reported only as a conference abstract.
evidence:
  - indication: "Tendon, ligament, muscle and joint injury"
    tier: E5
    human_rcts: 0
    human_trials_any: 0
    summary: >-
      The musculoskeletal claims rest on rat studies of cut or detached tendons,
      ligaments and muscles, nearly all from one Zagreb group. The only human report
      is a retrospective chart review with telephone follow-up of 16 clinic patients
      given intra-articular injections for knee pain of mixed causes, some with a
      second peptide; it had no control group and no standardised outcome measure.
      No randomised or prospective controlled human study has been published. FDA's
      2026 briefing document states that it did not identify clinical studies of
      BPC-157 for tendonitis. A placebo-controlled hamstring-strain trial and a
      rotator-cuff pilot trial are registered but have not reported.
    citations:
      - pmid: 34324435
        title: "Intra-Articular Injection of BPC 157 for Multiple Types of Knee Pain."
        year: 2021
        finding: "Retrospective chart review with telephone survey of 16 clinic patients with knee pain; no control group, no validated outcome measures"
      - doi: "10.1016/S0736-0266(03)00110-4"
        title: "Gastric pentadecapeptide BPC 157 accelerates healing of transected rat Achilles tendon and in vitro stimulates tendocytes growth"
        year: 2003
        finding: "Improved biomechanical, functional and histological measures after Achilles tendon transection in rats"
      - doi: "10.1002/jor.21107"
        title: "Pentadecapeptide BPC 157 (PL 14736) improves ligament healing in the rat"
        year: 2010
        finding: "Improved functional, biomechanical and histological measures after medial collateral ligament transection in rats"
    trials_query: "BPC-157"
  - indication: "Ulcerative colitis and inflammatory bowel disease"
    tier: E3
    human_rcts: 1
    human_trials_any: 1
    summary: >-
      An enema formulation (PL 14736) was developed by the Croatian company Pliva for
      inflammatory bowel disease in the early 2000s. FDA's 2026 briefing document
      identified a single randomised, double-blind, placebo-controlled trial in 53
      people with mild-to-moderate ulcerative colitis, reported only as a 2005
      conference abstract; the between-group difference in its disease-activity
      score was not statistically significant. FDA concluded that there is a lack of
      evidence to support effectiveness in ulcerative colitis. Other data are from
      rat models. The developers' review cited here describes the clinical programme
      but reports no trial results.
    citations:
      - doi: "10.1007/s10787-006-1531-7"
        title: "Stable gastric pentadecapeptide BPC 157 in trials for inflammatory bowel disease (PL-10, PLD-116, PL 14736, Pliva, Croatia). Full and distended stomach, and vascular response"
        year: 2006
        finding: "Review by the originating group describing the inflammatory bowel disease clinical programme and rat gastric-lesion experiments; no human efficacy results reported"
      - doi: "10.3748/wjg.v23.i48.8465"
        title: "Stable gastric pentadecapeptide BPC 157 in the treatment of colitis and ischemia and reperfusion in rats: New insights"
        year: 2017
        finding: "Reduced visible mucosal damage and oxidative-stress markers in a rat model of ischaemic colitis"
    trials_query: "BPC-157"
  - indication: "Stomach and gut lining injury (ulcers, NSAID damage, 'leaky gut')"
    tier: E6
    human_rcts: 0
    human_trials_any: 0
    summary: >-
      Many rat experiments report fewer stomach and intestinal lesions when BPC-157 is
      given alongside alcohol, anti-inflammatory drugs or other injuries. No human
      study of gastric ulcers, drug-induced gut injury, intestinal permeability or
      general digestive symptoms has been published.
    citations:
      - doi: "10.3748/wjg.v23.i29.5304"
        title: "Celecoxib-induced gastrointestinal, liver and brain lesions in rats, counteraction by BPC 157 or L-arginine, aggravation by L-NAME"
        year: 2017
        finding: "Fewer gastric, liver and brain lesions after high-dose celecoxib in rats given BPC-157"
    trials_query: "BPC-157"
  - indication: "Interstitial cystitis (bladder pain syndrome)"
    tier: E4
    human_rcts: 0
    human_trials_any: 1
    summary: >-
      One uncontrolled single-clinic pilot study injected compounded BPC-157 into the
      bladder wall of 12 women whose interstitial cystitis had not responded to
      pentosan polysulfate, and reported symptom resolution on a global response
      questionnaire. There was no control group, no blinding and no objective
      outcome measure, so placebo response and natural fluctuation cannot be
      excluded.
    citations:
      - pmid: 39325560
        title: "Effect of BPC-157 on Symptoms in Patients with Interstitial Cystitis: A Pilot Study."
        year: 2024
        finding: "Uncontrolled pilot study in 12 women; self-rated symptom improvement reported, no comparator"
    trials_query: "BPC-157"
safety:
  grade: S4
  no_data_statement: true
  known_signals:
    - signal: "Adverse event reports with injected products (FDA FAERS)"
      evidence: "FDA's 2026 briefing document summarises three FAERS reports, all with injectable BPC-157: injection-site redness and swelling, shortness of breath leading to an emergency visit, and diffuse skin and gum hyperpigmentation that recurred on rechallenge with a 'research purposes only' product that also contained TB-500. FDA states that causality cannot be established from these reports."
      citation: {url: "https://www.fda.gov/media/193343/download", title: "FDA Evaluation of BPC-157-Related Bulk Drug Substances"}
    - signal: "Clotting and liver findings in animal toxicity studies"
      evidence: "FDA reports that 28-day intramuscular toxicity studies in rats and dogs showed altered clotting times (aPTT) and liver-associated changes (raised ALT, glucose and triglycerides); longer studies and carcinogenicity studies were not available."
      citation: {url: "https://www.fda.gov/media/193343/download", title: "FDA Evaluation of BPC-157-Related Bulk Drug Substances"}
regulatory:
  - jurisdiction: US
    status: unapproved
    detail: "No FDA-approved product. BPC-157 was formerly in 503A Category 2 (substances raising significant safety risks); the nominations were withdrawn and it now appears on FDA's list of substances nominated but withdrawn. FDA re-evaluated BPC-157 (free base) and BPC-157 acetate on its own initiative, for ulcerative colitis only, for the Pharmacy Compounding Advisory Committee meeting of 23 July 2026. FDA's briefing document recommended against adding either form to the 503A bulks list. The committee's vote and any final FDA decision were not verified from an FDA source for this record."
    source_url: "https://www.fda.gov/media/193343/download"
    source_title: "July 23-24, 2026, Meeting of the Pharmacy Compounding Advisory Committee – FDA Briefing Document for BPC-157-Related Bulk Drug Substances (BPC-157 (free base) and BPC-157 acetate)"
    quote: "After considering the information currently available, a balancing of the criteria weighs against BPC-157 (free base) and BPC-157 acetate being placed on that list"
    retrieved: "2026-10-10"
  - jurisdiction: US
    status: unapproved
    detail: "FDA's page on bulk drug substances that may present significant safety risks lists BPC-157 under 'Bulk drug substances nominated but withdrawn' (substances previously in Category 2) and gives FDA's stated risks. Page content current as of 22 April 2026."
    source_url: "https://www.fda.gov/drugs/human-drug-compounding/certain-bulk-drug-substances-use-compounding-may-present-significant-safety-risks"
    source_title: "Certain Bulk Drug Substances for Use in Compounding that May Present Significant Safety Risks"
    quote: "Compounded drugs containing BPC-157 may pose risk for immunogenicity for certain routes of administration and may have complexities with regard to peptide-related impurities and active pharmaceutical ingredient (API) characterization."
    retrieved: "2026-10-10"
