  brands: ["Imcivree"]
  cas: null
sequence: null
sequence_note: "Cyclic octapeptide: Ac-Arg-cyclo[Cys-D-Ala-His-D-Phe-Arg-Trp-Cys]-NH2 (disulfide between the two cysteines). Contains D-amino acids, so no plain one-letter sequence is given. Structure as described in the US prescribing information (chemical name: acetyl-L-arginyl-L-cysteinyl-D-alanyl-L-histidinyl-D-phenylalanyl-L-arginyl-L-tryptophanyl-L-cysteinamide cyclic (2-8)-disulfide)."
class_by_jurisdiction: {US: A, EU: A, UK: A, CA: A, AU: C, JP: A, CN: null}
what_it_is: >-
  A synthetic cyclic peptide that activates the melanocortin-4 receptor, a
  brain receptor in the leptin-melanocortin pathway that regulates hunger.
  It is approved, under the brand Imcivree, only for specific rare forms of
  obesity: obesity due to POMC, PCSK1 or LEPR deficiency, Bardet-Biedl syndrome,
  and acquired hypothalamic obesity (approved in the US, EU, UK and Japan). The
  US label states it is not expected to be effective in general (polygenic) obesity.
evidence:
  - indication: "Obesity due to POMC, PCSK1 or LEPR deficiency"
    tier: E4
    human_rcts: 0
    human_trials_any: 3
    summary: >-
      Evidence comes from two single-arm, open-label phase 3 trials (10 and 11
      participants in the published full analysis sets) with a short blinded
      placebo-withdrawal sequence, and an earlier two-patient open-label report.
      Eight of 10 participants with POMC deficiency and 5 of 11 with LEPR deficiency
      reached at least 10% weight loss at about one year. There is no parallel-group
      randomised comparison, which is typical for ultra-rare conditions but limits
      the strength of inference.
    citations:
      - doi: "10.1016/s2213-8587(20)30364-8"
        title: "Efficacy and safety of setmelanotide, an MC4R agonist, in individuals with severe obesity due to LEPR or POMC deficiency: single-arm, open-label, multicentre, phase 3 trials"
        year: 2020
        finding: "Weight loss of at least 10% at about one year in single-arm trials of people with POMC or LEPR deficiency obesity"
      - doi: "10.1056/nejmoa1512693"
        title: "Proopiomelanocortin Deficiency Treated with a Melanocortin-4 Receptor Agonist"
        year: 2016
        finding: "Reduced hunger and substantial weight loss in two patients with POMC deficiency in an open-label study"
    trials_query: "setmelanotide"
  - indication: "Obesity in Bardet-Biedl syndrome (and Alström syndrome)"
    tier: E3
    human_rcts: 1
    human_trials_any: 1
    summary: >-
      One phase 3 trial (38 randomised) had a 14-week double-blind placebo-controlled
      period followed by 52 weeks of open-label treatment. Its primary endpoint was
      single-arm: 32.3% of patients aged 12 or older with Bardet-Biedl syndrome
      reached at least 10% weight reduction after 52 weeks. The randomised period was
      short and small, so the controlled evidence is limited. Alström syndrome was
      included in the trial but is not an approved indication.
    citations:
      - doi: "10.1016/s2213-8587(22)00277-7"
        title: "Efficacy and safety of setmelanotide, a melanocortin-4 receptor agonist, in patients with Bardet-Biedl syndrome and Alström syndrome: a multicentre, randomised, double-blind, placebo-controlled, phase 3 trial with an open-label period"
        year: 2022
        finding: "32.3% of patients aged 12 or older with Bardet-Biedl syndrome reached at least 10% weight reduction after 52 weeks"
    trials_query: "setmelanotide"
  - indication: "Acquired hypothalamic obesity"
    tier: E2
    human_rcts: 1
    human_trials_any: 2
    summary: >-
      An open-label phase 2 trial in 18 patients reported that 16 reached at least
      5% BMI reduction at 16 weeks. A double-blind, placebo-controlled phase 3 trial
      (TRANSCEND, about 140 enrolled) has been presented as a conference abstract
      and its results are posted on ClinicalTrials.gov; a full peer-reviewed
      publication was not found on the retrieval date. By the retrieval date the
      indication was approved in the US (March 2026), Japan (August 2026), the EU
      and the UK.
    citations:
      - doi: "10.1016/s2213-8587(24)00087-1"
        title: "Setmelanotide for the treatment of acquired hypothalamic obesity: a phase 2, open-label, multicentre trial"
        year: 2024
        finding: "16 of 18 patients reached at least 5% BMI reduction after 16 weeks in an open-label trial"
      - doi: "10.1093/ejendo/lvag096.414"
        title: "P255 - ECE_1844 - Efficacy and safety of setmelanotide in acquired hypothalamic obesity: Results from a double-blind, multicentre, placebo-controlled, randomised phase 3 trial"
        year: 2026
        finding: "Conference abstract reporting the randomised placebo-controlled phase 3 trial in acquired hypothalamic obesity"
    trials_query: "setmelanotide"
safety:
  grade: S2
  no_data_statement: true
  known_signals:
    - signal: "Skin hyperpigmentation, darkening of pre-existing naevi and new melanocytic naevi"
      evidence: "Listed in US prescribing information (Warnings and Precautions 5.4); skin hyperpigmentation is among the most common adverse reactions."
      citation: {url: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2026/213793s009lbl.pdf", title: "IMCIVREE (setmelanotide) injection, for subcutaneous use"}
    - signal: "Disturbance in sexual arousal, including spontaneous penile erection"
      evidence: "US prescribing information, Warnings and Precautions 5.1; spontaneous penile erection listed among common adverse reactions."
      citation: {url: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2026/213793s009lbl.pdf", title: "IMCIVREE (setmelanotide) injection, for subcutaneous use"}
    - signal: "Depression and suicidal ideation"
      evidence: "US prescribing information, Warnings and Precautions 5.2."
      citation: {url: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2026/213793s009lbl.pdf", title: "IMCIVREE (setmelanotide) injection, for subcutaneous use"}
    - signal: "Acute adrenal insufficiency and sodium imbalance in patients with acquired hypothalamic obesity"
      evidence: "Added to US prescribing information in March 2026 (Warnings and Precautions 5.5 and 5.6)."
      citation: {url: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2026/213793s009lbl.pdf", title: "IMCIVREE (setmelanotide) injection, for subcutaneous use"}
    - signal: "Gastrointestinal effects (nausea, vomiting, diarrhoea, abdominal pain) and injection-site reactions"
      evidence: "Most common adverse reactions in US prescribing information section 6.1."
      citation: {url: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2026/213793s009lbl.pdf", title: "IMCIVREE (setmelanotide) injection, for subcutaneous use"}
