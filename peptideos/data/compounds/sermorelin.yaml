what_it_is: >-
  A synthetic copy of the first 29 amino acids of human growth
  hormone-releasing hormone (GHRH). In the US it was approved as Geref, for
  testing pituitary growth hormone release (1990) and for idiopathic growth
  hormone deficiency in children (1997). The manufacturer discontinued Geref in
  2008 and FDA withdrew both approvals in 2009; FDA later determined the
  withdrawal was not for safety or effectiveness reasons. No sermorelin product
  is currently approved in the US. It is offered by compounders and
  "anti-ageing" clinics for adult uses never tested in an approval trial.
evidence:
  - indication: "Idiopathic growth hormone deficiency in children (former US-approved use)"
    tier: E4
    human_rcts: null
    human_trials_any: null
    summary: >-
      The principal published efficacy study was an open-label, uncontrolled
      multicentre study in 110 previously untreated prepubertal children with
      GH deficiency; mean height velocity rose over 12 months, and 74% were
      classed as good responders at 6 months. No randomised controlled trial
      against placebo or growth hormone was identified in this review. The
      product has not been marketed in the US since 2008.
    citations:
      - doi: "10.1210/jcem.81.3.8772599"
        title: "Once daily subcutaneous growth hormone-releasing hormone therapy accelerates growth in growth hormone-deficient children during the first year of therapy. Geref International Study Group."
        year: 1996
        finding: "Mean height velocity increased over 12 months in an open-label study of 110 prepubertal GH-deficient children"
    trials_query: "sermorelin"
  - indication: "Age-related decline in growth hormone, body composition and strength in older adults (anti-ageing claims)"
    tier: E4
    human_rcts: 0
    human_trials_any: 2
    summary: >-
      Evidence is limited to very small, short studies in healthy older men,
      without a placebo group. In 10 older men, two weeks of GHRH(1-29) raised
      GH and IGF-1 to levels seen in young men (dose order randomised, no
      placebo). In 11 older men over six weeks, GH rose but IGF-1, body weight,
      muscle and fat by DEXA did not change; two of six strength measures
      improved. No trial has tested body composition, function, frailty or any
      clinical outcome against placebo. Trials of tesamorelin, a different GHRH
      analogue, are not evidence for sermorelin.
    citations:
      - doi: "10.1210/jcem.75.2.1379256"
        title: "Growth hormone (GH)-releasing hormone-(1-29) twice daily reverses the decreased GH and insulin-like growth factor-I levels in old men."
        year: 1992
        finding: "Raised 24-hour GH and IGF-1 over 14 days in 10 healthy older men"
      - doi: "10.1016/s0026-0495(97)90174-8"
        title: "Effects of single nightly injections of growth hormone—releasing hormone (GHRH 1–29) in healthy elderly men"
        year: 1997
        finding: "Raised nocturnal GH without change in IGF-1, lean or fat mass over 6 weeks in 11 older men; 2 of 6 strength measures improved"
    trials_query: "sermorelin"
