regulatory:
  - jurisdiction: US
    status: withdrawn
    detail: "Geref (sermorelin acetate; NDA 19-863 diagnostic, approved 28 Dec 1990; NDA 20-443 for idiopathic GH deficiency in children, approved 26 Sept 1997; EMD Serono) was discontinued by the sponsor in 2008, and FDA withdrew approval of both NDAs effective 18 June 2009 at the sponsor's request. In 2013 FDA determined the products were not withdrawn for reasons of safety or effectiveness. Drugs@FDA lists both as Discontinued. Sermorelin does not appear in any category of FDA's 503A nominated bulk-substance list (updated 14 May 2026); this record does not determine whether compounding with it is lawful under another 503A pathway."
    source_url: "https://www.govinfo.gov/content/pkg/FR-2013-03-04/html/2013-04827.htm"
    source_title: "Determination That GEREF (Sermorelin Acetate) Injection ... Were Not Withdrawn From Sale for Reasons of Safety or Effectiveness (Federal Register, 4 March 2013)"
    quote: "In the Federal Register of May 19, 2009 (74 FR 23407), FDA announced that it was withdrawing approval of NDA 19-863 and NDA 20-443, effective June 18, 2009."
