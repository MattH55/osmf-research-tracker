slug: melanotan-ii
names:
  inn: null
  common: ["Melanotan II", "Melanotan-II", "MT-II", "Melanotan 2"]
  codes: ["MT-II"]
  brands: []
  cas: null
sequence: null
sequence_note: "Lactam-bridged cyclic heptapeptide analogue of alpha-MSH(4-10): Ac-Nle-cyclo[Asp-His-D-Phe-Arg-Trp-Lys]-NH2, as described by Dorr et al. 1996. Contains norleucine and a D-amino acid. It differs from bremelanotide only at the C-terminus (amide rather than free acid)."
class_by_jurisdiction: {US: C, EU: C, UK: C, CA: C, AU: C, JP: null, CN: null}
what_it_is: >-
  A synthetic cyclic peptide related to alpha-melanocyte-stimulating hormone that
  activates several melanocortin receptors. It was studied in small academic
  trials in the 1990s for tanning and erectile function, then not developed as a
  medicine. It is not approved anywhere checked and is sold online as an
  unlicensed injectable "tanning" product. Its documented human record is
  dominated by case reports of harm: changing and new moles, melanoma, priapism,
  rhabdomyolysis and kidney injury.
evidence:
  - indication: "Skin tanning (the main gray-market claim)"
    tier: E4
    human_rcts: 0
    human_trials_any: 1
    summary: >-
      The only published efficacy data are a pilot phase 1 study in three healthy
      men (single-blind, alternating days of injection and saline) in which two
      subjects showed increased facial and body pigmentation. No randomised trial
      of tanning has been published. No study has tested whether induced tanning
      reduces sunburn or skin cancer, and case reports describe new and changing
      moles in users.
    citations:
      - doi: "10.1016/0024-3205(96)00160-9"
        title: "Evaluation of Melanotan-II, a superpotent cyclic melanotropic peptide in a pilot phase-I clinical study"
        year: 1996
        finding: "Increased skin pigmentation in two of three healthy men; nausea, yawning-stretching and spontaneous erections reported"
    trials_query: "melanotan"
  - indication: "Erectile dysfunction and sexual desire in men"
    tier: E3
    human_rcts: 2
    human_trials_any: 3
    summary: >-
      Small double-blind, placebo-controlled crossover studies from a single US
      research group in the late 1990s reported erections after injection more
      often than after placebo, in men with psychogenic and with organic erectile
      dysfunction, and higher self-rated sexual desire. In the organic study, 12 of
      19 injections initiated erections versus 1 of 21 placebo doses, and 4 of 19
      injections caused severe nausea. No larger trial has been published.
    citations:
      - doi: "10.1016/s0090-4295(00)00680-4"
        title: "Effect of an alpha-melanocyte stimulating hormone analog on penile erection and sexual desire in men with organic erectile dysfunction"
        year: 2000
        finding: "More erections and higher sexual desire than placebo in a small crossover study; severe nausea after 4 of 19 injections"
    trials_query: "melanotan"
  - indication: "Appetite suppression / weight loss (gray-market claim)"
    tier: E6
    human_rcts: 0
    human_trials_any: 0
    summary: >-
      Reduced food intake has been shown only in rodents, for example after
      injection into the brain ventricles of mice. No human study has measured
      appetite, food intake or body weight as an outcome.
    citations:
      - doi: "10.1038/385165a0"
        title: "Role of melanocortinergic neurons in feeding and the agouti obesity syndrome"
        year: 1997
        finding: "Intracerebroventricular MTII inhibited feeding in four mouse models of hyperphagia"
    trials_query: "melanotan"
safety:
  grade: S4
  no_data_statement: true
  known_signals:
    - signal: "Eruptive and changing melanocytic naevi (moles)"
      evidence: "Case reports of new and changing naevi after unlicensed injection; a review highlights melanocytic changes in existing moles and newly emerging (dysplastic) naevi."
      citation: {doi: "10.1111/j.1365-2133.2009.09362.x", title: "Eruptive melanocytic naevi following melanotan injection"}
    - signal: "Melanoma"
      evidence: "Case reports of melanoma and melanoma in situ arising during or shortly after use; a review counted four reported melanomas. Causation is not established, and users often also use sunbeds."
      citation: {doi: "10.1159/000356389", title: "Melanoma Associated with the Use of Melanotan-II"}
    - signal: "Melanoma in situ"
      evidence: "Australian case report of melanotan-associated melanoma in situ."
      citation: {doi: "10.1111/j.1440-0960.2012.00915.x", title: "Melanotan-associated melanoma in situ"}
    - signal: "Ischaemic priapism"
      evidence: "Case report of acute ischaemic priapism requiring surgical decompression after injection; the authors note earlier reports."
      citation: {doi: "10.1016/j.esxm.2020.100298", title: "Melanotan Tanning Injection: A Rare Cause of Priapism"}
    - signal: "Systemic sympathomimetic toxicity and rhabdomyolysis with kidney injury"
      evidence: "Case report after injection of an internet-purchased product."
      citation: {doi: "10.3109/15563650.2012.740637", title: "Melanotan II injection resulting in systemic toxicity and rhabdomyolysis"}
    - signal: "Renal infarction"
      evidence: "Case report and literature review attributing renal infarction most likely to melanotan II."
      citation: {doi: "10.1007/s13730-020-00447-z", title: "Melanotan II: a possible cause of renal infarction: review of the literature and case report"}
    - signal: "Overall risk profile of unregulated use"
      evidence: "Review of unregulated alpha-MSH analogue use summarising cutaneous complications and uncertainties about preparation and contents."
      citation: {doi: "10.1111/ijd.13585", title: "Risks of unregulated use of alpha‐melanocyte‐stimulating hormone analogues: a review"}
