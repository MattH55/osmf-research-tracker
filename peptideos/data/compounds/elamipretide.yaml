slug: elamipretide
names:
  inn: "elamipretide"
  common: ["Elamipretide", "SS-31", "MTP-131", "Bendavia"]
  codes: ["SS-31", "MTP-131"]
  brands: ["Forzinity"]
  cas: null
sequence: null
sequence_note: "Synthetic tetrapeptide D-Arg-2,6-dimethyl-Tyr-Lys-Phe-NH2 (FDA label: D-arginyl-2,6-dimethyl-L-tyrosyl-L-lysyl-L-phenylalaninamide); contains a D-amino acid and a non-standard dimethyltyrosine, so no one-letter sequence is given."
class_by_jurisdiction: {US: A, EU: null, UK: null, CA: null, AU: null, JP: null, CN: null}
what_it_is: >-
  A synthetic four-residue peptide that binds cardiolipin, a lipid of the inner
  mitochondrial membrane. The US FDA granted it accelerated approval in September
  2025 (brand Forzinity) for muscle strength in Barth syndrome, a rare inherited
  mitochondrial disease, on the basis of an intermediate endpoint, with a
  confirmatory trial required. It has also been tested in primary mitochondrial
  myopathy, dry macular degeneration and heart failure. Under the research name
  SS-31 it is also sold outside medical channels with anti-ageing and
  mitochondrial-health claims.
evidence:
  - indication: "Barth syndrome (muscle strength, exercise capacity, fatigue)"
    tier: E3
    human_rcts: 1
    human_trials_any: 1
    summary: >-
      The only controlled evidence is TAZPOWER, a randomised, double-blind,
      placebo-controlled crossover trial in 12 males with Barth syndrome. In the
      randomised part neither primary endpoint (six-minute walk distance and a
      Barth symptom score) was met. In the open-label extension, without a
      concurrent control group, walk distance, symptom scores and knee extensor
      strength improved from baseline. FDA's accelerated approval rests on knee
      extensor strength, an intermediate endpoint, and FDA requires a randomised
      placebo-controlled confirmatory trial (registered as 4TAZPower).
    citations:
      - doi: "10.1038/s41436-020-01006-8"
        title: "A phase 2/3 randomized clinical trial followed by an open-label extension to evaluate the effectiveness of elamipretide in Barth syndrome, a genetic disorder of mitochondrial cardiolipin metabolism"
        year: 2021
        finding: "Neither primary endpoint was met in the randomised crossover phase in 12 patients; improvements from baseline were reported in the uncontrolled open-label extension"
    trials_query: "elamipretide Barth"
  - indication: "Primary mitochondrial myopathy"
    tier: E3
    human_rcts: 3
    human_trials_any: null
    summary: >-
      Two small randomised trials (MMPOWER, 36 participants, five days of
      intravenous dosing; MMPOWER-2, 30 participants, four-week crossover) did not
      meet their primary walk-test endpoint at conventional significance, though
      some secondary and patient-reported measures favoured elamipretide. The
      larger phase 3 trial (MMPOWER-3, 218 participants, 24 weeks) did not meet
      either primary endpoint; the between-group difference in walk distance was
      close to zero. The randomised evidence is therefore conflicting at best,
      and the largest trial was negative.
    citations:
      - pmid: 37268435
        title: "Efficacy and Safety of Elamipretide in Individuals With Primary Mitochondrial Myopathy: The MMPOWER-3 Randomized Clinical Trial"
        year: 2023
        finding: "No difference from placebo in six-minute walk distance or fatigue score at 24 weeks in 218 participants with primary mitochondrial myopathy"
      - doi: "10.1002/jcsm.12559"
        title: "A randomized crossover trial of elamipretide in adults with primary mitochondrial myopathy"
        year: 2020
        finding: "Primary walk-test endpoint not statistically significant over four weeks in 30 participants; patient-reported fatigue scores favoured elamipretide"
      - doi: "10.1212/WNL.0000000000005255"
        title: "Randomized dose-escalation trial of elamipretide in adults with primary mitochondrial myopathy"
        year: 2018
        finding: "Highest intravenous dose group walked farther than placebo after five days in 36 participants (unadjusted comparison not significant)"
    trials_query: "elamipretide mitochondrial myopathy"
  - indication: "Dry age-related macular degeneration with geographic atrophy"
    tier: E3
    human_rcts: 1
    human_trials_any: null
    summary: >-
      ReCLAIM-2, a randomised, double-masked, placebo-controlled phase 2 trial in
      176 patients treated for 48 weeks, did not meet either primary endpoint
      (low-luminance visual acuity and growth of the atrophic area). Differences
      favouring elamipretide were reported on ellipsoid-zone imaging measures
      with nominal p-values. A phase 3 trial (ReNEW) is registered; no results
      were identified.
    citations:
      - doi: "10.1016/j.xops.2024.100628"
        title: "ReCLAIM-2: A Randomized Phase II Clinical Trial Evaluating Elamipretide in Age-related Macular Degeneration, Geographic Atrophy Growth, Visual Function, and Ellipsoid Zone Preservation"
        year: 2024
        finding: "Primary visual-acuity and atrophy-growth endpoints not met in 176 patients; nominal differences on retinal imaging measures"
    trials_query: "elamipretide macular degeneration"
  - indication: "Age-related decline in muscle function and exercise capacity (anti-ageing claims)"
    tier: E3
    human_rcts: 1
    human_trials_any: 1
    summary: >-
      This is the main gray-market claim for SS-31. In aged female mice, eight
      weeks of treatment increased in-vivo mitochondrial ATP production and
      treadmill endurance. The one human randomised trial identified gave a single
      intravenous infusion to 39 healthy adults aged 60 to 85: a measure of
      maximal mitochondrial ATP production in a hand muscle rose briefly after
      infusion, was not different at day 7, and fatigue resistance did not
      change. No human trial has tested longer-term use for ageing, frailty or
      exercise performance.
    citations:
      - doi: "10.1371/journal.pone.0253849"
        title: "In vivo mitochondrial ATP production is improved in older adult skeletal muscle after a single dose of elamipretide in a randomized trial"
        year: 2021
        finding: "Single infusion transiently raised a spectroscopic measure of mitochondrial capacity in older adults; no effect on muscle fatigue resistance"
      - doi: "10.1016/j.freeradbiomed.2018.12.031"
        title: "Improving mitochondrial function with SS-31 reverses age-related redox stress and improves exercise tolerance in aged mice"
        year: 2019
        finding: "Eight weeks of SS-31 increased treadmill endurance and muscle mitochondrial ATP production in aged female mice"
    trials_query: "elamipretide"
safety:
  grade: S2
  no_data_statement: false
  known_signals:
    - signal: "Injection site reactions"
      evidence: "Injection site reactions were the most common adverse event in controlled trials; in the MMPOWER-2 crossover trial they were reported in 80% of participants during elamipretide treatment, mostly mild."
      citation: {doi: "10.1002/jcsm.12559", title: "A randomized crossover trial of elamipretide in adults with primary mitochondrial myopathy"}
    - signal: "Hypersensitivity reactions"
      evidence: "The US label warns that hypersensitivity reactions, including serious allergic reactions requiring emergency medical intervention, have been reported, and lists serious hypersensitivity as a contraindication."
      citation: {url: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/215244s000lbl.pdf", title: "FORZINITY (elamipretide) injection, for subcutaneous use"}
    - signal: "Eosinophilia"
      evidence: "The US label reports frequent increases in blood eosinophil counts in studies lasting 30 days or more, peaking around 90 days; these were not associated with clinical manifestations."
      citation: {url: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/215244s000lbl.pdf", title: "FORZINITY (elamipretide) injection, for subcutaneous use"}
