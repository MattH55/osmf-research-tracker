what_it_is: >-
  A synthetic peptide fragment from the end of human growth hormone, developed by
  the Australian company Metabolic Pharmaceuticals as an oral anti-obesity drug.
  Six placebo-controlled trials were run in the early 2000s; development stopped in
  2007 after a large 24-week trial reportedly found no significant weight loss
  versus placebo. It is not an approved medicine, and is sold on the gray market
  with fat-loss and joint claims.
evidence:
  - indication: "Weight loss and fat reduction in obesity"
    tier: E3
    human_rcts: null
    human_trials_any: null
    summary: >-
      The developer ran six randomised, double-blind, placebo-controlled trials in
      about 900 adults, mostly with obesity, by mouth or single intravenous doses.
      Their efficacy results were never published as primary peer-reviewed reports;
      the published summary covers safety only. A review states that a 12-week trial
      showed modestly greater weight loss than placebo, but that development ended
      after a 24-week trial in 536 people failed to show significant weight loss.
      The evidence is therefore conflicting and incompletely reported. No trial of
      injected AOD-9604 for weight loss was identified. Rodent studies reported
      reduced weight gain and increased fat breakdown.
    citations:
      - doi: "10.4021/jem157w"
        title: "Safety and Tolerability of the Hexadecapeptide AOD9604 in Humans"
        year: 2013
        finding: "Sponsor-funded safety summary of six randomised placebo-controlled trials; reports safety outcomes, not weight-loss results"
      - doi: "10.2174/157340313805076322"
        title: "Obesity pharmacotherapy: current perspectives and future directions"
        year: 2013
        finding: "Review reporting that development stopped in 2007 after a 24-week trial in 536 participants did not show significant weight loss"
      - doi: "10.1038/sj.ijo.0801740"
        title: "Increase of fat oxidation and weight loss in obese mice caused by chronic treatment with human growth hormone or a modified C-terminal fragment"
        year: 2001
        finding: "Reduced body weight gain and increased fat oxidation in obese mice, without the blood-glucose effects of full growth hormone"
    trials_query: "AOD9604"
  - indication: "Joint cartilage and osteoarthritis"
    tier: E6
    human_rcts: 0
    human_trials_any: 0
    summary: >-
      Joint claims rest on a rabbit osteoarthritis model in which AOD-9604 was
      injected into the knee with or without hyaluronic acid. No human study of
      osteoarthritis, cartilage or joint injury has been published.
    citations:
      - pmid: 26275694
        title: "Effect of Intra-articular Injection of AOD9604 with or without Hyaluronic Acid in Rabbit Osteoarthritis Model."
        year: 2015
        finding: "Intra-articular injection studied in a rabbit model of osteoarthritis"
    trials_query: "AOD9604"
safety:
  grade: S2
  no_data_statement: false
  known_signals:
    - signal: "Serious adverse events of unclear causality (FDA)"
      evidence: "FDA states that it has identified serious adverse events that may be associated with AOD-9604, though causality is not clear, and that it has no, or only limited, safety information. The sponsor-funded trial summary reports no AOD-9604-related withdrawals or serious adverse events and more gastrointestinal events at the highest oral dose."
      citation: {url: "https://www.fda.gov/drugs/human-drug-compounding/certain-bulk-drug-substances-use-compounding-may-present-significant-safety-risks", title: "Certain Bulk Drug Substances for Use in Compounding that May Present Significant Safety Risks"}
regulatory:
  - jurisdiction: US
    status: unapproved
    detail: "No FDA-approved product. AOD-9604 was formerly in 503A Category 2 and now appears on FDA's list of substances nominated but withdrawn, with FDA's stated risks. Page content current as of 22 April 2026. It does not appear in any category of FDA's 503A nominations list updated 14 May 2026."
    source_url: "https://www.fda.gov/drugs/human-drug-compounding/certain-bulk-drug-substances-use-compounding-may-present-significant-safety-risks"
    source_title: "Certain Bulk Drug Substances for Use in Compounding that May Present Significant Safety Risks"
    quote: "Compounded drugs containing AOD-9604 may pose significant risk for immunogenicity for certain routes of administration and may have complexities with regard to peptide-related impurities and API characterization."
    retrieved: "2026-10-10"
sport:
  wada_status: prohibited
  wada_class: "S2.2.3"
  detail: "Named as a growth hormone fragment in class S2.2.3, prohibited at all times, on the 2026 Prohibited List."
  source_url: "https://www.wada-ama.org/sites/default/files/2025-09/2026list_en_final_clean_september_2025.pdf"
  quote: "Growth hormone (GH), its analogues and fragments including, but not limited to: growth hormone analogues, e.g. lonapegsomatropin, somapacitan and somatrogon growth hormone fragments, e.g. AOD-9604 and hGH 176-191"
unknowns:
  - "Full weight-loss results of the six developer trials, including the failed 24-week trial, have never been published in a peer-reviewed journal"
  - "The human trials used oral or single intravenous doses; no published human data cover repeated subcutaneous injection"
  - "No trial lasted longer than 24 weeks, so long-term human safety is unknown"
  - "FDA's reported serious adverse events have not been described publicly in enough detail to judge causality"
  - "Identity and purity of gray-market products are unverified; a 2014 Belgian analysis of seized products was a case report only"
  - "Regulatory status outside the US was not verified from regulator sources for this record"
mechanism: >-
  AOD-9604 does not bind the growth hormone receptor in cell assays. In obese mice
  it increased fat oxidation and markers of fat breakdown without the
  blood-glucose effects of full growth hormone; its molecular target is not
  established.
reviewer: "OSMF research team (AI-assisted, source-verified)"
last_reviewed: "2026-10-10"
