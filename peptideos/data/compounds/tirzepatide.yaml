sequence: null
sequence_note: "Synthetic peptide containing non-coded amino acids and a fatty diacid side chain; not representable as a plain one-letter sequence."
class_by_jurisdiction: {US: A, EU: A, UK: A, CA: A, AU: A, JP: A, CN: null}   # CN: NMPA site refused automated retrieval (HTTP 412); not verified
what_it_is: >-
  A synthetic peptide that activates the receptors for two gut hormones, GIP and
  GLP-1. It is an approved prescription medicine for type 2 diabetes (Mounjaro)
  and for chronic weight management (Zepbound in the US and Japan; Mounjaro
  carries the weight indication in the UK). The UK MHRA has reported falsified
  Mounjaro pens in circulation. Status in China was not verified for this
  record.
evidence:
  - indication: "Type 2 diabetes: glycaemic control and cardiovascular outcomes"
    tier: E1
    human_rcts: null
    human_trials_any: null
    summary: >-
      Supported by the phase 3 SURPASS programme. In SURPASS-2 (1,879
      participants on metformin), all tirzepatide doses lowered HbA1c more than
      semaglutide (differences -0.15 to -0.45 percentage points). In SURPASS-CVOT
      (13,299 participants with atherosclerotic cardiovascular disease),
      tirzepatide was non-inferior to dulaglutide for major cardiovascular events
      (12.2% vs 13.1%, hazard ratio 0.92); superiority was not shown.
    citations:
      - doi: "10.1056/NEJMoa2107519"
        title: "Tirzepatide versus Semaglutide Once Weekly in Patients with Type 2 Diabetes"
        year: 2021
        finding: "HbA1c reduction superior to semaglutide at all three tirzepatide doses in type 2 diabetes on metformin"
      - doi: "10.1056/nejmoa2505928"
        title: "Cardiovascular Outcomes with Tirzepatide versus Dulaglutide in Type 2 Diabetes"
        year: 2025
        finding: "Major cardiovascular events 12.2% vs 13.1% with dulaglutide (HR 0.92; non-inferior, not superior)"
    trials_query: "tirzepatide AND type 2 diabetes"
  - indication: "Chronic weight management (obesity or overweight)"
    tier: E1
    human_rcts: null
    human_trials_any: null
    summary: >-
      Multiple large randomised trials (SURMOUNT programme). In SURMOUNT-1 (2,539
      adults without diabetes), mean weight change at week 72 ranged from -15.0%
      to -20.9% across dose groups versus -3.1% with placebo. In SURMOUNT-5 (751
      adults without diabetes), weight change at week 72 was -20.2% with
      tirzepatide versus -13.7% with semaglutide. Gastrointestinal events were the
      most common adverse events in SURMOUNT-5.
    citations:
      - doi: "10.1056/NEJMoa2206038"
        title: "Tirzepatide Once Weekly for the Treatment of Obesity"
        year: 2022
        finding: "Mean weight change -15.0% to -20.9% vs -3.1% with placebo at week 72"
      - doi: "10.1056/NEJMoa2416394"
        title: "Tirzepatide as Compared with Semaglutide for the Treatment of Obesity"
        year: 2025
        finding: "Weight change -20.2% vs -13.7% with semaglutide at week 72 in adults with obesity without diabetes"
    trials_query: "tirzepatide AND obesity"
  - indication: "Obstructive sleep apnoea with obesity"
    tier: E1
    human_rcts: null
    human_trials_any: null
    summary: >-
      Two randomised placebo-controlled phase 3 trials reported together
      (SURMOUNT-OSA, 469 participants). The apnoea-hypopnoea index fell by 25.3
      and 29.3 events per hour with tirzepatide versus 5.3 and 5.5 with placebo at
      week 52 (treatment differences about -20 and -24 events per hour).
    citations:
      - doi: "10.1056/NEJMoa2404881"
        title: "Tirzepatide for the Treatment of Obstructive Sleep Apnea and Obesity"
        year: 2024
        finding: "AHI reduced by about 20-24 more events per hour than placebo at week 52 in two trials"
    trials_query: "tirzepatide AND sleep apnea"
  - indication: "Heart failure with preserved ejection fraction and obesity"
    tier: E2
    human_rcts: null
    human_trials_any: null
    summary: >-
      One phase 3 trial (SUMMIT, 731 patients, median follow-up 104 weeks).
      Cardiovascular death or worsening heart failure occurred in 9.9% with
      tirzepatide versus 15.3% with placebo (hazard ratio 0.62). The difference
      was driven by worsening heart-failure events; cardiovascular deaths were few
      (8 vs 5) and did not differ.
    citations:
      - doi: "10.1056/NEJMoa2410027"
        title: "Tirzepatide for Heart Failure with Preserved Ejection Fraction and Obesity"
        year: 2025
        finding: "Composite of cardiovascular death or worsening heart failure 9.9% vs 15.3% (HR 0.62)"
    trials_query: "tirzepatide AND heart failure"
  - indication: "Metabolic dysfunction-associated steatohepatitis (MASH)"
    tier: E3
    human_rcts: null
    human_trials_any: null
    summary: >-
      One phase 2 trial (SYNERGY-NASH, 190 participants, 157 with evaluable week
      52 biopsies). MASH resolution without worsening fibrosis occurred in 44% to
      62% across tirzepatide dose groups versus 10% with placebo. No phase 3
      histology or liver-outcomes result has been published.
    citations:
      - doi: "10.1056/NEJMoa2401943"
        title: "Tirzepatide for Metabolic Dysfunction–Associated Steatohepatitis with Liver Fibrosis"
        year: 2024
        finding: "MASH resolution 44-62% vs 10% with placebo at week 52 (phase 2)"
    trials_query: "tirzepatide AND steatohepatitis"
safety:
  grade: S1
  no_data_statement: false
  known_signals:
    - signal: "Gastrointestinal adverse events"
      evidence: >-
        Gastrointestinal events were the most common adverse events in
        SURMOUNT-5, mostly mild to moderate.
        SURPASS-CVOT reported more gastrointestinal adverse events with
        tirzepatide than dulaglutide. The UK MHRA strengthened warnings on acute
        pancreatitis for GLP-1 and dual GIP/GLP-1 receptor agonists in January 2026.
      citation: {doi: "10.1056/nejmoa2505928", title: "Cardiovascular Outcomes with Tirzepatide versus Dulaglutide in Type 2 Diabetes"}
    - signal: "Gallbladder and biliary disease (incretin-class signal)"
      evidence: "Meta-analysis of GLP-1 receptor agonist trials found increased gallbladder or biliary disease (RR 1.37); tirzepatide was not part of that analysis, so the class finding is indirect for this compound."
      citation: {doi: "10.1001/jamainternmed.2022.0338", title: "Association of Glucagon-Like Peptide-1 Receptor Agonist Use With Risk of Gallbladder and Biliary Diseases"}
    - signal: "Thyroid C-cell tumours in rodents (GLP-1 receptor agonist class)"
      evidence: "GLP-1 receptor agonists cause thyroid C-cell proliferation in rodents; human relevance is not established."
      citation: {doi: "10.1210/en.2009-1272", title: "Glucagon-Like Peptide-1 Receptor Agonists Activate Rodent Thyroid C-Cells Causing Calcitonin Release and C-Cell Proliferation"}
