slug: desmopressin
names:
  inn: "desmopressin"
  common: ["Desmopressin", "Desmopressin acetate", "DDAVP", "1-deamino-8-D-arginine vasopressin"]
  codes: ["DDAVP", "SER120"]
  brands: ["DDAVP", "Nocdurna"]
  cas: null
sequence: null
sequence_note: "Synthetic analogue of arginine vasopressin: 3-mercaptopropionic acid (deaminated Cys1)-Tyr-Phe-Gln-Asn-Cys-Pro-D-Arg-Gly-NH2, disulfide-bridged; contains a D-arginine and a C-terminal amide, so no standard one-letter sequence is given."
class_by_jurisdiction: {US: A, EU: null, UK: null, CA: A, AU: null, JP: null, CN: null}
what_it_is: >-
  A synthetic nine-residue analogue of the pituitary hormone vasopressin, modified
  to act mainly on kidney water reabsorption with little effect on blood pressure.
  It has been an approved prescription drug for decades in tablet, nasal,
  sublingual and injectable forms. Labelled uses include central diabetes
  insipidus, primary nocturnal enuresis, nocturia due to nocturnal polyuria, and,
  for the injectable form, certain bleeding disorders.
evidence:
  - indication: "Nocturia due to nocturnal polyuria in adults"
    tier: E1
    human_rcts: 3
    human_trials_any: 3
    summary: >-
      Several adequately sized randomised, double-blind, placebo-controlled phase 3
      trials of low-strength sublingual and nasal formulations reported modest
      reductions in night-time voids compared with placebo. Effect sizes over
      placebo were small in absolute terms. Hyponatraemia was the principal safety
      concern and was more frequent in older participants.
    citations:
      - doi: "10.1016/j.juro.2012.12.112"
        title: "Efficacy and Safety of Low Dose Desmopressin Orally Disintegrating Tablet in Men with Nocturia: Results of a Multicenter, Randomized, Double-Blind, Placebo Controlled, Parallel Group Study"
        year: 2013
        finding: "Greater reduction in nocturnal voids than placebo in men with nocturia in a randomised placebo-controlled trial"
      - doi: "10.1016/j.juro.2018.04.050"
        title: "Efficacy and Safety of SER120 Nasal Spray in Patients with Nocturia: Pooled Analysis of 2 Randomized, Double-Blind, Placebo Controlled, Phase 3 Trials"
        year: 2018
        finding: "Pooled analysis of two placebo-controlled phase 3 trials reported fewer nocturnal voids with the nasal formulation than with placebo"
    trials_query: "desmopressin nocturia"
  - indication: "Primary nocturnal enuresis in children"
    tier: E1
    human_rcts: null
    human_trials_any: null
    summary: >-
      A Cochrane systematic review of randomised trials found that desmopressin
      reduced the number of wet nights compared with placebo while it was being
      taken, but the review found no evidence that the benefit persisted after
      treatment stopped. The exact number of included RCTs is not restated here.
    citations:
      - doi: "10.1002/14651858.CD002112"
        title: "Desmopressin for nocturnal enuresis in children"
        year: 2002
        finding: "Fewer wet nights than placebo during treatment in children with nocturnal enuresis; no sustained effect after stopping"
    trials_query: "desmopressin enuresis"
  - indication: "Central diabetes insipidus"
    tier: E4
    human_rcts: null
    human_trials_any: null
    summary: >-
      Use in central diabetes insipidus rests on early uncontrolled clinical studies
      from the 1970s showing an antidiuretic response, and on long clinical use. No
      placebo-controlled trial is cited here; in a condition with a direct
      physiological replacement rationale, randomised placebo-controlled trials have
      not been the basis of approval.
    citations:
      - doi: "10.1530/acta.0.069s052"
        title: "THERAPEUTIC RESPONSE OF CENTRAL DIABETES INSIPIDUS ON NASAL APPLICATION OF A NEW SYNTHETIC ANALOGUE OF VASOPRESSIN (1-DEAMINO-8-D-ARGININE-VASOPRESSIN (DDAVP))"
        year: 1972
        finding: "Early clinical report of antidiuretic response to nasal desmopressin in patients with central diabetes insipidus"
    trials_query: "desmopressin diabetes insipidus"
  - indication: "Haemophilia A and von Willebrand disease (bleeding prevention)"
    tier: E4
    human_rcts: null
    human_trials_any: null
    summary: >-
      The use of desmopressin to raise factor VIII and von Willebrand factor levels
      in mild haemophilia A and type 1 von Willebrand disease was established in
      uncontrolled clinical studies beginning in 1977. No randomised trial with
      bleeding outcomes is cited here.
    citations:
      - doi: "10.1016/s0140-6736(77)91197-7"
        title: "1-DEAMINO-8-D-ARGININE VASOPRESSIN: A NEW PHARMACOLOGICAL APPROACH TO THE MANAGEMENT OF HAEMOPHILIA AND VON WILLEBRAND'S DISEASE"
        year: 1977
        finding: "Uncontrolled clinical study reporting rises in factor VIII and von Willebrand factor after desmopressin in patients with haemophilia and von Willebrand disease"
    trials_query: "desmopressin hemophilia"
safety:
  grade: S1
  no_data_statement: false
  known_signals:
    - signal: "Hyponatraemia"
      evidence: "A systematic review and meta-analysis found hyponatraemia to be a recognised risk in older adults treated with desmopressin for nocturia. Severe hyponatraemia can cause seizures."
      citation: {doi: "10.1002/nau.20038", title: "The risk of hyponatremia in older adults using desmopressin for nocturia: A systematic review and meta‐analysis"}
