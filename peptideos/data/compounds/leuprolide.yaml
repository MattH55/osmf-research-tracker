slug: leuprolide
names:
  inn: "leuprorelin"
  common: ["Leuprolide", "Leuprolide acetate", "Leuprorelin", "Leuprorelin mesilate"]
  codes: []
  brands: ["Lupron Depot", "Lupron", "Camcevi"]
  cas: null
sequence: null
sequence_note: "Synthetic GnRH agonist nonapeptide: pGlu-His-Trp-Ser-Tyr-D-Leu-Leu-Arg-Pro-NHEt (N-terminal pyroglutamate, D-leucine at position 6, C-terminal ethylamide); no standard one-letter sequence is given."
class_by_jurisdiction: {US: A, EU: A, UK: null, CA: A, AU: null, JP: null, CN: null}
what_it_is: >-
  A synthetic nine-residue analogue of gonadotropin-releasing hormone (GnRH). After
  an initial surge, continued exposure suppresses pituitary gonadotropin release and
  lowers testosterone or oestrogen to castrate or postmenopausal levels. It is an
  approved prescription drug in long-acting injectable forms. Labelled uses include
  advanced prostate cancer, endometriosis, uterine fibroids (with iron, before
  surgery) and central precocious puberty, varying by product and jurisdiction.
evidence:
  - indication: "Advanced prostate cancer (androgen deprivation)"
    tier: E2
    human_rcts: 1
    human_trials_any: 1
    summary: >-
      A randomised trial in metastatic prostate cancer compared leuprolide with
      diethylstilbestrol, the hormonal standard of the time, and reported similar
      disease response with fewer cardiovascular and breast adverse effects. The
      wider GnRH-agonist trial literature is larger than the single RCT cited here;
      only the verified trial is counted.
    citations:
      - doi: "10.1056/nejm198411153112004"
        title: "Leuprolide versus Diethylstilbestrol for Metastatic Prostate Cancer"
        year: 1984
        finding: "Comparable response rates with leuprolide and diethylstilbestrol in men with metastatic prostate cancer, with fewer cardiovascular and breast adverse effects in the leuprolide arm"
    trials_query: "leuprolide prostate cancer"
  - indication: "Endometriosis (pain)"
    tier: E2
    human_rcts: 2
    human_trials_any: 2
    summary: >-
      A randomised, double-blind, placebo-controlled trial reported reduced
      endometriosis-associated pain with depot leuprolide. A 12-month randomised
      trial tested hormonal add-back regimens alongside leuprolide to limit bone
      loss and menopausal symptoms. Hypo-oestrogenic adverse effects, including bone
      mineral density loss, limit duration of use.
    citations:
      - doi: "10.1016/s0015-0282(16)53755-8"
        title: "Lupron  depot (leuprolide acetate for depot suspension) in the treatment of endometriosis: a randomized, placebo-controlled, double-blind study"
        year: 1990
        finding: "Greater reduction in endometriosis symptoms with depot leuprolide than with placebo in a randomised double-blind trial"
      - doi: "10.1016/s0029-7844(97)00620-0"
        title: "Leuprolide Acetate Depot and Hormonal Add-Back in Endometriosis: A 12-Month Study"
        year: 1998
        finding: "Randomised comparison of hormonal add-back regimens given with depot leuprolide in women with endometriosis, assessing pain relief and bone mineral density"
    trials_query: "leuprolide endometriosis"
  - indication: "Uterine leiomyomata (fibroids), before surgery"
    tier: E3
    human_rcts: 1
    human_trials_any: 1
    summary: >-
      A small randomised, placebo-controlled, double-blind trial reported reductions
      in uterine and fibroid volume with depot leuprolide. Larger trials with
      surgical or long-term outcomes were not verified for this record.
    citations:
      - doi: "10.1016/s0015-0282(16)60486-7"
        title: "A randomized, placebo-controlled, double-blind study evaluating the efficacy of leuprolide acetate depot in the treatment of uterine leiomyomata"
        year: 1989
        finding: "Reduction in uterine volume with depot leuprolide compared with placebo in women with uterine leiomyomata"
    trials_query: "leuprolide leiomyoma"
  - indication: "Central precocious puberty"
    tier: E4
    human_rcts: 0
    human_trials_any: 1
    summary: >-
      Approval and current evidence in central precocious puberty rest on
      single-arm, open-label studies measuring suppression of the pituitary-gonadal
      axis, such as a recent phase 3 study of a long-acting formulation. A
      randomised placebo-controlled design is not used in this condition; no RCT is
      cited.
    citations:
      - doi: "10.1210/jendso/bvaf224"
        title: "Long-term Safety, Efficacy, and PROs: Phase 3 Study of Leuprolide Acetate 6-month IM Depot in Central Precocious Puberty"
        year: 2026
        finding: "Single-arm phase 3 study reporting suppression of luteinising hormone in children with central precocious puberty"
    trials_query: "leuprolide precocious puberty"
safety:
  grade: S1
  no_data_statement: false
  known_signals:
    - signal: "Diabetes and cardiovascular disease during androgen deprivation"
      evidence: "In a large observational cohort of men with prostate cancer, GnRH-agonist therapy was associated with higher risk of incident diabetes, coronary heart disease, myocardial infarction and sudden cardiac death."
      citation: {doi: "10.1200/JCO.2006.06.2497", title: "Diabetes and Cardiovascular Disease During Androgen Deprivation Therapy for Prostate Cancer"}
    - signal: "Bone mineral density loss with hypo-oestrogenism"
      evidence: "Bone loss during leuprolide treatment for endometriosis was the reason hormonal add-back regimens were tested in a randomised trial."
      citation: {doi: "10.1016/s0029-7844(97)00620-0", title: "Leuprolide Acetate Depot and Hormonal Add-Back in Endometriosis: A 12-Month Study"}
