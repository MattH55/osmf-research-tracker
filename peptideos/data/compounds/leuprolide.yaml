mechanism: >-
  Leuprolide is a GnRH receptor agonist; in human studies continuous exposure,
  after an initial rise, down-regulates pituitary GnRH receptors and suppresses
  luteinising hormone, follicle-stimulating hormone and sex-steroid levels.
