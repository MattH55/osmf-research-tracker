sequence: "AEDG"
sequence_note: "Synthetic tetrapeptide Ala-Glu-Asp-Gly. It was designed on the basis of epithalamin, a peptide extract of bovine pineal gland; epithalamin is a different product and its studies are not counted here."
class_by_jurisdiction: {US: C, EU: C, UK: null, CA: C, AU: null, JP: null, CN: null}
what_it_is: >-
  A synthetic four-amino-acid peptide (Ala-Glu-Asp-Gly) developed in Russia as a
  laboratory analogue of a pineal gland extract. It is sold online as a research
  chemical with claims of slowing ageing and lengthening telomeres. No approved
  medicine contains it in any jurisdiction checked. The published research comes
  mostly from one group of institutes and consists of rodent lifespan studies and
  cultured-cell experiments; no controlled human trial of an ageing outcome was
  identified.
evidence:
  - indication: "Anti-ageing / lifespan extension"
    tier: E6
    human_rcts: 0
    human_trials_any: 0
    summary: >-
      Lifespan and age-related tumour outcomes have been reported only in rodents,
      from studies by the developing research group: female mice and female rats
      given epitalon had changes in biomarkers of ageing, survival curves and
      spontaneous tumour incidence. No human study of lifespan, mortality,
      frailty or any clinical ageing outcome was identified. A small Russian report
      described night-time melatonin levels in elderly people given pineal peptides
      including epitalon; it measured a hormone level, not an ageing outcome, and is
      not counted as an efficacy trial here.
    citations:
      - doi: "10.1023/a:1025114230714"
        title: "Effect of Epitalon on biomarkers of aging, life span and spontaneous tumor incidence in female Swiss-derived SHR mice"
        year: 2003
        finding: "Changes in biomarkers of ageing, survival and spontaneous tumour incidence in female SHR mice given epitalon"
      - doi: "10.1007/s10517-007-0441-z"
        title: "Effect of Ala-Glu-Asp-Gly peptide on life span and development of spontaneous tumors in female rats exposed to different illumination regimes"
        year: 2007
        finding: "Effects on life span and spontaneous tumour development in female rats kept under different light regimes"
      - pmid: 17969590
        title: "[Normalizing effect of the pineal gland peptides on the daily melatonin rhythm in old monkeys and elderly people]."
        year: 2007
        finding: "Night-time melatonin levels rose in old monkeys and in elderly people given pineal peptides; no ageing outcome was measured"
    trials_query: "epitalon"
  - indication: "Telomere lengthening"
    tier: E7
    human_rcts: 0
    human_trials_any: 0
    summary: >-
      The telomere claim rests on cultured-cell experiments. Epitalon added to
      cultured human somatic cells was reported to induce telomerase activity and
      telomere elongation, and a 2025 study in human cell lines reported longer
      telomeres through telomerase upregulation or an alternative lengthening
      pathway. No study measuring telomere length in people given epitalon was
      identified, and no study links any telomere change from epitalon to a health
      outcome.
    citations:
      - doi: "10.1023/a:1025493705728"
        title: "Epithalon Peptide Induces Telomerase Activity and Telomere Elongation in Human Somatic Cells"
        year: 2003
        finding: "Telomerase activity and telomere elongation in cultured human somatic cells"
      - doi: "10.1007/s10522-025-10315-x"
        title: "Epitalon increases telomere length in human cell lines through telomerase upregulation or ALT activity"
        year: 2025
        finding: "Longer telomeres in cultured human cell lines, attributed to telomerase upregulation or alternative lengthening of telomeres"
    trials_query: "epitalon"
