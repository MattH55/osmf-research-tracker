slug: ll-37
names:
  inn: null
  common: ["LL-37", "Cathelicidin LL-37", "Human cathelicidin antimicrobial peptide", "Ropocamptide"]
  codes: []
  brands: []
  cas: null
sequence: "LLGDFFRKSKEKIGKEFKRIVQRIKDFLRNLVPRTES"
sequence_note: "37 residues cleaved from the C-terminus of the human cathelicidin precursor hCAP-18 (UniProt P49913, residues 134-170). Ropocamptide is the name used by its developer, Promore Pharma, for a topical synthetic LL-37 product."
class_by_jurisdiction: {US: C, EU: null, UK: null, CA: null, AU: null, JP: null, CN: null}
what_it_is: >-
  A 37-amino-acid antimicrobial peptide made naturally by human white blood
  cells and skin and mucosal cells, the only human member of the cathelicidin
  family. A synthetic version has been tested as a topical treatment for
  chronic leg and foot ulcers. Separately, it is sold on the gray market,
  often for injection, with claims for chronic infections, immune support and
  gut health. It is not approved as a medicine in any jurisdiction checked.
evidence:
  - indication: "Chronic venous leg ulcers unresponsive to standard care (topical synthetic LL-37)"
    tier: E3
    human_rcts: 2
    human_trials_any: 2
    summary: >-
      A first-in-human randomised trial in 34 patients over four weeks reported
      faster healing-rate constants for the two lower concentrations than for
      placebo, but not for the highest. The larger phase 2b trial (HEAL LL-37,
      148 patients, sponsored by the developer) found no significant improvement
      in healing compared with placebo in the full population; benefit in
      patients with large ulcers came from a post hoc subgroup analysis. The
      randomised evidence is conflicting and the larger trial was negative.
    citations:
      - doi: "10.1111/wrr.12977"
        title: "Evaluation of LL-37 in healing of hard-to-heal venous leg ulcers: A multicentric prospective randomized placebo-controlled clinical trial"
        year: 2021
        finding: "No significant difference in ulcer healing versus placebo in 148 patients with venous leg ulcers; post hoc subgroup differences only"
      - doi: "10.1111/wrr.12211"
        title: "Treatment with LL-37 is safe and effective in enhancing healing of hard-to-heal venous leg ulcers: a randomized, placebo-controlled clinical trial"
        year: 2014
        finding: "Higher healing-rate constants than placebo at the two lower concentrations, not the highest, in 34 patients over four weeks"
    trials_query: "LL-37"
  - indication: "Diabetic foot ulcers (topical synthetic LL-37)"
    tier: E3
    human_rcts: 1
    human_trials_any: 1
    summary: >-
      One small randomised, double-blind, placebo-controlled trial in Jakarta
      treated mildly infected diabetic foot ulcers with LL-37 cream or placebo
      cream for four weeks. A granulation index increased more with LL-37; wound
      inflammatory cytokines and aerobic bacterial counts did not differ
      significantly between groups. No confirmatory trial was identified.
    citations:
      - doi: "10.1007/s00403-023-02657-8"
        title: "Efficacy of LL-37 cream in enhancing healing of diabetic foot ulcer: a randomized double-blind controlled trial"
        year: 2023
        finding: "Greater increase in granulation index than placebo over four weeks in patients with mildly infected diabetic foot ulcers; no difference in bacterial colonisation"
    trials_query: "LL-37 diabetic foot ulcer"
  - indication: "Systemic or chronic infections and immune support (injected LL-37, gray-market claims)"
    tier: E6
    human_rcts: 0
    human_trials_any: 0
    summary: >-
      LL-37 kills a range of bacteria in laboratory assays, with activity reduced
      for some organisms at physiological salt concentrations. In a mouse model
      of polymicrobial sepsis, intravenous LL-37 improved survival and lowered
      bacterial counts. No human trial of injected or oral LL-37 for any
      infection, for immune support or for gut health was identified. The only
      registered human trial of injected LL-37 identified was a four-patient
      intratumoural melanoma study, without published results.
    citations:
      - doi: "10.1093/intimm/dxv113"
        title: "Antimicrobial cathelicidin peptide LL-37 inhibits the pyroptosis of macrophages and improves the survival of polybacterial septic mice"
        year: 2016
        finding: "Intravenous LL-37 improved survival and reduced bacterial burden in mice with caecal ligation and puncture sepsis"
      - doi: "10.1128/AAC.42.9.2206"
        title: "Activities of LL-37, a Cathelin-Associated Antimicrobial Peptide of Human Neutrophils"
        year: 1998
        finding: "LL-37 showed antimicrobial activity against several bacterial species in vitro; some organisms were resistant in physiological salt"
    trials_query: "LL-37"
