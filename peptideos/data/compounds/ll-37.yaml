regulatory:
  - jurisdiction: US
    status: unapproved
    detail: "Not approved: FDA has approved no product containing LL-37. FDA's list of bulk substances that may present significant safety risks names cathelicidin LL-37 among substances previously in 503A Category 2 whose nominations were withdrawn; it is not on the current 503A Category 1 or 2 lists (updated 14 May 2026). FDA cites possible immunogenicity, impurity and characterisation concerns, and nonclinical findings of detrimental effects on male reproduction and protumorigenic effects in some tissues."
    source_url: "https://www.fda.gov/drugs/human-drug-compounding/certain-bulk-drug-substances-use-compounding-may-present-significant-safety-risks"
    source_title: "Certain Bulk Drug Substances for Use in Compounding that May Present Significant Safety Risks (FDA, content current as of 04/22/2026)"
    quote: "FDA lacks sufficient safety-related information regarding cathelicidin LL-37 to know whether the drug would cause harm when administered to humans."
