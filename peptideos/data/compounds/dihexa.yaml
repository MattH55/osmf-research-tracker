sequence_note: "N-hexanoic-Tyr-Ile-(6) aminohexanoic amide: a modified dipeptide (Tyr-Ile) with an N-terminal hexanoyl group and a C-terminal 6-aminohexanoic amide; non-standard groups, so no one-letter sequence is given."
class_by_jurisdiction: {US: C, EU: C, UK: null, CA: C, AU: null, JP: null, CN: null}
what_it_is: >-
  A small, chemically modified peptide derived from angiotensin IV, designed at a
  US university to be stable and to reach the brain when taken by mouth. It is sold
  online as a research chemical with claims of improving memory and cognition. It
  has never been tested in people in any published study identified, and no
  approved medicine contains it. Two journal papers from the developing laboratory
  on the angiotensin IV/HGF approach were retracted in 2025, and the original dihexa
  report carries an expression of concern.
evidence:
  - indication: "Cognitive enhancement / dementia"
    tier: E6
    human_rcts: 0
    human_trials_any: 0
    summary: >-
      All efficacy data are from rodents. The developing group reported that dihexa
      reversed scopolamine-induced and age-related deficits in a water-maze test in
      rats; the journal attached an expression of concern to that report in 2021. A
      separate group reported improved spatial learning in APP/PS1 Alzheimer-model
      mice. A 2014 paper from the developing laboratory proposing that these effects
      depend on the HGF/c-Met system was retracted in 2025. No human study of any
      kind was identified.
    citations:
      - doi: "10.1124/jpet.112.199497"
        title: "Evaluation of Metabolically Stabilized Angiotensin IV Analogs as Procognitive/Antidementia Agents"
        year: 2013
        finding: "Reversed scopolamine-induced and age-related water-maze deficits in rats (report subject to a 2021 expression of concern)"
      - doi: "10.3390/brainsci11111487"
        title: "AngIV-Analog Dihexa Rescues Cognitive Impairment and Recovers Memory in the APP/PS1 Mouse via the PI3K/AKT Signaling Pathway"
        year: 2021
        finding: "Improved spatial learning in the water maze and reduced glial activation in APP/PS1 Alzheimer-model mice"
      - doi: "10.1016/j.jpet.2025.103567"
        title: "Retraction notice to “The Procognitive and Synaptogenic Effects of Angiotensin IV–Derived Peptides Are Dependent on Activation of the Hepatocyte Growth Factor/c-Met System” [J Pharmacol Exp Ther 351 (2014) 390-402]"
        year: 2025
        finding: "Retraction of the 2014 rodent and cell report linking these peptides' effects to the HGF/c-Met system"
    trials_query: "dihexa"
