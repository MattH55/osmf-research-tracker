slug: afamelanotide
names:
  inn: "afamelanotide"
  common: ["Afamelanotide", "Melanotan-1", "MT-1", "[Nle4, D-Phe7]-alpha-MSH"]
  codes: ["CUV1647"]
  brands: ["Scenesse"]
  cas: null
sequence: null
sequence_note: "Linear tridecapeptide analogue of alpha-MSH: Ac-Ser-Tyr-Ser-Nle-Glu-His-D-Phe-Arg-Trp-Gly-Lys-Pro-Val-NH2, per the US prescribing information. Contains norleucine and a D-amino acid, so no plain one-letter sequence is given."
class_by_jurisdiction: {US: A, EU: A, UK: A, CA: A, AU: A, JP: null, CN: null}
what_it_is: >-
  A synthetic analogue of alpha-melanocyte-stimulating hormone that binds mainly
  to the melanocortin-1 receptor and increases eumelanin in the skin. It is
  approved as a controlled-release subcutaneous implant (Scenesse) for adults with
  erythropoietic protoporphyria (EPP), a rare inherited condition causing painful
  reactions to light, in the US, EU, UK, Canada and Australia. The same molecule
  (Melanotan-1) is also sold as unapproved powder for cosmetic tanning; that
  material is not the approved product.
evidence:
  - indication: "Phototoxicity in erythropoietic protoporphyria (adults)"
    tier: E1
    human_rcts: 2
    human_trials_any: null
    summary: >-
      Two multicentre, double-blind, placebo-controlled RCTs (74 patients in the EU,
      94 in the US) found longer pain-free direct sunlight exposure with
      afamelanotide (US median 69.4 versus 40.8 hours over 6 months; EU median 6.0
      versus 0.8 hours over 9 months) and improved quality of life. An
      observational study of 115 patients treated for up to 8 years at two centres
      reported sustained use and only minor adverse events. The EU authorisation is
      under exceptional circumstances because comprehensive data could not be
      obtained.
    citations:
      - doi: "10.1056/nejmoa1411481"
        title: "Afamelanotide for Erythropoietic Protoporphyria"
        year: 2015
        finding: "Two RCTs: longer pain-free sunlight exposure and fewer phototoxic reactions (EU trial) than placebo in EPP"
      - doi: "10.1111/bjd.13598"
        title: "Long-term observational study of afamelanotide in 115 patients with erythropoietic protoporphyria"
        year: 2015
        finding: "Sustained use and improved EPP quality-of-life scores over up to 8 years; mainly minor adverse events such as nausea"
    trials_query: "afamelanotide"
  - indication: "Nonsegmental vitiligo (with narrowband UV-B phototherapy)"
    tier: E3
    human_rcts: 1
    human_trials_any: null
    summary: >-
      One small randomised multicentre trial (55 patients, skin phototypes III-VI)
      found faster and greater repigmentation with afamelanotide plus narrowband
      UV-B than with UV-B alone. A larger phase 3 trial is registered and active but
      had not reported on the retrieval date. Vitiligo is not an approved
      indication in any jurisdiction checked.
    citations:
      - doi: "10.1001/jamadermatol.2014.1875"
        title: "Afamelanotide and Narrowband UV-B Phototherapy for the Treatment of Vitiligo"
        year: 2015
        finding: "Greater and earlier repigmentation with combination therapy than narrowband UV-B alone in a 55-patient RCT"
    trials_query: "afamelanotide"
  - indication: "Cosmetic tanning in healthy people (gray-market 'Melanotan-1' claim)"
    tier: E3
    human_rcts: 2
    human_trials_any: 3
    summary: >-
      Three small phase 1 studies in healthy volunteers (two of them randomising 8
      subjects each, one open-label with 12) reported skin darkening and enhanced tanning with
      sunlight or UV-B. These were safety studies of short duration. There is no
      evidence that induced tanning reduces skin cancer or sunburn in real-world use,
      and no data on gray-market material.
    citations:
      - doi: "10.1001/archderm.140.7.827"
        title: "Effects of a Superpotent Melanotropic Peptide in Combination With Solar UV Radiation on Tanning of the Skin in Human Volunteers"
        year: 2004
        finding: "Enhanced tanning with sunlight or UV-B in small phase 1 studies of healthy volunteers; nausea and transient facial flushing reported"
    trials_query: "afamelanotide"
safety:
  grade: S2
  no_data_statement: true
  known_signals:
    - signal: "Serious hypersensitivity reactions, including anaphylaxis"
      evidence: "US prescribing information Warnings and Precautions 5.1."
      citation: {url: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2024/210797s007lbl.pdf", title: "SCENESSE (afamelanotide) implant, for subcutaneous use"}
    - signal: "Darkening of pre-existing naevi and ephelides"
      evidence: "US prescribing information Warnings and Precautions 5.2 (skin monitoring); periodic full-body skin examination is recommended in the label."
      citation: {url: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2024/210797s007lbl.pdf", title: "SCENESSE (afamelanotide) implant, for subcutaneous use"}
    - signal: "Nausea"
      evidence: "Most frequently recorded adverse event attributed to afamelanotide in long-term observational use."
      citation: {doi: "10.1111/bjd.13598", title: "Long-term observational study of afamelanotide in 115 patients with erythropoietic protoporphyria"}
