    <div id="widget"></div>
    <noscript><div class="fallback">Latest research: <a href="https://research.opensourcemed.info/?utm_source=embed&utm_medium=iframe" target="_top">Open Source Medicine Research Tracker</a></div></noscript>
    <script src="widget.js" data-manual></script>
    <script>
    (function () {
        var q = {};
        location.search.replace(/^\?/, '').split('&').forEach(function (kv) {
            if (!kv) { return; }
            var i = kv.indexOf('=');
            var k = decodeURIComponent(i < 0 ? kv : kv.slice(0, i));
            var v = decodeURIComponent(i < 0 ? '' : kv.slice(i + 1).replace(/\+/g, ' '));
            q[k] = v;
        });
        var host = document.getElementById('widget');
        if (window.OSMResearchWidget) {
            if (q.theme === 'dark') { document.body.style.background = '#111827'; }
            window.OSMResearchWidget.render(host, {
                condition: q.condition || 'long-covid',
                limit: q.limit || 5,
                theme: q.theme || 'light',
                title: q.title || '',
                base: q.base && /^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?\/$/.test(q.base) ? q.base : undefined
            });
        } else {
            host.innerHTML = '<div class="fallback">Latest research: <a href="https://research.opensourcemed.info/?utm_source=embed&utm_medium=iframe" target="_top">Open Source Medicine Research Tracker</a></div>';
        }
        /* Let the widget fill the iframe height. */
        var w = host.shadowRoot ? host.shadowRoot.querySelector('.w') : host.querySelector('.w');
        if (w) { w.style.maxHeight = '100vh'; w.style.height = '100vh'; w.style.borderRadius = '0'; w.style.border = '0'; }
        var mo = new MutationObserver(function () {
            var el = host.shadowRoot ? host.shadowRoot.querySelector('.w') : host.querySelector('.w');
            if (el) { el.style.maxHeight = '100vh'; el.style.height = '100vh'; el.style.borderRadius = '0'; el.style.border = '0'; }
        });
        mo.observe(host.shadowRoot || host, { childList: true, subtree: true });
    })();
    </script>
</body>
