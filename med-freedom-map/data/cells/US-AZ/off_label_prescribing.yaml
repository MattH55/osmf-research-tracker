  note: Stored pre_2020. Earlier off-label statutes exist (A.R.S. § 32-1997, 2017; pre-2021 version of § 32-3221), but the most recent significant amendment (2021) added off-label use of medications during a public health emergency to the protected 'lawful health care service' definition (Senate fact sheet, Feb. 15, 2021).
