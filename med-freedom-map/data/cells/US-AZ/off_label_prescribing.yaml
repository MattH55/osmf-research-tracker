jurisdiction: US-AZ
layer: off_label_prescribing
dimensions:
- id: board_discipline_protection
  value: true
  citation: A.R.S. § 32-3221(A) (as amended by Laws 2021, ch. 349, SB 1416)
  source_id: osmf_verification_2026_10
  source_url: https://www.azleg.gov/ars/32/03221.htm
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: Stored citation (FSMB homepage) was wrong but value is right. Subsection E.4 preserves board action for unprofessional conduct arising out of the conduct. Separate A.R.S. § 32-1997(D) (2017) bars board action against physicians for truthful off-label promotion.
  evidence_quote: including a health profession regulatory board ... may not punish a health professional ... for offering, providing or making available lawful health care services, including the off-label use of health care services for which there is a reasonable basis
  verification_status: confirmed
- id: pharmacist_refusal_to_fill_protection
  value: true
  citation: Ariz. Rev. Stat. § 36-2154(B)
  source_id: osmf_verification_2026_10
  source_url: https://www.azleg.gov/ars/36/02154.htm
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  evidence_quote: A pharmacy, hospital or health professional ... who states in writing an objection to abortion, abortion medication, emergency contraception ... on moral or religious grounds is not required to facilitate or participate
  verification_status: confirmed
  note: Scope limited to abortion medication and emergency contraception; written objection required; prescription must be returned to patient.
- id: pharmacist_refusal_prohibited
