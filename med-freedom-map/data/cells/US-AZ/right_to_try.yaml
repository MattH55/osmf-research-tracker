  note: 'Classic RTT article (36-1311 to 36-1314, read in full) has NO manufacturer liability clause; it only protects physician and health-care-institution licenses and penalizes state officials who block access -> FALSE for the classic RTT, so stored TRUE is not supported by that article. However, the separate individualized-treatment article, A.R.S. 36-1336 (https://www.azleg.gov/ars/36/01336.htm), is a ''no private cause of action'' clause: ''This article does not create a private cause of action against a manufacturer of an individualized investigational drug, biological product or device'', qualified by good-faith compliance and reasonable care. Marked ambiguous because the value depends on whether the RTT 2.0 article counts; best value for the classic RTT = false.'
  evidence_quote: a state regulatory board may not revoke, fail to renew or take any other action against a physician's license issued pursuant to title 32, chapter 13 or 17 based solely on a physician's recommendation to an eligible patient
  verification_status: ambiguous
