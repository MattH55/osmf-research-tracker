  evidence_quote: In Arizona, voters, as expected, supported a "right to try" ballot measure that would allow, but not require, drug makers to provide not-yet-approved drugs to people with terminal illnesses.
  verification_status: corrected
  note: Arizona's RTT was Proposition 303 (Patient's Right to Try Act), referred by the Legislature and approved by voters at the November 2014 general election (ASU Morrison Institute 2014 ballot guide also describes Prop 303 as put on the ballot by the Legislature). Stored 2015 is wrong. Enactment was by voter approval, not governor signature; official canvass not loaded.
