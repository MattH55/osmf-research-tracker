  value: State Department of Health monitors compliance (complaints, website audits), may issue written notice, request a corrective action plan for material violations, and impose and publicize an administrative penalty if a hospital fails to submit or comply with the plan; hospitals not in material compliance may not initiate or pursue collection actions, and patients may sue, with refund plus a penalty equal to the debt if the hospital is found noncompliant (63 O.S. 1-725.15 to 1-725.17, eff. Nov. 1, 2025).
