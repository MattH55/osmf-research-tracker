  confidence: high
  note: '''No private cause of action'' clause (not an immunity, though captioned ''Limited Immunity''), qualified: ''so long as the manufacturer or other person or entity is complying in good faith with the terms of the Right to Try Act, unless there was a failure to exercise reasonable care.'''
  evidence_quote: The Right to Try Act does not create a private cause of action against a manufacturer of an investigational drug, biological product or device or against another person or entity involved in the care of an eligible patient
  verification_status: confirmed
