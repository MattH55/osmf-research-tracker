- id: manufacturer_liability_shield
  value: true
  citation: Va. Code § 54.1-3442.4(B)-(C)
  source_id: osmf_verification_2026_10
  source_url: https://law.lis.virginia.gov/vacode/title54.1/chapter34/section54.1-3442.4/
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: 'Stored false is wrong. This is an express immunity from suit and liability with no good-faith qualifier. Subsection C adds that no claim or cause of action against a manufacturer shall exist in any state court for property, personal injury or death claims arising from the product. History note: 2015, cc. 655, 656.'
  evidence_quote: a manufacturer, distributor, administrator, health care provider ... sponsor, or physician who manufactures, supplies, distributes, administers, prescribes, or recommends an investigational drug, biological product, or device to a person who meets the criteria set forth in § 54.1-3442.2 shall be immune from suit and liability
  verification_status: corrected
