  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  evidence_quote: has the freedom to decline to perform, participate in, or pay for any health care service
  verification_status: confirmed
  note: Applies to any "medical practitioner" (any person who facilitates or participates in health care services; services include provision of pharmaceuticals) whose conscience is violated. Guttmacher (Sept. 2026) treats it as a general health care refusal law. Enacted 2021 (H.B. 110).
