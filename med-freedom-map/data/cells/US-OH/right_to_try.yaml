- id: manufacturer_liability_shield
  value: true
  citation: Ohio Rev. Code § 4729.89(C)
  source_id: osmf_verification_2026_10
  source_url: https://codes.findlaw.com/oh/title-xlvii-occupations-professions/oh-rev-code-sect-4729-89.html
  source_type: primary_statute
