  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: 'Immunity clause (not merely ''no private cause of action''): per § 4729.89(C) a manufacturer or terminal distributor that provides/distributes an investigational product under 4729.89 and 4731.97 is not liable in civil actions or subject to criminal prosecution, except for willful or wanton misconduct. The 4731.97(C) consent form must likewise state the manufacturer is shielded ''unless the act or omission constitutes willful or wanton misconduct''. Official Ohio sites (codes.ohio.gov, legislature.ohio.gov, LSC) refused connections from this environment, so the statute was read via FindLaw (WebFetch, quotes limited to short excerpts).'
  evidence_quote: is not liable for or subject to damages in any civil action or prosecution in any criminal proceeding
  verification_status: confirmed
