  evidence_quote: A pharmacist ... may exercise discretion and refuse to fill any prescription, dispense any drug ... if unsatisfied as to the legitimacy or appropriateness of any prescription presented
  verification_status: ambiguous
  note: Statute gives good-faith immunity for professional-judgment refusals (legitimacy/appropriateness/identity), but no conscience-based right; Board rule ch. 19 § 11 allows refusal "only as permitted by" § 13795(2). Kept false because only clinical/legitimacy grounds.
