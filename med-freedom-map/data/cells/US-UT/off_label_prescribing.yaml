- id: board_discipline_protection
  value: true
  citation: Utah Code Ann. § 58-13-2.7(3)(a) (S.B. 3002, 2020 3rd Spec. Sess.)
  source_id: osmf_verification_2026_10
  source_url: https://le.utah.gov/xcode/Title58/Chapter13/C58-13-S2.7_2020042220200422.html
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: medium
  note: 'Protection exists but is narrow: ''qualified treatment'' = FDA-approved drug not indicated for the illness, used during a declared major public health emergency to treat that illness, with counseling/documentation conditions. Not a general off-label shield. Effective 4/22/2020; section affected by sunset review 63I-1-258 on 7/1/2036.'
  evidence_quote: 'A health care provider is not subject to civil liability, criminal liability, or sanctions against the health care provider''s license for providing a qualified treatment to a patient if:'
  verification_status: ambiguous
- id: pharmacist_refusal_to_fill_protection
  value: true
  citation: Utah Code § 63G-33-302(1) (2026 S.B. 174)
  source_id: osmf_verification_2026_10
  source_url: https://le.utah.gov/Session/2026/bills/enrolled/SB0174.pdf
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  evidence_quote: 'a health care provider: (a) may refuse to participate in or provide a health care service that violates the health care provider''s religious beliefs or conscience'
  verification_status: confirmed
  note: Effective May 6, 2026. "Health care provider" includes individuals licensed under Title 58, Chapter 17b, Pharmacy Practice Act. Advance notice/posting duties apply. Previously only abortion refusal law (§ 76-7-306).
- id: pharmacist_refusal_prohibited
  value: false
  citation: NWLC Pharmacy Refusals 101 (July 2025)
  source_id: osmf_verification_2026_10
  source_url: https://nwlc.org/wp-content/uploads/2025/07/Pharmacy-Refusals-101-Factsheet-Updated-7.29.25.pdf
  source_type: secondary_tracker
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: medium
  note: State not among the eight with an explicit duty-to-dispense law/rule. Utah Code § 63G-33-302 (2026) protects conscience refusals.
  evidence_quote: Eight states—CA, IL, ME, MA, NV, NJ, WA, WI— explicitly require pharmacists or pharmacies to provide medication to patients.
  verification_status: confirmed
- id: statute_era
  value: '2020_2023'
  citation: Utah Code Ann. § 58-13-2.7, enacted by S.B. 3002 (2020 3rd Spec. Sess.), signed 4/22/2020
  source_id: osmf_verification_2026_10
  source_url: https://le.utah.gov/xcode/Title58/Chapter13/C58-13-S2.7_2020042220200422.html
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: Stored pre_2020. The off-label emergency immunity statute dates from April 2020. No later Utah off-label statute verified (2026 SB 80 concerns investigational drugs; status not confirmed).
  evidence_quote: '"Qualified treatment" means the use of a prescription drug or prescription device: (i) during a declared major public health emergency; ... (iii) that has been approved for sale but not indicated by the United States Food and Drug Administration'
  verification_status: corrected
