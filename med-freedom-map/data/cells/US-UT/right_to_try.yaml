- id: individualized_rtt
  value: false
  citation: Utah Code § 58-85-102, as amended by Laws of Utah 2026, ch. 136 (S.B. 222, Right to Try Amendments)
  source_id: osmf_verification_2026_10
  source_url: https://le.utah.gov/xcode/Title58/Chapter85/C58-85-S102_2026050620260506.html
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: medium
  note: 'S.B. 222 (2026) extended Utah RTT to non-terminal ''eligible illness'' and added a manufacturer reporting duty (§ 58-85-107). It does not add patient-specific individualized treatments: ''investigational drug'' still means a drug that completed Phase 1 and, for an eligible illness, is under an IND clinical investigation. No Utah Code text using ''individualized investigational treatment'' found (Utah code chapter 58-85 reviewed in full; web searches for the phrase returned no Utah statute). Some trackers (e.g. Wikipedia ''Right-to-Try 2.0'' list, lead only) count Utah (March 2026), so it is a category conflict. Best value under the brief''s patient-specific definition is false. Stored value true and stored note wording are not supported.'
  evidence_quote: '"Eligible illness" means a condition of a patient that: (a) as determined by a physician, presents a substantial and severely debilitating or life-threatening risk to the patient'
  verification_status: ambiguous
- id: manufacturer_liability_shield
  value: false
  citation: Utah Code § 58-85-104
  source_id: osmf_verification_2026_10
  source_url: https://le.utah.gov/xcode/Title58/Chapter85/C58-85-S104_2023050320230503.html
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: The liability protection covers only physicians, other licensed providers and hospitals. As to manufacturers, § 58-85-104(3)(c)(ii) only says the chapter does not create a private right of action 'against a manufacturer, for the manufacturer's refusal to provide' the drug; it has no clause shielding manufacturers from liability for harm. The § 58-85-106 public health emergency immunity likewise covers only health care providers. So false for manufacturers.
  evidence_quote: 'A physician, other licensed health care provider, or hospital that treats an eligible patient ... under this chapter may not, for any harm done to the eligible patient by the investigational drug or device, be subject to: (a) civil liability'
  verification_status: corrected
- id: insurer_coverage_required
  value: false
  citation: Utah Code § 58-85-105
  source_id: osmf_verification_2026_10
  source_url: https://le.utah.gov/xcode/Title58/Chapter85/C58-85-S105_2018120320181203.html
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: No coverage mandate; insurer may deny coverage for harm caused by the investigational product, but may not deny for preexisting conditions, previously commenced benefits, or palliative/hospice care (§ 58-85-105(2)-(3)).
  evidence_quote: 'This chapter does not: (a) require an insurer to cover the cost of: (i) administering an investigational drug under this chapter; or (ii) treating a patient with an investigational device under this chapter'
  verification_status: confirmed
