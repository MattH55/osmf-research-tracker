  evidence_quote: A healthcare provider must not be required to participate in or pay for a healthcare procedure, treatment, or service that violates the conscience of the healthcare provider.
  verification_status: confirmed
  note: Signed Apr. 2025, effective Apr. 24, 2025 (bill history). "Healthcare procedures, treatments, or services" include dispensing any drug; healthcare professional = any participant. Quote from bill text; adopted amendments concerned other provisions (not verified line-by-line). Also § 68-34-104(5) (contraception).
