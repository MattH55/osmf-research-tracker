  note: Stored false is wrong. 2025 Pub. Ch. 45 (SB 282/HB 192), effective 07/01/2025 per TN bill index, adds individualized investigational treatment (patient-specific, genetic-profile-based; includes ASOs and neoantigen vaccines) for life-threatening or severely debilitating illness. Goldwater's Apr 2026 list of 17 RTT 2.0 states also includes Tennessee. ('lnvestigational' typo is in the OCR'd PDF text.)
