- id: manufacturer_liability_shield
  value: true
  citation: Tenn. Code Ann. § 63-6-308(1)
  source_id: osmf_verification_2026_10
  source_url: https://publications.tnsosfiles.com/acts/109/pub/pc0376.pdf
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: 'Stored false is wrong. ''No private cause of action'' clause (not an immunity), qualified: applies ''if the manufacturer or other person or entity is complying in good faith with the terms of this part and has exercised reasonable care.'' The required informed consent must also include ''A release of liability relative to the treating physician, licensed healthcare providers, hospital, and manufacturer'' (§ 63-6-302(4)(E)). Text checked as enacted in 2015; later amendments not reviewed.'
  evidence_quote: This part does not create a private cause of action against a manufacturer of an investigational drug, biological product, or device or against any other person or entity involved in the care of an eligible patient
  verification_status: corrected
