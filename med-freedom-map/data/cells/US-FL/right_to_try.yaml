  note: '''No private cause of action'' clause (not an immunity), qualified by good-faith compliance and reasonable care.'
  evidence_quote: This section does not create a private cause of action against the manufacturer of an investigational drug, biological product, or device; ... if the manufacturer or other person or entity complies in good faith with the terms of this section and exercises reasonable care.
  verification_status: corrected
