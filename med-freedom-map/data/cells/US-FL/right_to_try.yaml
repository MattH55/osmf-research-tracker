- id: individualized_rtt
  value: false
  citation: Fla. Stat. § 499.0295
  source_id: osmf_verification_2026_10
  source_url: http://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0499/Sections/0499.0295.html
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: 'Florida''s RTT statute covers only classic phase-1-completed investigational products; no individualized-treatment provision in s. 499.0295, and a web search found no enacted Florida ''individualized investigational treatment'' act. Stored note wording (''requires patient-specific manufacturer approval'') does not match the dimension definition (RTT 2.0 individualized treatment act). Corroboration: the Goldwater Institute''s April 2, 2026 release (https://www.goldwaterinstitute.org/west-virginia-enacts-right-to-try-for-individualized-treatments/) lists the 17 enacting states (TX, CO, IA, LA, MD, MS, AZ, NH, NV, NC, AR, TN, SD, KS, IN, GA, WV), and this state is not among them.'
  evidence_quote: “Investigational drug, biological product, or device” means a drug, biological product, or device that has successfully completed phase 1 of a clinical trial but has not been approved for general use
  verification_status: confirmed
- id: manufacturer_liability_shield
