- id: practitioner_scope_limit
  value: Allopathic (ch. 458) and osteopathic (ch. 459) physicians, within their scope of practice, for orthopedics, wound care, or pain management; since June 2026 also podiatric physicians (§ 461.011) for connective tissue, ligament and tendon repair, wound care, or pain management. Cells must come from FDA-registered facilities accredited by NMDP, WMDA, AABB or AATB; signed consent required.
