  value: Fla. Stat. 395.301 imposes a daily fine of $1,000 (capped at $10,000 per estimate) for failure to timely provide a required patient cost estimate, and fines up to $500 per incident for failing to disclose when cost-sharing exceeds the cash price; separate rules (395.3011) bar extraordinary collection actions before itemized bills, insurer adjudication, and other conditions.
