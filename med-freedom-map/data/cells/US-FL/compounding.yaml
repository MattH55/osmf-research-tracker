  citation: Fla. Admin. Code R. 64B16-27.700(3)-(4)
  source_id: osmf_verification_2026_10
  source_url: https://www.flrules.org/gateway/ruleNo.asp?id=64B16-27.700
  source_type: agency_guidance
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: medium
  note: Stored true. Florida expressly permits only veterinary office-use compounding by pharmacies (subsection (3)); human office-use stock must comply with federal 503A/503B, and 503A requires patient-specific prescriptions, so human office use is effectively limited to 503B outsourcing facilities. 2017-18 rulemaking notice described requiring this.
  evidence_quote: 'Human Use Compounded Drug Products: Compounding of drug products and compounding practices such as patient-specific, anticipatory, office stock or office use, and other legally permissible forms, must strictly adhere to relevant federal regulations, including but not limited to 21 USC 353a and 21 USC 353b.'
  verification_status: ambiguous
