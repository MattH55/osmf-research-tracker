  note: 'Stored TRUE is wrong: District of Columbia has no classic RTT law. Code search: full-text search of the official D.C. Council law-xml repository (D.C. Code and enacted laws, github.com/DCCouncil/law-xml) for ''investigational'', ''right to try'', ''eligible patient'' and ''terminal illness'' found no RTT statute; only the Clinical Trials Insurance Coverage Act of 2008 (D.C. Code § 31-2993.01 et seq., routine-cost coverage in approved trials) and insurance appeal provisions. D.C. is not a state and is not counted in the 41-state total. The tracker quote gives the 41-state total but does not itself name the states; the absence finding rests mainly on the code search.'
  evidence_quote: The original Right to Try laws, enacted in 41 states and federally in 2018 , provide a pathway for terminally ill patients to access investigational drugs, biological products, and devices that have completed a Phase 1 clinical trial.
  verification_status: corrected
