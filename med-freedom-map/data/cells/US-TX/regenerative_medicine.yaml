  confidence: high
  evidence_quote: (a) Before receiving an investigational stem cell treatment, an eligible patient must sign a written informed consent.
  verification_status: confirmed
  note: Requirement is a written informed consent on a form adopted by HHSC rule; no posted/advertising notice requirement.
- id: practitioner_scope_limit
