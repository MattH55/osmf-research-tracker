  confidence: high
  evidence_quote: 'Treatment provided under this subchapter must be: (1) administered directly by a physician certified under Subsection (c); (2) overseen by an institutional review board described by Subsection (d);'
  verification_status: confirmed
  note: Physician must be certified by the overseeing IRB; treatment must be provided at a licensed hospital, ambulatory surgical center, or medical school (§ 1003.055(a)(3)).
