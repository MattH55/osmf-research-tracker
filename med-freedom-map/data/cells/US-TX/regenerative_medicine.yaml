  confidence: high
  note: Stem-cell-specific access law (HB 810, 2017; amended HB 3148, 2019) for patients with severe chronic disease or terminal illness; limited to adult stem cell treatments in a clinical trial. 2025 bill HB 5147 was left pending in Senate committee (not enacted).
  evidence_quote: '“Investigational stem cell treatment” means an adult stem cell treatment that: (A) is under investigation in a clinical trial and being administered to human participants in that trial; and (B) has not yet been approved for general use by the United States Food and Drug Administration.'
  verification_status: confirmed
