  note: SB 1137 is a 2021 (87R) act, not 2023. SB 331 (2025) limits applicability to facilities with total gross revenue of $10M or more (new 327.0015) and amends penalties; newly covered facilities have until Aug. 31, 2029. No debt-collection prohibition found in ch. 327.
  evidence_quote: $1,000 for each day the facility violated this chapter, if the facility's total gross revenue is $100,000,000 or more.
  verification_status: confirmed
- id: enforcement_mechanism
  value: Health and Human Services Commission monitors compliance (complaints, website audits), may issue written notice and request a corrective action plan for material violations, and may impose administrative penalties (up to $1,000 per day for facilities with gross revenue of $100M or more) for failure to submit or comply with a corrective action plan (Tex. Health & Safety Code 327.006-327.008).
