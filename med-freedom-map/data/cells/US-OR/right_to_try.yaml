  confidence: high
  note: 'False because no RTT law is in force. Historical note: while in force (2015-2022), § 8(2) was an immunity: ''a manufacturer or distributor of an investigational product used to treat a patient pursuant to section 3 of this 2015 Act is not subject to civil or criminal liability'', except gross negligence (§ 8(3)). Oregon''s only RTT-type law, HB 2300 (2015), Or. Laws 2015 ch. 819, contained a sunset (Section 15) and OLIS states it ''Sunsets Act on January 2, 2022.'' An Oregon Legislature OData search of measure summaries for 2016-2026 sessions found no extension or re-enactment; 2025 HB 3799 (to re-create the method) remained ''In House Committee''.'
  evidence_quote: SECTION 15. This 2015 Act is repealed on January 2, 2022.
  verification_status: confirmed
