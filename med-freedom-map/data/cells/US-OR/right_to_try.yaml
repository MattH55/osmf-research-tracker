  confidence: high
  note: Oregon's only RTT-type law, HB 2300 (2015), Or. Laws 2015 ch. 819, contained a sunset (Section 15) and OLIS states it 'Sunsets Act on January 2, 2022.' An Oregon Legislature OData search of measure summaries for 2016-2026 sessions found no extension or re-enactment; 2025 HB 3799 (to re-create the method) remained 'In House Committee'. So no state RTT statute is in force as of 2026-10-09. Trackers listing Oregon among RTT states reflect the 2015 enactment. Note the 2015 law was also atypical (practitioner-offered treatment, product must be in Phase II or later, Oregon residents 18+).
  evidence_quote: SECTION 15. This 2015 Act is repealed on January 2, 2022.
  verification_status: corrected
