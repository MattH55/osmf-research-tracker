  note: 'The current Illinois Act (sections 1-25, all sourced only to P.A. 99-270) covers only classic phase-I investigational products, with no individualized-treatment provisions. Illinois is not on the reported RTT 2.0 enacting-state list. A separate individualized act elsewhere in the ILCS was not found, but a full search was not possible (web-search budget exhausted). Stored note wording does not match the dimension definition. Corroboration: the Goldwater Institute''s April 2, 2026 release (https://www.goldwaterinstitute.org/west-virginia-enacts-right-to-try-for-individualized-treatments/) lists the 17 enacting states (TX, CO, IA, LA, MD, MS, AZ, NH, NV, NC, AR, TN, SD, KS, IN, GA, WV), and this state is not among them.'
  evidence_quote: '"Investigational drug, biological product, or device" means a drug, biological product, or device that has successfully completed Phase I of a clinical trial, but has not been approved for general use'
  verification_status: confirmed
