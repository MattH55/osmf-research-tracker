  note: The Act has only Sections 1 (title), 5 (findings), 10 (definitions), 15 (availability), 20 (insurance) and 25 (penalty for state officials who block access), plus Medical Practice Act amendments protecting physicians from discipline. There is no clause protecting manufacturers from liability or a private cause of action.
  evidence_quote: Section 15. Availability of drugs, biological products, and devices. (a) A manufacturer of an investigational drug, biological product, or device may make available such drug, product, or device to eligible patients.
