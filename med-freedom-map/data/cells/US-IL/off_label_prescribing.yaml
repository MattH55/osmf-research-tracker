- id: pharmacist_refusal_to_fill_protection
  value: true
  citation: 745 ILCS 70/4 (P.A. 90-246)
  source_id: osmf_verification_2026_10
  source_url: https://www.ilga.gov/legislation/ilcs/fulltext.asp?DocName=074500700K4
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  evidence_quote: No physician or health care personnel shall be civilly or criminally liable ... by reason of his or her refusal to ... participate in any way in any particular form of health care service which is contrary to the conscience
  verification_status: confirmed
  note: General conscience statute covering health care personnel (not pharmacy-specific).
- id: pharmacist_refusal_prohibited
  value: true
  citation: 68 Ill. Adm. Code 1330.500(f)
  source_id: osmf_verification_2026_10
  source_url: https://www.law.cornell.edu/regulations/illinois/Ill-Admin-Code-tit-68-SS-1330.500
  source_type: agency_guidance
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: medium
  note: Stored false. Pharmacy-level duty to deliver (exceptions for clinical judgment, fraud, unavailability). NWLC (July 2025) lists IL among duty-to-dispense states. But individual pharmacists are protected by the Health Care Right of Conscience Act (745 ILCS 70; Morr-Fitz v. Quinn, Ill. App. 2012), so refusal by an individual pharmacist is not flatly prohibited.
  evidence_quote: Pharmacies have a duty to deliver lawfully prescribed drugs to patients and to distribute nonprescription drugs approved by the U.S. Food and Drug Administration for restricted distribution by pharmacies
  verification_status: ambiguous
