  note: Louisiana has no stem-cell-specific authorization or notice statute in the Matthews et al. 2024 enumeration or the Oct-2026 tracker. The Hope for Louisiana Patients Law (La. R.S. 40:1300.71-.79, Acts 2024 No. 750) is a right-to-try-style law for individualized investigational treatments 'unique to and produced exclusively for use for an individual patient, based on his own genetic profile', which expressly includes perinatal-derived products; it is not a general physician authorization for unapproved cell therapy. Stored citation La. R.S. 40:1161.1 could not be located/verified.
  evidence_quote: does not include any drug, biological product, or device derived from human primary or secondary embryonic stem cells ... but does include any drug, biological product, or device derived from human perinatal tissues, cells, and secreted factors
