  confidence: high
  note: '''No private cause of action'' clause (not an immunity) for manufacturers, covering any harm done to the eligible patient resulting from the investigational product; no good-faith qualifier. Subsection A separately gives prescribing physicians immunity from civil liability (Acts 2016, No. 355).'
  evidence_quote: Nothing in this Section shall be construed as creating a cause of action by or on behalf of any person against a manufacturer of an investigational drug, biological product, or device
