- id: enforcement_mechanism
  value: The 'health and human services commission' monitors hospital compliance (complaints, website audits), may issue written notice and request corrective action plans for material violations, and may impose and publicize administrative penalties for failure to submit or follow a plan, capped at $10/day (gross revenue under $10M), $100/day ($10M to under $100M) or $1,000/day ($100M or more), each day a separate violation (R.I. Gen. Laws 23-103-6 to 23-103-8).
