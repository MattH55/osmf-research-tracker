- id: rtt_enacted
  value: true
  citation: Neb. Rev. Stat. §§ 71-9601 to 71-9611 (Investigational Drug Use Act)
  source_id: osmf_verification_2026_10
  source_url: https://nebraskalegislature.gov/laws/statutes.php?statute=71-9601
  source_type: primary_statute
  verified_on: '2026-10-09'
