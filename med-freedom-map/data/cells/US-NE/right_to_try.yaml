  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: Only the classic phase-one RTT act exists. Keyword searches of the Nebraska Revised Statutes (nebraskalegislature.gov) for 'individualized investigational' returned no sections; 'Investigational Drug Use Act' returns only the 2018 act and cross-references. Nebraska is not in the reported list of individualized-RTT states.
  evidence_quote: Investigational drug, biological product, or device means any drug, biological product, or device that has successfully completed phase one of a clinical trial but has not yet been approved for general use
