  confidence: high
  note: Nebraska's RTT law is titled the Investigational Drug Use Act. Eligibility is an 'advanced illness' that would likely result in death within six months (§ 71-9602(1)); investigational product must have completed phase one (§ 71-9602(4)).
  evidence_quote: Sections 71-9601 to 71-9611 shall be known and may be cited as the Investigational Drug Use Act. Source Laws 2018, LB117, § 1.
  verification_status: confirmed
