  note: '''No private cause of action'' clause (not immunity), also covering other persons/entities involved in care; conditioned on having ''complied in good faith with the terms of the act''. No separate reasonable-care proviso.'
  evidence_quote: The Investigational Drug Use Act does not create a private cause of action against a manufacturer of an investigational drug, biological product, or device
