- id: manufacturer_liability_shield
  value: true
  citation: O.C.G.A. § 31-52-10(a)
  source_id: osmf_verification_2026_10
  source_url: https://unicourt.github.io/cic-code-ga/transforms/ga/ocga/r72/gov.ga.ocga.title.31.html
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: '''No private cause of action'' clause (not an immunity), qualified by good faith and reasonable care. § 31-52-10(b) separately bars liability of treating persons/entities absent failure to obtain informed consent. Text is from the code as enacted in 2016; SB 72 (2025) amended § 31-52-10, and the post-2025 wording was not reviewed, though the official summary says the Act ''limits the causes of action'' rather than removing them.'
  evidence_quote: This chapter shall not be construed to create a private cause of action against a manufacturer of an investigational drug, biological product, or device ... if the manufacturer ... is complying in good faith
  verification_status: corrected
