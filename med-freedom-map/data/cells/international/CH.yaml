- id: practitioner_licensure_recognition
  value: Admission to practise regulated by cantons (cantonal licence); MedReg registration mandatory; EU/EFTA diplomas eligible for direct MEBEKO recognition under the Swiss-EU free movement agreement
  citation: Medical Professions Act (MedBG, SR 811.11); FOPH MEBEKO EU/EFTA recognition page
  source_id: osmf_verification_2026_10
  source_url: https://www.bag.admin.ch/de/gesuch-einreichen-fuer-ein-diplom-der-medizinalberufe-aus-einem-eu-efta-staat
  source_type: agency_guidance
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  evidence_quote: Die Prüfung und Anerkennung erfolgt durch die Medizinalberufekommission (MEBEKO). ... Das Personenfreizügigkeitsabkommen (FZA) zwischen der Schweiz und den EU/EFTA-Staaten erleichtert die berufliche Mobilität ... Die Zulassung zur Berufsausübung wird kantonal geregelt.
