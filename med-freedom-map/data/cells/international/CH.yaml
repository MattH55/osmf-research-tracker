  citation: Swiss Criminal Code art. 115; FOJ euthanasia page; Swissmedic ATMP page
  source_id: osmf_verification_2026_10
  source_url: https://www.bj.admin.ch/en/the-various-forms-of-euthanasia
  source_type: agency_guidance
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: '''High-end concierge medicine'' dropped (no source). Cell-therapy clause supported by Swissmedic ATMP page https://www.swissmedic.ch/swissmedic/en/home/humanarzneimittel/besondere-arzneimittelgruppen--ham-/innovation.html: ''Advanced therapy medicinal products include transplant products according to the Transplantation Act'' (examples listed: somatic cell therapy, tissue-engineered products). FOJ page is an archived legislative page; art. 115 still in force.'
  evidence_quote: According to Article 115 of the Swiss Penal Code, only a person motivated by self-serving ends who helps another to commit suicide (e.g. by obtaining a lethal substance) will be punished by imprisonment for up to five years, or by pecuniary penalty.
