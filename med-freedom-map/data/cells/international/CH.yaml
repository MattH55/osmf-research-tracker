  evidence_quote: Private individuals may import up to one month's supply of medicinal products that are not narcotics ... One month's supply refers to the prescription by the doctor or the dosage recommendation in the package leaflet.
  verification_status: corrected
  note: 1-month limit confirmed. 'EU mutual recognition' dropped (not stated by a source read). Narcotic-containing medicines separately limited to 30 days' treatment per Swissmedic travellers page (search lead, not fetched). Healthcare professionals may import small quantities of unauthorised ready-to-use medicines licence-free (Swissmedic special-authorisation page).
- id: malpractice_regime
  value: Practitioners working under own professional responsibility must hold professional liability insurance proportionate to their risks, unless state liability law applies (MedBG art. 40(h))
