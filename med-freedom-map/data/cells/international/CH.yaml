  note: 'MedReg mandatory per https://www.bag.admin.ch/en/medreg-register-of-medical-professions: ''anyone exercising a medical profession requiring a university qualification who works in Switzerland ... must be recorded in the register of medical professions''; ''Professional licences granted by the cantonal authorities''. Original ''streamline'' replaced with the documented direct-recognition route.'
- id: import_rules
