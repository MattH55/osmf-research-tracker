- id: malpractice_regime
  value: Medical Liability Committees examine complaints, with challenges to a Medical Liability Supreme Committee; civil liability insurance against medical errors mandatory to practise (Federal Decree-Law No. 4 of 2016)
  citation: Federal Decree-Law No. 4 of 2016 on Medical Liability, arts. 18, 21, 25
  source_id: osmf_verification_2026_10
  source_url: https://www.dha.gov.ae/uploads/112021/d759f988-571f-43b3-87ab-877e770b31ca.pdf
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  evidence_quote: a committee called "Medical Liability Committee" composed of the physicians specialized in all medical specializations shall be formed. ... Practicing of the Profession in the State is prohibited without first obtaining civil liability insurance against medical errors
  verification_status: corrected
  note: Art. 21 creates 'The Medical Liability Supreme Committee' to examine complaints against committee reports. Law listed as in force on u.ae 'Health strategies, policies and laws' page. 'DIFC courts for free zone disputes' (DIFC is a financial free zone, not DHCC) and 'arbitration common' unsupported; dropped.
