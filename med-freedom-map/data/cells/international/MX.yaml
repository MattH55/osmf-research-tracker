jurisdiction: MX
layer: international_access
dimensions:
- id: treatment_availability
  value: Stem cell and regenerative medicine establishments require a sanitary licence (LGS art. 315)
  citation: Ley General de Salud art. 315 (fr. V-VI)
  source_id: osmf_verification_2026_10
  source_url: https://www.diputados.gob.mx/LeyesBiblio/pdf/LGS.pdf
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: Original listed stem cell therapies, off-label pharmaceuticals and alternative cancer treatments as available; no official source read states availability of off-label or alternative cancer treatments, so dropped. Stem cells supported only as a licensed establishment category.
  evidence_quote: 'Artículo 315. Los establecimientos de salud que requieren de licencia sanitaria son los dedicados a: ... V. La disposición de células troncales, y VI. Los establecimientos de medicina regenerativa.'
  verification_status: corrected
- id: practitioner_licensure_recognition
  value: Practice of medicine requires a professional title legally issued and registered by the competent education authorities (cédula profesional via SEP Dirección General de Profesiones), not COFEPRIS
  citation: Ley General de Salud art. 79
  source_id: osmf_verification_2026_10
  source_url: https://www.diputados.gob.mx/LeyesBiblio/pdf/LGS.pdf
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  evidence_quote: Para el ejercicio de actividades profesionales en el campo de la medicina ... se requiere que los títulos profesionales o certificados de especialización hayan sido legalmente expedidos y registrados por las autoridades educativas competentes.
  verification_status: corrected
  note: SEP role supported by https://www.gob.mx/cedulaprofesional privacy notice ('a través de la Dirección General de Profesiones ... de la Secretaría de Educación Pública', used to register the degree and issue the cédula). 'COFEPRIS registration', 'state-level variations' and 'facilitators assist' not supported; dropped.
- id: import_rules
  value: Sanitary authorization from the Secretaría de Salud (COFEPRIS) required to import medicines and their raw materials
  citation: Ley General de Salud art. 295
  source_id: osmf_verification_2026_10
  source_url: https://www.diputados.gob.mx/LeyesBiblio/pdf/LGS.pdf
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  evidence_quote: se requiere autorización sanitaria expedida por la Secretaría de Salud para la importación de los medicamentos y sus materias primas, equipos médicos, prótesis ... que determine el Secretario, mediante acuerdo publicado en el Diario Oficial de la Federación.
  verification_status: corrected
  note: COFEPRIS is the Secretaría de Salud's deconcentrated sanitary-risk organ (LGS art. 17 bis). Personal-import allowance not found in LGS (likely in Reglamento de Insumos para la Salud, not verified); dropped.
- id: malpractice_regime
  value: CONAMED (Secretaría de Salud) resolves patient-provider disputes via conciliation, mediation and arbitration; coordinates with state medical arbitration commissions (LGS arts. 60 Bis-60 Sexies, added 2026)
  citation: Ley General de Salud arts. 60 Bis-60 Sexies (added DOF 15-01-2026)
  source_id: osmf_verification_2026_10
  source_url: https://www.diputados.gob.mx/LeyesBiblio/pdf/LGS.pdf
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  evidence_quote: Tiene por objeto contribuir a resolver los conflictos suscitados entre las personas usuarias y los prestadores de servicios de salud, a través de los mecanismos alternativos de solución de controversias
  verification_status: corrected
  note: Art. 60 Ter lists gestión inmediata, conciliación, mediación, arbitraje; art. 60 Sexies mentions 'las comisiones estatales de arbitraje médico'. Original 'COFEPRIS complaints; state medical boards; variable enforcement' unsupported - medical complaints go to CONAMED, not COFEPRIS.
