- id: treatment_availability
  value: Próspera ZEDE rules let health providers use any product approved by Honduras or listed peer-country regulators; ZEDE regime repealed (2022) and declared unconstitutional by the Supreme Court (Sep 2024), so its status is contested
  citation: Próspera ZEDE Health Industry rules; CSJ Honduras ruling 20 Sep 2024
  source_id: osmf_verification_2026_10
  source_url: https://pzgps.hn/health-industry/
  source_type: agency_guidance
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: medium
  note: '''Stem cell therapies, experimental biologics, peptide treatments'' not stated by the official page; dropped. Honduras'' Supreme Court ruled on 20 Sep 2024 (8-7) that the ZEDE law violates the Constitution, with retroactive effect (El Mundo, https://elmundo.hn/desestiman-demanda-de-zedes-en-el-ciadi-a-honduras/ : ''el 20 de septiembre de 2024, la Corte Suprema de Honduras decidió por ocho votos a favor y siete en contra''; ''con efecto retroactivo''). ZEDE law repealed by Congress April 2022 (per Wikipedia lead citing LA Times; LA Times/Reuters not fetchable). Próspera still publishes rules and claims legal stability; ICSID claim pending. ZEDE-specific facts therefore legally contested.'
  evidence_quote: may utilize (in the manner approved) any pharmaceutical, medical device, medical procedure, or biological agent ... that has been approved for use by the governing regulatory authority(ies) of Honduras or any of the foregoing
  verification_status: ambiguous
