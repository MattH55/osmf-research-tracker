- id: treatment_availability
  value: Stem cell, gene, immunotherapy, regenerative and longevity therapies approved under the Longevity and Regenerative Therapies Act 2024 (in force 1 Sep 2024; replaced Stem Cell Research and Therapy Act 2013); providers must be licensed health care facilities
  citation: Longevity and Regenerative Therapies Act, 2024 ss. 2, 3, 20, 26; Appointed Day Notice S.I. 73 of 2024
  source_id: osmf_verification_2026_10
  source_url: https://laws.bahamas.gov.bs/cms/images/LEGISLATION/PRINCIPAL/2024/2024-0051/2024-0051_1.pdf
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: 'Act defines ''regenerative therapy'' (cell therapy, immunotherapy, tissue engineering, stem cell products) and ''gene therapy''. s.20(1): ''Any healthcare facility used for the purpose of providing therapy or conducting research shall be licensed as a healthcare facility in accordance with the provisions of the Hospitals and Health Care Facilities Act''. Appointed day 1 Sept 2024 per S.I. 73/2024 (https://laws.bahamas.gov.bs/cms/images/LEGISLATION/SUBORDINATE/2024/2024-0073/2024-0073_1.pdf). PDF text layer is garbled (overlaid with another Act); quotes read from rendered page images. ''Exosome treatments'', ''wellness'' and ''limited oversight'' not stated; dropped.'
  evidence_quote: The purpose of this Act is — (a) to create in the Commonwealth of The Bahamas a legal framework for research and approval of therapies, as defined in this Act ... 26. Repeal. The Stem Cell Research and Therapy Act (Ch. 235B) is repealed.
  verification_status: corrected
- id: practitioner_licensure_recognition
  value: Bahamas Medical Council registration required to practise; temporary registration up to six months for qualified practitioners residing temporarily in The Bahamas
  citation: Medical Act (Ch. 224) ss. 15, 22
  source_id: osmf_verification_2026_10
  source_url: https://laws.bahamas.gov.bs/cms/images/LEGISLATION/PRINCIPAL/2014/2014-0029/2014-0029_2.pdf
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  evidence_quote: 15. (1) No person shall practice medicine or surgery unless he is registered by the Council under this Act. ... 22. (1) The Council or the Registrar may register, temporarily, for a period not exceeding six months
  verification_status: corrected
  note: 's.22(1)(b): applicant must satisfy the Council ''that he is residing temporarily in The Bahamas and would otherwise qualify for registration''. ''Relatively streamlined for medical tourism practitioners'' is a marketing characterisation; dropped.'
- id: import_rules
  value: Drug imports require Bahamas Pharmacy Council approval of manufacturer and product documentation, shown to customs on import
  citation: Pharmacy (Import and Export) Regulations reg. 3; Pharmacy Act (Ch. 227) s. 28
  source_id: osmf_verification_2026_10
  source_url: https://laws.bahamas.gov.bs/cms/images/LEGISLATION/SUBORDINATE/2010/2010-0006/2010-0006_2.pdf
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  evidence_quote: Any person who desires to import or export any drugs for the purposes of the Act shall submit to the Council for approval the following supporting documentation ... Evidence of approval granted under paragraph (1) shall be produced to the customs officer upon import or export
  verification_status: corrected
  note: Regulator is the Bahamas Pharmacy Council (Pharmacy Act Part II), not a 'Pharmacy Board'. 'Medical tourism operators often manage logistics' unsupported; dropped. Under the 2024 LRT Act the Board also regulates storage and shipping of therapies into The Bahamas (s.25 regulation-making power).
