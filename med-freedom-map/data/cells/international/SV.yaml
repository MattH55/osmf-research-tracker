  value: Authorisation to practise from the Junta de Vigilancia de la Profesión Médica; foreign-trained doctors need degree incorporation at the Universidad de El Salvador, residence, and proof of reciprocity
  citation: Código de Salud arts. 5, 306
  source_id: osmf_verification_2026_10
