  confidence: high
  evidence_quote: Los extranjeros, además de cumplir con los requisitos anteriores, deberán comprobar que en el país donde obtuvieron el título, los salvadoreños o los graduados en El Salvador, pueden ejercer la profesión en análogas circunstancias.
