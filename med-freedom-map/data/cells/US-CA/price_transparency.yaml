  note: 'California''s state hospital price disclosure law predates the CMS rule: hospitals must make their chargemaster available and file annually (July 1) with HCAI a chargemaster, average charges for 25 common outpatient procedures, and estimated gross revenue change. Turquoise Health tracker (7/2024) lists California ''No'' because it tracks only post-2019 legislation. AB 1092 not verified.'
