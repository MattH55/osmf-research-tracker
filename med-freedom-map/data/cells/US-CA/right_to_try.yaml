- id: manufacturer_liability_shield
  value: true
  citation: Cal. Health & Safety Code § 111548.5
  source_id: osmf_verification_2026_10
  source_url: https://www.leginfo.ca.gov/pub/15-16/bill/asm/ab_1651-1700/ab_1668_bill_20160927_chaptered.htm
