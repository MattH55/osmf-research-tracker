  confidence: medium
  note: Absence supported by a peer-reviewed review enumerating state stem-cell laws (CA, WA, VT awareness laws; TX, NC, MS access laws). Later enactments verified from primary sources in this pass (UT 2024/2026, MT 2025 general RTT, TN 2026, WY 2026) do not include this state; a 2026 commercial tracker (savemyfat.com, Aug 2026; lead only) lists eleven states with stem-cell statutes, none of them this state.
  evidence_quote: 'These state laws can be grouped into two types: 1) laws aiming to improve patient awareness (found in California, Washington, and Vermont), and 2) laws focused on increasing patient access to untested SCIs (found in Texas, North Carolina, and Mississippi).'
