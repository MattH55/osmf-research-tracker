  note: Coverage is permissive. The insurer may deny coverage for up to six months after use ends, except for preexisting conditions and previously commenced benefits (§ 16-51-4(e)).
  evidence_quote: A health insurance carrier may, but is not required by this article to, provide coverage for the cost of an investigational drug, biological product or device.
