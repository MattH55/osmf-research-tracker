- id: individualized_rtt
  value: true
  citation: W. Va. Code § 16-51-3, as amended by Enr. Com. Sub. H.B. 4610 (2026), Acts 2026 ch. 183
  source_id: osmf_verification_2026_10
  source_url: https://www.wvlegislature.gov/Bill_Status/bills_text.cfm?billdoc=hb4610%20sub1%20enr.htm&yr=2026&sesstype=RS&i=4610
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: 'Stored false is wrong. HB 4610 ''Safeguard the Right-To-Try Cutting-Edge Medicine Act'' (''relating to the right to try individualized treatments'') expands eligibility to life-threatening or severely debilitating illness and adds individualized treatments to the definition. Bill history page (https://www.wvlegislature.gov/Bill_Status/bills_history.cfm?input=4610&year=2026&sessiontype=RS&btype=bill): ''Approved by Governor 4/1/2026''; ''Chapter 183, Acts, Regular Session, 2026''; effective June 12, 2026. The code site''s § 16-51-3 had not yet been checked for the update.'
  evidence_quote: a drug, biological product, or device that is unique and produced exclusively for use for an individual patient, based on their own genetic profile, including individualized gene therapy antisense oligonucleotides and individualized neoantigen vaccines
  verification_status: corrected
- id: manufacturer_liability_shield
  value: true
  citation: W. Va. Code § 16-51-7
  source_id: osmf_verification_2026_10
  source_url: https://code.wvlegislature.gov/16-51-7/
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: 'Stored false is wrong. This is a ''no private cause of action'' clause, not an express immunity, and it is qualified: ''so long as the manufacturer, health care provider, or other person or entity is complying in good faith with the terms of this article.'''
  evidence_quote: This article does not create a private cause of action against a manufacturer of an investigational drug, biological product or device ... for any harm done to the eligible patient resulting from the investigational drug
  verification_status: corrected
- id: insurer_coverage_required
