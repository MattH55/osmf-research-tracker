- id: enforcement_mechanism
  value: Hospitals must file their current pricemaster with the Office of Health Strategy's Health Systems Planning Unit; if a detailed patient bill does not agree with the filed schedule of charges, the hospital is subject to a civil penalty of $500 per occurrence and may be ordered to adjust the bill (Conn. Gen. Stat. 19a-681).
