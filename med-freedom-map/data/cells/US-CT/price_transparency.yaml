  note: Connecticut requires hospitals to file their pricemaster (chargemaster) with the Office of Health Strategy's Health Systems Planning Unit and to bill consistently with it; this is an older chargemaster-filing/billing-accuracy law rather than a codification of the CMS rule. No reference to 45 CFR Part 180 or price transparency found in ch. 368z. SB 1203 (collection ban) listed as only introduced by Turquoise tracker (7/2024).
  evidence_quote: Each hospital shall file with the unit its current pricemaster which shall include each charge in its detailed schedule of charges.
