- id: pharmacist_refusal_to_fill_protection
  value: false
  citation: Colo. Rev. Stat. § 25-6-102(9)
  source_id: osmf_verification_2026_10
  source_url: https://codes.findlaw.com/co/title-25-health/co-rev-st-sect-25-6-102/
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: medium
  evidence_quote: '... shall be prohibited from refusing to provide contraceptive procedures, supplies, and information ...'
  verification_status: ambiguous
  note: Subsection (9) protects private institutions and physicians (and their agents/employees) refusing contraception on religious or conscientious grounds; pharmacists are not named. Guttmacher (Sept. 2026) counts CO as permitting individual-provider contraception refusal. Not a pharmacist-specific protection; kept false.
