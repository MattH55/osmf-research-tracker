  note: Quote is the official bill summary on the General Assembly site (ellipsis omits 'by the patient on the date or dates of service'). SB23-252 added HCPF performance assessments and deceptive-trade-practice enforcement.
  evidence_quote: The act prohibits a hospital or other person or entity collecting on behalf of the hospital from initiating or pursuing collection actions against a patient or patient guarantor for debt incurred ... when the hospital was not in material compliance with federal hospital price transparency laws.
  verification_status: confirmed
- id: enforcement_mechanism
  value: Hospitals not in material compliance with federal price transparency rules may not initiate or pursue collection actions against patients; patients may sue, and a noncompliant hospital is subject to a penalty equal to the debt and must refund amounts paid (HB22-1285). HCPF conducts performance assessments of each hospital's adherence, and violations are a deceptive trade practice (SB23-252).
  citation: Colo. HB22-1285 (2022); SB23-252 (2023)
  source_id: osmf_verification_2026_10
  source_url: https://leg.colorado.gov/bills/sb23-252
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  evidence_quote: Makes a violation of the hospital transparency requirements outlined in the act a deceptive trade practice
  verification_status: corrected
  note: 'Stored ''hospital licensing sanctions; civil monetary penalties'' not supported. HB22-1285 summary: ''the hospital is subject to a penalty equal to the amount of the debt'' and ''must refund any amount paid on the debt''. SB23-252 summary: HCPF to ''conduct a performance assessment for each hospital to determine the hospital''s adherence to federal transparency rules''. No licensing sanction found.'
