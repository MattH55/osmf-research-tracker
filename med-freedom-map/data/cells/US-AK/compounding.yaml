- id: anticipatory_compounding_limit
  value: Limited quantities may be compounded before a prescription only with a historical basis of valid prescription orders within an established pharmacist-patient-prescriber relationship; amounts above that basis are manufacturing.
  citation: 12 AAC 52.440; Good Compounding Practices (a); AS 08.80.480 (definition of compounding)
  source_id: osmf_verification_2026_10
  source_url: https://www.commerce.alaska.gov/web/portals/5/pub/PharmacyStatutes.pdf
  source_type: agency_guidance
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  evidence_quote: A pharmacist may compound drugs in limited quantities before receiving a valid prescription drug order if the pharmacist has a historical basis of valid prescription drug orders generated solely within an established relationship between the pharmacist, a patient, and a prescribing practitioner
  verification_status: corrected
  note: Statutory definition also covers preparation in anticipation of orders based on routine, regularly observed prescribing patterns.
