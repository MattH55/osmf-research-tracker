- id: pharmacist_refusal_to_fill_protection
  value: false
  citation: Ky. Rev. Stat. § 311.800(4)
  source_id: osmf_verification_2026_10
  source_url: https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=30643
  source_type: primary_statute
  verified_on: '2026-10-09'
