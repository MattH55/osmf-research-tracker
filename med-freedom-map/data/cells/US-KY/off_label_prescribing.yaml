  confidence: medium
  evidence_quote: No physician, nurse staff member or employee of a public or private hospital or employee of a public or private health care facility, who shall state in writing ... his objection to performing, participating in, or cooperating in, abortion
  verification_status: ambiguous
  note: Stored true. Only an abortion-specific refusal right for hospital/facility staff; pharmacists and dispensing are not addressed (2001 SB 160 proposed adding pharmacists; current text does not). Guttmacher (Sept. 2026) lists no other KY refusal statute. Not a pharmacist refusal-to-fill protection.
