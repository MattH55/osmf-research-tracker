  citation: 2015 Wyo. Sess. Laws, SF0003 (Enrolled Act No. 76), creating W.S. 35-7-1801 through 35-7-1806
  source_id: osmf_verification_2026_10
  source_url: https://wyoleg.gov/2015/Enroll/SF0003.pdf
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  evidence_quote: ENROLLED ACT NO. 76, SENATE SIXTY-THIRD LEGISLATURE OF THE STATE OF WYOMING 2015 GENERAL SESSION
  verification_status: confirmed
  note: The enrolled act states 'W.S. 35-7-1801 through 35-7-1806 are created' (Article 18, Right to Try Act). The LSO bill API for 2015 lists SF0003 'Right to try.' with last action 'Assigned Chapter Number' on 2015-03-12. The enrolled PDF has a blank approval-date line, so the exact signing date was not verified; the year is 2015.
- id: individualized_rtt
  value: false
  citation: Wyo. Stat. § 35-7-1802(a)(ii)
  source_id: osmf_verification_2026_10
  source_url: https://wyoleg.gov/statutes/compress/title35.pdf
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: Stored true is not supported. The current Right To Try Act (Title 35 compiled May 2026, after the 2026 session) covers only Phase-1-completed products for terminal illness and has no individualized/genetic-profile provisions. The Wyoming LSO bill lists for 2023-2026 (wyoleg.gov LsoService API) show no bill mentioning investigational drugs, right to try or individualized treatment. Wyoming is not among the reported RTT 2.0 states.
  evidence_quote: '"Investigational drug, biological product or device" means a drug, biological product or device that has successfully completed phase one of a clinical trial but has not yet been approved for general use'
  verification_status: corrected
- id: manufacturer_liability_shield
  value: true
  citation: Wyo. Stat. § 35-7-1806
  source_id: osmf_verification_2026_10
  source_url: https://wyoleg.gov/statutes/compress/title35.pdf
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: This is a 'no private cause of action' clause, not an express immunity, with a good-faith compliance qualifier. Unlike the model text, it does not say 'for any harm done to the eligible patient'.
  evidence_quote: This article does not create a private cause of action against a manufacturer of an investigational drug, biological product or device ... so long as the manufacturer or other person or entity is complying in good faith with the terms of this article.
  verification_status: confirmed
- id: insurer_coverage_required
  value: false
  citation: Wyo. Stat. § 35-7-1803(b)
  source_id: osmf_verification_2026_10
  source_url: https://wyoleg.gov/statutes/compress/title35.pdf
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: Coverage is permissive only; § 35-7-1803(c) says nothing expands the coverage in W.S. 26-20-301.
  evidence_quote: A health care insurer may, but is not required to, provide coverage for the cost of an investigational drug, biological product or device.
  verification_status: confirmed
