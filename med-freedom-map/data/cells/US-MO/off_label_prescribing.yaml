- id: board_discipline_protection
  value: true
  citation: Mo. Rev. Stat. § 334.100.8 (healing arts board); see also § 338.055.7 (pharmacy board), A.L. 2022 H.B. 2149
  source_id: osmf_verification_2026_10
  source_url: https://revisor.mo.gov/main/OneSection.aspx?section=334.100
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: Drug-specific protection (ivermectin/HCQ only), not a general off-label protection.
  evidence_quote: The act of lawfully dispensing, prescribing, administering, or otherwise distributing ivermectin tablets or hydroxychloroquine sulfate tablets for human use shall not be grounds for denial, suspension, revocation, or other disciplinary action by the board.
  verification_status: corrected
- id: pharmacist_refusal_to_fill_protection
  value: false
  citation: Mo. Rev. Stat. § 197.032
  source_id: osmf_verification_2026_10
  source_url: https://revisor.mo.gov/main/OneSection.aspx?section=197.032
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  evidence_quote: No physician or surgeon, registered nurse, practical nurse, midwife or hospital, public or private, shall be required to treat or admit for treatment any woman for the purpose of abortion
  verification_status: corrected
  note: Stored true. Only abortion refusal law; pharmacists not covered. Repeated pharmacist-conscience bills (e.g., HB 2043 (2000), SB 1119 (2004)) not enacted; RSMo ch. 338 has no refusal section. Guttmacher (Sept. 2026) lists only § 197.032 and RFRA for MO.
- id: pharmacist_refusal_prohibited
  value: false
  citation: Mo. Rev. Stat. § 338.055.7 (A.L. 2022 H.B. 2149)
  source_id: osmf_verification_2026_10
  source_url: https://revisor.mo.gov/main/OneSection.aspx?section=338.055
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: medium
  note: Statute restricts pharmacist speech about ivermectin/HCQ but does not expressly prohibit refusal; that speech clause was preliminarily enjoined by a federal court in March 2025 (news report).
  evidence_quote: A pharmacist shall not contact the prescribing physician or the patient to dispute the efficacy of ivermectin tablets or hydroxychloroquine sulfate tablets for human use unless the physician or patient inquires
  verification_status: ambiguous
