  confidence: high
  note: 'This is an immunity: such a person ''shall not be liable in any action under state law'' for loss or injury from the design, manufacture, use, safety or effectiveness of the drug or device. It is stronger than a ''no private cause of action'' clause. It excludes gross negligence and willful misconduct.'
  evidence_quote: Except in the case of gross negligence or willful misconduct, any person who manufactures, imports, distributes, prescribes, dispenses, or administers an investigational drug or device to an eligible patient
