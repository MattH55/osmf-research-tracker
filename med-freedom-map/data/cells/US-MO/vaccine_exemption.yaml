- id: religious_exemption
  value: true
  citation: RSMo 167.181.3
  source_id: osmf_verification_2026_10
  source_url: https://revisor.mo.gov/main/OneSection.aspx?section=167.181
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: Missouri allows religious exemptions to school vaccination requirements.
  evidence_quote: This section shall not apply to any child if one parent or guardian objects in writing to his school administrator against the immunization of the child, because of religious beliefs or medical contraindications.
  verification_status: confirmed
