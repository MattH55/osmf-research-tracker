- id: manufacturer_liability_shield
  value: true
  citation: Wis. Stat. § 450.137(4)(b)
  source_id: osmf_verification_2026_10
  source_url: https://docs.legis.wisconsin.gov/statutes/statutes/450/137
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: 'Stored false is wrong. This is an immunity-type clause (''may not be held liable in any action under state law'') covering design, manufacture, labeling and lack of safety or effectiveness. It is qualified: the manufacturer must act lawfully, consistent with the section, and exercise reasonable care.'
  evidence_quote: Any manufacturer, distributor, pharmacist, practitioner, health care facility, or other person who lawfully makes available ... an investigational drug ... and who in doing so exercises reasonable care, may not be held liable in any action under state law
  verification_status: corrected
