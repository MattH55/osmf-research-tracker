  note: Minnesota's 'Hospital Pricing Transparency' statute requires hospitals and outpatient surgical centers to give a written cost estimate on request (subd. 3); this is a state requirement beyond the federal rule, but it is an estimate-on-request law, not a codification of the federal posting rule. SF 220 (2023), which would have codified machine-readable-file posting with daily fines and license suspension, was not enacted (statute history ends 2022). 62J.824 is a facility-fee disclosure law.
