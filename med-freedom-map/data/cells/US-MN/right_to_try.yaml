- id: manufacturer_liability_shield
  value: false
  citation: Minn. Stat. § 151.375, subd. 8
  source_id: osmf_verification_2026_10
  source_url: https://www.revisor.mn.gov/statutes/cite/151.375
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: 'Subd. 8 (Liability) is a ''no separate private cause of action'' clause limited to health care providers and entities involved in the patient''s care, conditioned on compliance with the section. Unlike the Goldwater model, it omits ''a manufacturer''. No other clause protects manufacturers, so FALSE for manufacturers. Borderline: ''entity involved in the care'' could be argued to reach a manufacturer, but the text does not say so.'
  evidence_quote: Nothing in this section shall create a separate private cause of action against any health care provider or entity involved in the care of an eligible patient using an investigational drug, biological product, or device
  verification_status: confirmed
