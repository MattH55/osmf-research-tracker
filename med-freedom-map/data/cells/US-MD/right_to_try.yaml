  note: Original Maryland Right to Try Act, 2017 Regular Session, Chapter 771 (crossfile SB 572). Earlier 2016 bills HB 56 and SB 63 were withdrawn. The act was converted to an individualized-treatment act in 2024 (Ch. 960).
- id: individualized_rtt
  value: true
  citation: Md. Code, Health-Gen. § 21-2B-01(f); 2024 Md. Laws Ch. 960 (HB 676)
  source_id: osmf_verification_2026_10
  source_url: https://mgaleg.maryland.gov/mgawebsite/Laws/StatuteText?article=ghg&section=21-2B-01&enactments=false
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: Maryland enacted 'Right to Try Act - Individualized Investigational Treatments' (HB 676, approved by the Governor as Chapter 960, 2024). It covers individualized gene therapy, ASOs and neoantigen vaccines for life-threatening or severely debilitating illness. The stored FALSE is wrong, and the stored note's wording is also wrong.
  evidence_quote: “Individualized investigational treatment” means a drug, biological product, or device that is unique to and produced exclusively for use by an individual based on the genetic profile of the individual.
  verification_status: corrected
- id: manufacturer_liability_shield
  value: true
  citation: Md. Code, Health-Gen. § 21-2B-05
  source_id: osmf_verification_2026_10
  source_url: https://mgaleg.maryland.gov/mgawebsite/Laws/StatuteText?article=ghg&section=21-2B-05&enactments=false
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: '''No private cause of action'' clause (not an immunity), conditioned on the manufacturer ''complying in good faith with this subtitle'' and having ''exercised reasonable care''. Ch. 960 of 2024 shows the same clause existed for investigational drugs in the 2017 classic version.'
  evidence_quote: This subtitle does not create a private cause of action against a manufacturer of an individualized investigational treatment or against another person involved in the care of an eligible patient
  verification_status: corrected
