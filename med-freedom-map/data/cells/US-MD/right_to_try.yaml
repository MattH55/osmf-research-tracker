- id: rtt_enacted
  value: true
  citation: Md. Code, Health-Gen. §§ 21-2B-01 to 21-2B-06 (2017 Md. Laws Ch. 771, as amended by 2024 Md. Laws Ch. 960)
  source_id: osmf_verification_2026_10
  source_url: https://mgaleg.maryland.gov/mgawebsite/Legislation/Details/hb0676?ys=2024RS
  source_type: agency_guidance
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: medium
  note: Maryland enacted a classic Right to Try Act in 2017 (HB 584, Ch. 771). Ch. 960 of 2024 (HB 676) repealed and reenacted §§ 21-2B-01 to -06. It deleted the classic 'investigational drug, biological product, or device' (phase-one) definition and replaced it with 'individualized investigational treatment'. The current subtitle still sits under the Right to Try Act but covers only individualized treatments for life-threatening or severely debilitating illness. Under the strict definition (a classic phase-1 RTT statute in force) the answer would be FALSE today. Best value TRUE because a state RTT act was enacted and remains in force in modified form.
  evidence_quote: Altering certain provisions of law authorizing certain activity by manufacturers of investigational drugs, biological products, or devices under the Right to Try Act to apply to manufacturers of certain individualized investigational treatments
  verification_status: ambiguous
