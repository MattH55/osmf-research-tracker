- id: manufacturer_liability_shield
  value: true
  citation: S.C. Code Ann. § 44-137-60
  source_id: osmf_verification_2026_10
  source_url: https://www.scstatehouse.gov/code/t44c137.php
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: 'Stored false is wrong. § 44-137-60 is a ''no private right of action'' clause (not an immunity), qualified: applies ''as long as the manufacturer or other person or entity has made a good-faith effort to comply with the provisions of this chapter and has exercised reasonable care''.'
  evidence_quote: No private right of action may be brought against a manufacturer of an investigational drug, biological product, or device, or against any other person or entity involved in the care of an eligible patient
  verification_status: corrected
