- id: individualized_rtt
  value: true
  citation: N.H. Rev. Stat. Ann. § 126-Z:1, I-c; § 126-Z:3, III(e)
  source_id: osmf_verification_2026_10
  source_url: https://gc.nh.gov/rsa/html/X/126-Z/126-Z-mrg.htm
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: 'Individualized investigational treatment provisions are enacted in RSA 126-Z (definition I-c; immunity for individualized treatments administered at an eligible facility, 126-Z:3, III(e)); ''qualifying severe illness'' (chronic and debilitating) also covered. Caveat: the version shown on gc.nh.gov is labeled ''effective upon certified approval of a legislative report ... pursuant to 2026, 311:21'' and the currently-effective text is not displayed, so it is unclear whether these provisions came from 2024 ch. 124 or 2026 ch. 311 and whether they are yet in force; either way they were signed into law. NH is also in the reported list of enacting states.'
  evidence_quote: '"Individualized investigational treatment" means drugs, biologics, or devices unique to and produced exclusively for use for an individual patient, based on their own genetic profile, including but not limited to individualized gene therapy antisense oligonucleotides (ASO)'
  verification_status: corrected
- id: manufacturer_liability_shield
  value: true
  citation: N.H. Rev. Stat. Ann. § 126-Z:3, III
  source_id: osmf_verification_2026_10
  source_url: https://gc.nh.gov/rsa/html/X/126-Z/126-Z-3.htm
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: medium
  note: 'Immunity clause (not merely ''no private cause of action''), conditioned on terminal/qualifying severe illness, no comparable FDA-approved options, informed consent, and no ''willful or reckless misconduct or other bad faith conduct''. Ambiguous only as to timing: the displayed text is the version ''effective upon certified approval of a legislative report ... pursuant to 2026, 311:21'' (source: 2016, 206:2; 2024, 124:1; 2025, 304:3; 2026, 311:15 contingent); the currently effective version is not shown on gc.nh.gov. Best value true. RSA 126-Z:4, I also says nothing in the chapter creates a private cause of action except injunctive relief against regulators.'
  evidence_quote: a manufacturer of a drug, biologic, or device, a pharmacist, a health care facility, a health care provider, or a person or entity involved in the care of a patient using a drug, biologic, or device is immune from suit
  verification_status: ambiguous
- id: insurer_coverage_required
  value: false
  citation: N.H. Rev. Stat. Ann. § 126-Z:2, II
  source_id: osmf_verification_2026_10
  source_url: https://gc.nh.gov/rsa/html/X/126-Z/126-Z-mrg.htm
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: 'No coverage mandate (source: 2016, 206:2; 2024, 124:1; 2025, 304:6 eff. Jan. 1, 2026; not contingent).'
  evidence_quote: This chapter shall not require a health care insurer or any state agency to provide coverage for the cost of any investigational drug, biologic, or device.
  verification_status: confirmed
