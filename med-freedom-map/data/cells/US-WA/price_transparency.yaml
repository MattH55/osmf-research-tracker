- id: enforcement_mechanism
  value: From July 1, 2027, state law requires hospitals to comply with federal price transparency rules (45 CFR Part 180 as of Jan. 1, 2025) and submit their machine-readable file to the state department at least annually (new section in ch. 70.41 RCW, SB 5493 (2025)); the act specifies no penalty or separate enforcement mechanism.
