  evidence_quote: No individual health care provider, religiously sponsored health carrier, or health care facility may be required by law or contract in any circumstances to participate in the provision of or payment for a specific service if they object
  verification_status: ambiguous
  note: Stored false. Individual-provider conscience right (Guttmacher treats as general refusal law), but WAC 246-945-415(2) imposes a pharmacy-level duty to deliver lawfully prescribed drugs; individual pharmacist objection only workable if the pharmacy otherwise fills (Stormans v. Wiesman).
