  note: Chapter 69.77 contains only the 2017 c 212 sections, with no individualized-treatment provisions. Washington is not among the reported RTT 2.0 enacting states. Search budget was exhausted before a separate WA bill search, so this rests on the full chapter text and the lead lists. The stored note's wording is wrong; the value is right.
