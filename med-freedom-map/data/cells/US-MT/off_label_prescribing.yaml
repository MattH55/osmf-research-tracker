  note: Stored false. Protected actions under subsection (1)(c) include to 'offer, provide, or make available lawful health care services, including the off-label use of health care services as allowed under state law.' Subsection (3)(a) preserves board action for unprofessional conduct outside the protected actions.
  evidence_quote: A state agency ... or a private entity under contract with a health professional licensing board ... may not punish a health care provider ... for actions taken under this section. (b) The prohibition on punishment includes an adverse licensure action.
