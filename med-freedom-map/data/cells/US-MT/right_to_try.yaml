- id: individualized_rtt
  value: false
  citation: Mont. Code Ann. §§ 50-12-102, 50-12-104 (as amended by Ch. 413, L. 2023; Ch. 621, L. 2025)
  source_id: osmf_verification_2026_10
  source_url: https://leg.mt.gov/bills/mca/title_0500/chapter_0120/part_0010/section_0040/0500-0120-0010-0040.html
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: medium
  note: Montana is on the brief's lead list of RTT 2.0 states. In 2023 (SB 422, Ch. 413) it broadened its RTT Act to non-terminal patients, and in 2025 (Ch. 621) it added experimental treatment centers. But the current MCA Title 50 ch. 12 part 1 (101-110) contains no 'individualized investigational treatment' definition or patient-specific (genetic-profile) pathway. 'Experimental treatment' still requires completion of phase 1. Part 2 is palliative care. So Montana's law does not match the Goldwater individualized-treatment model (best value FALSE), although trackers may count the 2023 expansion as RTT 2.0. Stored TRUE kept as a possible alternative; needs human review.
  evidence_quote: 'A patient is eligible for an experimental treatment if the patient has: (1) evaluated other treatment options currently approved by the United States food and drug administration'
  verification_status: ambiguous
- id: manufacturer_liability_shield
  value: true
  citation: Mont. Code Ann. § 50-12-110
  source_id: osmf_verification_2026_10
  source_url: https://leg.mt.gov/bills/mca/title_0500/chapter_0120/part_0010/section_0100/0500-0120-0010-0100.html
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: 'This is an immunity: such a person ''is immune from suit for any harm done to the patient resulting from the investigational drug, biological product, or device''. It is qualified: the person must be ''complying in good faith with the terms of this act'' and have ''exercised reasonable care''.'
  evidence_quote: A manufacturer of an investigational drug, biological product, or device, a pharmacist, a health care facility, a health care provider, or a person or entity involved in the care of a patient
  verification_status: confirmed
