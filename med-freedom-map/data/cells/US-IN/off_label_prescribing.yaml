  evidence_quote: 'A pharmacist is not required to prescribe or dispense a hormonal contraceptive patch or self-administered hormonal contraceptive to a woman if the pharmacist: ... (2) objects on ethical, moral, or religious grounds.'
  verification_status: confirmed
  note: Scope limited to hormonal contraceptive patch / self-administered hormonal contraceptives; also covers technicians/interns. Guttmacher (Sept. 2026) marks it "specific to pharmacists and other pharmacy professionals".
