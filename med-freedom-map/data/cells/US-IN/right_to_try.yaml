  note: Indiana's RTT is split between IC 16-42-26 (manufacturer availability) and IC 25-22.5-1-2.1 (a patient with a terminal disease may receive experimental treatment). Source is the Indiana General Assembly's own code file (the code viewer page is JavaScript-only).
