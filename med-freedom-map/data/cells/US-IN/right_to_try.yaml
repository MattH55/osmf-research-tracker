  citation: IC 16-42-26-1 (P.L.2-2015)
  source_id: osmf_verification_2026_10
  source_url: https://iga.in.gov/ic/2026/Title_16.html
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  evidence_quote: This chapter does not require a manufacturer to make available any investigational drug, biological product, or device. As added by P.L.2-2015, SEC.3.
  verification_status: corrected
  note: The original RTT provisions were added by P.L.2-2015 (2015 session), which also amended IC 25-22.5-1-2.1 (P.L.2-2015, SEC.4). Stored 2017 is wrong.
- id: individualized_rtt
  value: true
  citation: IC 16-42-26.5 (P.L.215-2025)
  source_id: osmf_verification_2026_10
  source_url: https://iga.in.gov/ic/2026/Title_16.html
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: IC 16-42-26.5 'Individualized Investigational Treatment' was added by P.L.215-2025, SEC.30. Goldwater's April 2, 2026 release also lists Indiana among the Right to Try for Individualized Treatments states. Stored note wording does not match the dimension definition.
  evidence_quote: As used in this chapter, "individualized investigational treatment" means a drug, biological product, or device that is unique to and produced exclusively for use by an individual patient, based on the individual's own genetic profile.
  verification_status: confirmed
- id: manufacturer_liability_shield
  value: true
  citation: IC 16-42-26-5
  source_id: osmf_verification_2026_10
  source_url: https://iga.in.gov/ic/2026/Title_16.html
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: A 'no cause of action' clause (not an immunity), with no good-faith or reasonable-care qualifier. IC 16-42-26.5-6(d) has a parallel clause for individualized treatments, and IC 25-22.5-1-2.1(f) covers health care providers.
  evidence_quote: Sec. 5. This chapter does not create a cause of action against a manufacturer of an investigational drug, biological product, or device for any harm to a qualified patient resulting from use of an investigational drug
  verification_status: confirmed
