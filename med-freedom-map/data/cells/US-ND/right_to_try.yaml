  note: '''No private cause of action'' clause (not immunity); applies ''if the manufacturer or other person complied in good faith with the terms of this chapter'', and the chapter ''does not limit a private cause of action against a manufacturer or other person if there was a failure to exercise reasonable care.'''
  evidence_quote: This chapter does not create a private cause of action against a manufacturer of an investigational drug, biological product, or device or against any other person involved in the care of an eligible patient
