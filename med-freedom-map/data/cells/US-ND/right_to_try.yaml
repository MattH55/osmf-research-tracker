  note: 'Stored true is not supported. ND''s only RTT law (ch. 23-48) is the classic terminal-illness/phase-one model; no individualized-treatment provisions. Searched full ND bill indexes for 2019, 2021, 2023 and 2025 sessions (ndlegis.gov) for ''individualized'', ''investigational'', ''experimental drug'', ''23-48'', ''right to try'': no individualized-treatment bill found (ND has no regular session in 2026). ND is also not in the reported list of enacting states.'
