- id: manufacturer_liability_shield
  value: true
  citation: Right-to-Try Act § 6 (Act 33 of 2017)
  source_id: osmf_verification_2026_10
  source_url: https://www.palegis.us/statutes/unconsolidated/law-information/view-statute?txtType=PDF&SessYr=2017&ActNum=0033.&SessInd=0
  source_type: primary_statute
  verified_on: '2026-10-09'
  verified_by: OSMF verification pass 2026-10 (AI-assisted; quoted source)
  confidence: high
  note: 'Stored false is wrong. Section 6 is a ''no private cause of action'' clause (not an immunity) for injury resulting from the product, qualified: ''as long as the manufacturer or other person or entity acted in accordance with this act, except when the injury results from a failure to exercise reasonable care.'' (Separate § 5(a) immunity covers health care providers only.)'
  evidence_quote: Nothing in this act may be construed as creating a private cause of action against a manufacturer of an investigational drug, biological product or medical device
  verification_status: corrected
