name: Daily Research Tracker Update

on:
  schedule:
    # Run daily at 04:15 UTC (~late night / early morning US)
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      condition:
        description: 'Condition key to update (leave blank for day-of-year rotation)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - pacvs
          - me-cfs
          - long-covid
          - lyme
          - gulf-war-illness
          - other-post-viral
          - pots
          - mcas

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the updated JSON files
      actions: write    # needed to trigger the Pages deploy after the bot commit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0   # full history so we can commit cleanly

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pymed  # ensure for literature updater

      - name: Run research tracker updater
        run: python scripts/update_research_tracker.py
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: ${{ github.workspace }}
          TRACKER_CONDITION: ${{ github.event.inputs.condition }}

      - name: Run Clinical Trials Card Agent (daily)
        run: python clinical_trials/clinical_trials_agent.py
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: ${{ github.workspace }}

      - name: Run Therapeutic Agents Aggregator (daily)
        run: python aggregate_therapeutic_agents.py
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: ${{ github.workspace }}

      - name: Enhance Therapeutic Agents Clinical Notes (daily)
        run: python scripts/generate_detailed_notes.py
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: ${{ github.workspace }}

      - name: Build generated SEO pages (marker pages, comparisons, trials, pairs, digest, reports, sitemap)
        run: |
          mkdir -p data/clinical_trials
          cp clinical_trials/data/clinical_trials_current.json data/clinical_trials/clinical_trials_current.json
          python scripts/build_marker_pages.py
          python scripts/build_compare_pages.py
          python scripts/build_trial_pages.py
          python scripts/build_repurposing_index.py
          python scripts/build_pair_pages.py
          python scripts/build_digest.py
          python scripts/build_condition_feeds.py
          python scripts/build_reports.py
          python scripts/apply_osmf_chrome.py
          python scripts/build_site_seo.py
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: ${{ github.workspace }}
          PYTHONIOENCODING: utf-8

      - name: Commit and push updated data (if any changes)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/*.json data/clinical_trials/ clinical_trials/data/ clinical_trials/reports/
          git add biomarkers/ compare/ trials/ pairs/ digest/ feeds/ reports/ js/generated/ sitemap.xml index.html *.html disease-intelligence/

          # Only commit if something actually changed
          if git diff --cached --quiet; then
            echo "No changes to commit. Data files are up to date."
          else
            git commit -m "chore: daily research + clinical trials + therapeutic agents update [$(date +%Y-%m-%d)]"
            git push
            echo "Committed updated JSON files and reports."
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi
        id: commit

      # Pushes made with GITHUB_TOKEN never trigger other workflows, so the
      # Pages deploy has to be dispatched explicitly or the live site stays stale.
      - name: Trigger GitHub Pages deploy
        if: steps.commit.outputs.committed == 'true'
        run: gh workflow run deploy-pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
